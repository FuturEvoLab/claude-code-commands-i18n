  --term-shadow:0 20px 50px rgba(0,0,0,.45);

  --font-zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;

:root[data-skin="cyberpunk"]{
  --bg:#0c0717; --surface:#150d25; --surface-2:#1c1231; --ink:#f4eaff; --muted:#b39fd2; --line:#2f1e4a;

  --term-accent:#ff2bd6}
:root[data-skin="cyberpunk"] h1{text-shadow:2px 0 rgba(255,43,214,.55),-2px 0 rgba(0,240,255,.45)}
:root[data-skin="cyberpunk"] .card:hover,:root[data-skin="cyberpunk"] .scen:hover{border-color:#ff2bd6;box-shadow:0 0 0 1px #ff2bd6,0 0 22px rgba(255,43,214,.25)}

  --bg:#020804; --surface:#06120a; --surface-2:#0a1a0f; --ink:#c9f7d5; --muted:#6faf81; --line:#103a1c;
  --accent:#00ff41; --accent-ink:#001a08; --accent-soft:#0a2a14;
  --hero:#000000; --hero-2:#03100a; --hero-line:#0d3518; --hero-ink:#d6ffe0; --hero-muted:#6fbf85;

.rain{position:absolute;inset:0;width:100%;height:100%;opacity:.45;pointer-events:none;mask-image:linear-gradient(90deg,transparent 25%,#000 62%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 25%,#000 62%,#000)}

.h0{--h:168}.h1{--h:212}.h2{--h:262}.h3{--h:350}.h4{--h:24}.h5{--h:42}.h6{--h:140}.h7{--h:300}
.h8{--h:4}.h9{--h:196}.h10{--h:226}.h11{--h:88}.h12{--h:30}.h13{--h:220}.h14{--h:0}
[class*=" h"],[class^="h"]{--c:hsl(var(--h) var(--hue-s) var(--hue-l))}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{--body-font:var(--font-en)}
html[lang="ja"]{--body-font:var(--font-ja)}
html[lang="zh-CN"]{--body-font:var(--font-zh)}
html[lang="zh-Hant"]{--body-font:var(--font-tc)}
html[lang="ko"]{--body-font:var(--font-ko)}
body{background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.7;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px;word-break:break-word}
kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;padding:0 5px;opacity:.85}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}

/* Hero: always dark, a deliberate terminal look in both themes */
.hero{background:radial-gradient(1200px 400px at 85% -10%,var(--phos-glow),transparent 60%),linear-gradient(var(--hero),var(--hero));color:var(--hero-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:32px 32px;opacity:.35;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:20px 72px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topline .badge{margin-right:auto}
.badge{font-size:12px;color:var(--hero-muted);border:1px solid var(--hero-line);border-radius:999px;padding:3px 12px;background:var(--hero-tint)}
.badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}
/* Dropdowns (language, theme): native selects, restyled; the chevron is drawn with borders so it follows the theme */
.sel-wrap{position:relative;flex:none;display:inline-flex;align-items:center}
.sel-wrap::before{content:"";position:absolute;left:12px;width:13px;height:13px;border-radius:50%;pointer-events:none}
.lang-wrap::before{border:1.5px solid var(--hero-muted)}
.skin-wrap::before{background:var(--phos);box-shadow:0 0 0 2px var(--hero-tint),0 0 8px color-mix(in srgb,var(--phos) 50%,transparent)}
.sel-wrap::after{content:"";position:absolute;right:12px;width:6px;height:6px;border-right:1.5px solid var(--hero-muted);border-bottom:1.5px solid var(--hero-muted);transform:translateY(-2px) rotate(45deg);pointer-events:none}
.sel{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;color:var(--hero-ink);background:var(--hero-tint);border:1px solid var(--hero-line);border-radius:10px;padding:7px 32px;cursor:pointer;min-height:38px}
.sel:hover{border-color:var(--hero-muted)}
.sel:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.sel option{background:var(--surface);color:var(--ink)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:start;margin-top:34px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:26px;margin-top:24px}}
h1{font-size:clamp(32px,5.4vw,58px);font-weight:900;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance}
h1 .slash{font-family:var(--font-mono);color:var(--phos);font-weight:700;margin-right:.08em;text-shadow:0 0 24px color-mix(in srgb,var(--phos) 45%,transparent)}
.lead{color:var(--hero-muted);margin:0;max-width:60ch;font-size:15.5px}
.lead small{display:block;margin-top:10px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.stat b{display:block;font-family:var(--font-mono);font-size:30px;line-height:1.1;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--hero-muted);letter-spacing:.04em}
.term{background:var(--term-bg);border:1px solid var(--term-line);border-radius:14px;box-shadow:var(--term-shadow),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;min-width:0}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--term-line);font-size:12px;color:var(--term-muted)}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#3a465c;display:inline-block}
.term-bar i:nth-child(1){background:#f87171}.term-bar i:nth-child(2){background:#fbbf24}.term-bar i:nth-child(3){background:#34d399}
.term-bar span{margin-left:8px;font-family:var(--font-mono)}
.term-body{padding:18px 18px 20px;font-family:var(--font-mono);font-size:14px;height:212px;overflow:hidden}
.term{margin-top:18px}
@media (max-width:900px){.term{margin-top:0}}
.prompt-line{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.prompt-line .p{color:var(--term-accent)}
.typed{color:var(--term-ink);font-weight:700}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--term-accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu{margin:12px 0 0;padding:0;list-style:none;border-left:2px solid var(--term-line);height:132px}
.menu li{display:flex;gap:14px;padding:0 12px;height:33px;align-items:center;font-size:13px;color:var(--term-muted);min-width:0;white-space:nowrap}
.menu li b{color:var(--term-ink);font-weight:600;flex:none;min-width:8.5em}
.menu li.on{background:color-mix(in srgb,var(--term-accent) 12%,transparent);border-left:2px solid var(--term-accent);margin-left:-2px}
.menu li.on b{color:var(--term-accent)}
.menu li span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--body-font)}

/* Onboarding */
.intro{padding-block:28px 6px}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-58px;position:relative;z-index:2}
@media (max-width:1000px){.howto{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.howto{grid-template-columns:1fr}}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}

<script>
const META = /*META*/null;
const CATS = /*CATS*/[];
const CMDS = /*CMDS*/[];
const SCENS = /*SCENS*/[];
const RISKS = /*RISKS*/[];
const DISC = /*DISC*/null;
const RISK = Object.fromEntries(RISKS.map(r => [r.id, r]));
const HUE = Object.fromEntries(CATS.map((c, i) => [c.id, "h" + (i % 15)]));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Interface strings per language come from data/ui.json; a few use {placeholders}.
const UI = /*UI*/null;
const LANGINFO = /*LANGS*/[];
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);
for (const t of Object.values(UI)) {
  const raw = {count: t.count, since: t.since, removedIn: t.removedIn, copied: t.copied, foot: t.foot};
  t.count = n => fill(raw.count, {n});
  t.since = v => fill(raw.since, {v});
  t.removedIn = v => fill(raw.removedIn, {v});
  t.copied = c => fill(raw.copied, {c});
  t.foot = m => fill(raw.foot, {
    checked: esc(m.checked),
    sourceLink: `<a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">${esc(m.source)}</a>`,
    repoLink: `<a href="${esc(m.repo)}" target="_blank" rel="noopener noreferrer">${esc(m.repo)}</a>`
  });
}

const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const LANGS = LANGINFO.map(x => x.code);
$("lang").innerHTML = LANGINFO.map(x => `<option value="${esc(x.code)}" lang="${esc(x.html)}">${esc(x.name)}</option>`).join("");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang = "en", cat = "all", scen = null;

const slug = c => c.cmd.slice(1).replace(/ /g, "-");
// #ja or #ja-rewind; longer codes first so "zh-hant-…" is not read as "zh".
const LANG_RE = [...LANGS].sort((a, b) => b.length - a.length).map(x => x.replace(/-/g, "\\-")).join("|");
const HASH = new RegExp("^(" + LANG_RE + ")(?:-([a-z0-9-]+))?$").exec(location.hash.slice(1)) || [];
const TARGET = HASH[2] && CMDS.find(c => slug(c) === HASH[2]);

function pickLang(){
  if (HASH[1]) return HASH[1];
  try { const q = new URLSearchParams(location.search).get("lang"); if (LANGS.includes(q)) return q; } catch(e) {}
  // A link's #en/#ja/#zh or the visitor's last choice wins; otherwise English.
  try { const s = localStorage.getItem("lang"); if (LANGS.includes(s)) return s; } catch(e) {}
  return "en";
}

function riskTag(r, withName){
  const k = RISK[r];
  return `<span class="tag risk r-${r}" title="${esc(k.desc[lang].replace(/`/g, ""))}">${esc(k.icon)}${withName ? " " + esc(k.name[lang]) : ""}</span>`;
}

function setLang(l){
  lang = l;
  document.documentElement.lang = LANGINFO.find(x => x.code === l).html;
  try { localStorage.setItem("lang", l); } catch(e) {}
  $("lang").value = l;
  const t = UI[l];
  $("lang").setAttribute("aria-label", t.langLabel);
  document.querySelectorAll(".skin-sel").forEach(sel => {
    sel.setAttribute("aria-label", t.skin);
    [...sel.options].forEach(o => { o.textContent = t.skins[o.value]; });
    sel.querySelectorAll("optgroup").forEach(g => { g.label = t.skinGroups[g.dataset.g]; });
  });
  $("hint").textContent = t.hint;
  $("qclear").setAttribute("aria-label", t.qclear); $("qclear").title = t.qclear;
  $("badge").textContent = t.badge;
  $("h1").textContent = t.h1;
  document.title = t.h1;
  $("lead").innerHTML = esc(t.lead) + "<small>" + t.keys + "</small>";
  const live = CMDS.filter(c => c.kind !== "removed");
  const nums = [live.length, SCENS.length, CMDS.filter(c => (c.risk || []).length).length, LANGINFO.length];
  $("stats").innerHTML = nums.map((n, i) => `<div class="stat"><b>${n}</b><span>${esc(t.stats[i])}</span></div>`).join("");
  $("howto").innerHTML = t.howto.map(([ic, b, p]) => `<div><span class="ic">${esc(ic)}</span><b>${b}</b><p>${p}</p></div>`).join("");
  $("scen-h").textContent = t.scen; $("scen-d").textContent = t.scenD;
  $("safety-h").textContent = t.safety; $("safety-d").textContent = t.safetyD;
  $("safety").innerHTML = RISKS.map(r => `<li><b><span class="ri r-${r.id}">${esc(r.icon)}</span>${esc(r.name[l])}</b>${md(r.desc[l])}</li>`).join("");
  buildScens();
  $("q").placeholder = t.search;
  $("q").setAttribute("aria-label", t.search);
  $("totop").setAttribute("aria-label", t.top); $("totop").title = t.top;
  $("side").setAttribute("aria-label", t.nav);
  $("foot").innerHTML = `<h2>${t.disc}</h2><ol class="disc">${DISC[l].map(d => `<li><b>${esc(d.t)}</b>${esc(d.b)}</li>`).join("")}</ol>` + t.foot(META);
  buildNav();
  render();
  demoReset();
}

function buildScens(){
  $("scens").innerHTML = SCENS.map(s => `<button type="button" class="scen" data-s="${esc(s.id)}" aria-pressed="${s.id === scen}"><span class="q">${esc(s.q[lang])}</span><span class="pills">${s.cmds.map(c => `<span>${esc(c)}</span>`).join("")}</span></button>`).join("");
}
$("scens").addEventListener("click", e => {
  const b = e.target.closest(".scen"); if (!b) return;
  scen = scen === b.dataset.s ? null : b.dataset.s;
  buildScens(); render();
  if (scen) scrollToList();
});

// One nav model, drawn as sidebar (desktop) and chips (phone).
function navItems(){
  const t = UI[lang];
  return [
    {id: "all", label: t.all, n: CMDS.length},
    {id: "picks", label: "★ " + t.picks, n: CMDS.filter(c => c.pick).length},
    {id: "risky", label: "⚠ " + t.riskChip, n: CMDS.filter(c => (c.risk || []).length).length},
    null,
    ...CATS.map(c => ({id: c.id, label: c.name[lang], n: CMDS.filter(x => x.cat === c.id).length, hue: HUE[c.id]}))
  ];
}
function buildNav(){
  const items = navItems();
  const btn = (it, cls) => `<button type="button" class="${cls}${it.hue ? " " + it.hue : ""}" data-cat="${it.id}" aria-pressed="${it.id === cat}">${it.hue ? '<span class="dot"></span>' : ""}<span>${esc(it.label)}</span>${cls === "" ? `<em>${it.n}</em>` : ""}</button>`;
  $("side").innerHTML = items.map(it => it ? btn(it, "") : "<hr>").join("");
  $("chips").innerHTML = items.filter(Boolean).map(it => btn(it, "chip")).join("");
}
function pickCat(id){
  cat = id; if (scen) { scen = null; buildScens(); }
  document.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === id));
  render();
  scrollToList();
}
["side", "chips"].forEach(id => $(id).addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) pickCat(b.dataset.cat); }));

function card(c){
  const t = UI[lang];
  const tags = [
    c.pick ? `<span class="tag pick">${t.pick}</span>` : "",
    c.kind === "skill" ? `<span class="tag skill">${t.skill}</span>` : "",
    c.kind === "workflow" ? `<span class="tag workflow">${t.workflow}</span>` : "",
    c.kind === "removed" ? `<span class="tag removed">${c.removedIn ? t.removedIn(c.removedIn) : t.removed}</span>` : "",
    c.since ? `<span class="tag ver">${t.since(c.since)}</span>` : "",
    ...(c.risk || []).map(r => riskTag(r, true))
  ].join("");
  const gloss = lang === "en" ? "" : `<div class="gloss">${t.word} <b>${esc(c.word)}</b> ＝ ${esc(c.gloss[lang])}</div>`;
  const alias = c.aliases.length ? `<span>${t.alias}: ${c.aliases.map(a => `<code>${esc(a)}</code>`).join(" · ")}</span>` : "";
  return `<article class="card ${HUE[c.cat]}" id="c-${slug(c)}">
    <div class="card-head">
      <div class="top"><button class="cmd" type="button" data-c="${esc(c.cmd)}" title="${esc(t.copied(c.cmd))}">${esc(c.cmd)}</button>${c.args ? `<span class="args">${esc(c.args)}</span>` : ""}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      ${gloss}
    </div>
    <p class="what">${md(c.desc[lang])}</p>
    <div class="ex"><span class="lbl">${t.use}</span>${md(c.use[lang])}</div>
    <div class="card-foot">${alias}<button class="link" type="button" data-l="${slug(c)}" aria-label="${t.link}: ${esc(c.cmd)}">${t.link}</button></div>
  </article>`;
}

// Searchable text per command, built once per language.
const HAY = {};
function haystack(c){
  const m = HAY[lang] || (HAY[lang] = new Map());
  if (!m.has(c)) {
    const scenQ = SCENS.filter(s => s.cmds.includes(c.cmd)).map(s => s.q[lang]);
    m.set(c, [c.cmd, c.args, c.word, ...c.aliases, ...(c.risk || []).map(r => RISK[r].name[lang]), c.desc[lang], c.use[lang], c.short ? c.short[lang] : "", ...scenQ, lang !== "en" ? c.gloss[lang] : "", c.desc.en].join(" ").toLowerCase());
  }
  return m.get(c);
}
function matches(c, k){
  if (!k) return true;
  const hay = haystack(c);
  return k.split(/\s+/).every(w => hay.includes(w));
}

function render(){
  const t = UI[lang], k = $("q").value.trim().toLowerCase().replace(/^\//, "");
  let html = "", n = 0;
  const sc = SCENS.find(s => s.id === scen);
  if (sc) {
    const rows = sc.cmds.map(name => CMDS.find(c => c.cmd === name));
    $("list").innerHTML = `<section><div class="scen-bar"><h2>${esc(sc.q[lang])}</h2><button type="button" class="clear" id="clear-scen">${t.back}</button></div><div class="grid">${rows.map(card).join("")}</div></section>`;
    $("count").textContent = t.count(rows.length);
    $("clear-scen").onclick = () => { scen = null; buildScens(); render(); };
    return;
  }
  if (k) {
    // While searching: one flat grid, best matches first (name, then alias, then text).
    const inCat = c => ["all", "picks", "risky"].includes(cat) || c.cat === cat;
    const rank = c => { const n = c.cmd.slice(1); return n.startsWith(k) ? 0 : n.includes(k) ? 1 : c.aliases.some(a => a.includes(k)) ? 2 : c.pick ? 3 : 4; };
    const rows = CMDS.filter(c => inCat(c) && (cat !== "picks" || c.pick) && (cat !== "risky" || (c.risk || []).length) && matches(c, k))
      .sort((a, b) => rank(a) - rank(b));
    n = rows.length;
    if (n) html = `<section><div class="sec-head"><h2>${t.results}</h2><small>${t.count(n)}</small></div><div class="grid">${rows.map(card).join("")}</div></section>`;
  } else CATS.forEach(cg => {
    if (!["all", "picks", "risky"].includes(cat) && cat !== cg.id) return;
    const rows = CMDS.filter(c => c.cat === cg.id && (cat !== "picks" || c.pick) && (cat !== "risky" || (c.risk || []).length) && matches(c, k));
    if (!rows.length) return;
    n += rows.length;
    html += `<section class="${HUE[cg.id]}"><div class="sec-head"><span class="sw"></span><h2>${esc(cg.name[lang])}</h2><small>${t.count(rows.length)}</small></div><p class="sec-desc">${esc(cg.desc[lang])}</p><div class="grid">${rows.map(card).join("")}</div></section>`;
  });
  $("list").innerHTML = html || `<div class="empty"><p>${t.empty}</p><p>${t.suggest}</p><div class="empty-s">${SCENS.slice(0, 6).map(s => `<button type="button" data-s="${esc(s.id)}">${esc(s.q[lang])}</button>`).join("")}</div></div>`;
  $("count").textContent = t.count(n);
  active = -1;
  if (k) highlight(k.split(/\s+/).filter(Boolean));
}

// Wrap matches in <mark> by splitting text nodes, never by rewriting HTML.
function highlight(words){
  const re = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  $("list").querySelectorAll(".cmd, .what, .ex, .gloss").forEach(root => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const parts = node.nodeValue.split(re);
      if (parts.length < 2) return;
      const frag = document.createDocumentFragment();
      parts.forEach((part, i) => {
        if (!part) return;
        if (i % 2) { const m = document.createElement("mark"); m.textContent = part; frag.appendChild(m); }
        else frag.appendChild(document.createTextNode(part));
      });
      node.parentNode.replaceChild(frag, node);
    });
  });
}

// Search mode: while there is a query, hide the intro so results sit right under the bar.
let active = -1;
function syncSearchMode(){
  const on = $("q").value.trim() !== "";
  const was = document.body.classList.contains("searching");
  document.body.classList.toggle("searching", on);
  $("qclear").hidden = !on;
  $("khint").hidden = on;
  if (on && !was) scrollTo({top: 0, behavior: "instant"});
}
function setActive(i){
  const cards = [...$("list").querySelectorAll(".card")];
  if (!cards.length) return;
  active = Math.max(0, Math.min(cards.length - 1, i));
  cards.forEach((c, j) => c.classList.toggle("active", j === active));
  cards[active].scrollIntoView({block: "nearest", behavior: "instant"});
}
function copyCmd(c){
  try { navigator.clipboard.writeText(c).then(() => say(UI[lang].copied(c))).catch(() => say(c)); } catch(err) { say(c); }
}
function clearSearch(){ $("q").value = ""; syncSearchMode(); render(); }
function scrollToList(){
  const y = $("list").getBoundingClientRect().top + scrollY - $("bar").offsetHeight - 12;
  if (scrollY > y || y - scrollY > innerHeight * .4) scrollTo({top: y, behavior: REDUCED ? "auto" : "smooth"});
}

// Hero terminal: types an editor's pick, then shows a slash-menu of related commands.
const DEMO = CMDS.filter(c => c.pick);
let demoI = 0, demoTimer = null;
// Menu narrows as the command is typed; the target is pinned first, so rows never disappear.
function menuFor(c, typed){
  const live = CMDS.filter(x => x.kind !== "removed" && x !== c);
  const hits = live.filter(x => x.cmd.startsWith(typed));
  const fill = live.filter(x => x.cat === c.cat && !hits.includes(x));
  const rows = [c, ...hits, ...fill].slice(0, 4);
  return rows.map((x, i) => `<li class="${i ? "" : "on"}"><b>${esc(x.cmd)}</b><span>${esc((x.short || x.desc)[lang].replace(/`/g, "").split(/[。．.]\s?/)[0])}</span></li>`).join("");
}
function demoShow(c, typed){ $("typed").textContent = typed; $("menu").innerHTML = menuFor(c, typed); }
function demoReset(){
  clearTimeout(demoTimer);
  const c = DEMO[demoI % DEMO.length];
  demoShow(c, c.cmd);  // complete at rest
  if (!REDUCED) demoTimer = setTimeout(demoNext, 3200);
}
function demoNext(){
  const c = DEMO[++demoI % DEMO.length];
  let i = 1;
  const step = () => {
    demoShow(c, c.cmd.slice(0, i));
    if (i++ < c.cmd.length) demoTimer = setTimeout(step, 70);
    else demoTimer = setTimeout(demoNext, 3200);
  };
  step();
}

$("lang").addEventListener("change", e => setLang(e.target.value));
// Digital rain behind the banner for the Matrix theme: each column spells real slash
// commands top to bottom. Skips frames while the banner is off screen or hidden (search
// mode) and never runs with reduced motion.
const rain = (() => {
  const hero = $("hero"), cv = document.createElement("canvas");
  cv.className = "rain"; cv.setAttribute("aria-hidden", "true"); hero.prepend(cv);
  const words = CMDS.filter(c => c.kind !== "removed").map(c => c.cmd.replace(/ /g, ""));
  const pick = () => ({w: words[Math.random() * words.length | 0], i: 0, gap: 2 + (Math.random() * 6 | 0)});
  let raf = 0, last = 0, drops = [];
  const size = () => {
    cv.width = hero.clientWidth; cv.height = hero.clientHeight;
    drops = Array.from({length: Math.ceil(cv.width / 16)}, () => ({...pick(), y: Math.random() * cv.height / 16 | 0}));
  };
  const frame = t => {
    raf = requestAnimationFrame(frame);
    if (t - last < 66 || scrollY > cv.height || !hero.offsetParent) return;
    last = t;
    const g = cv.getContext("2d");
    g.fillStyle = "rgba(0,0,0,.09)"; g.fillRect(0, 0, cv.width, cv.height);
    g.font = "bold 14px monospace";
    drops.forEach((d, x) => {
      if (d.i > 0 && d.i <= d.w.length) {  // settle the previous head to plain green
        g.fillStyle = "#00ff41"; g.fillText(d.w[d.i - 1], x * 16, (d.y - 1) * 16);
      }
      if (d.i < d.w.length) { g.fillStyle = "#d6ffe0"; g.fillText(d.w[d.i], x * 16, d.y * 16); }
      d.i++; d.y++;
      if (d.i >= d.w.length + d.gap) Object.assign(d, pick());  // next command after a short gap
      if (d.y * 16 > cv.height + 32 && Math.random() > .9) Object.assign(d, pick(), {y: 0});
    });
  };
  addEventListener("resize", () => { if (raf) size(); }, {passive: true});
  return {
    on() { if (raf || REDUCED) return; size(); raf = requestAnimationFrame(frame); },
    off() { cancelAnimationFrame(raf); raf = 0; cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); }
  };
})();
function setSkin(k){
  if (k === "matrix") rain.on(); else rain.off();
  if (k === "terminal") document.documentElement.removeAttribute("data-skin");
  else document.documentElement.setAttribute("data-skin", k);
  document.querySelectorAll(".skin-sel").forEach(sel => { sel.value = k; });
  try { localStorage.setItem("skin", k); } catch(e) {}
}
document.querySelectorAll(".skin-sel").forEach(sel => sel.addEventListener("change", e => setSkin(e.target.value)));
setSkin(document.documentElement.getAttribute("data-skin") || "terminal");
$("list").addEventListener("click", e => {
  const s = e.target.closest(".empty-s button"); if (!s) return;
  $("q").value = ""; syncSearchMode(); scen = s.dataset.s; buildScens(); render();
});
let typingTimer = 0;
$("q").addEventListener("input", () => {
  if (scen) { scen = null; buildScens(); }
  syncSearchMode();
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { typingTimer = 0; render(); }, 60);  // one render per pause in typing
});
$("q").addEventListener("keydown", e => {
  // Arrow keys and Enter act on the latest query, even mid-debounce.
  if (typingTimer && /^(ArrowDown|ArrowUp|Enter)$/.test(e.key)) { clearTimeout(typingTimer); typingTimer = 0; render(); }
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const list = $("list").querySelectorAll(".card");
    if (list.length) copyCmd(list[Math.max(active, 0)].querySelector(".cmd").dataset.c);
  }
  else if (e.key === "Escape") { if ($("q").value) clearSearch(); else $("q").blur(); }
});
$("qclear").onclick = () => { clearSearch(); $("q").focus(); };
$("brand").onclick = () => { clearSearch(); scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"}); };
const toast = $("toast"); let tt;
function say(s){ toast.textContent = s; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 1600); }
$("list").addEventListener("click", e => {
  const lk = e.target.closest(".link");
  if (lk) {
    const url = META.site + "#" + lang + "-" + lk.dataset.l;
    try { navigator.clipboard.writeText(url).then(() => say(UI[lang].copiedLink)).catch(() => say(url)); } catch(err) { say(url); }
    return;
  }
  const b = e.target.closest(".cmd"); if (!b) return;
  const c = b.dataset.c;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say(UI[lang].selected); };
  try { navigator.clipboard.writeText(c).then(() => say(UI[lang].copied(c))).catch(fallback); } catch(err) { fallback(); }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); $("q").focus(); $("q").select(); }
});
const totop = $("totop");
addEventListener("scroll", () => { totop.hidden = scrollY < 900; }, {passive: true});
totop.onclick = () => scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"});
setLang(pickLang());
if (TARGET) {
  const el = $("c-" + slug(TARGET));
  if (el) { el.scrollIntoView({block: "start", behavior: "instant"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
}
</script>
