hoose how much history to include and confirm before anything is sent.","ja":"不具合の報告や会話の共有をします。添付する履歴の量を選び、同意画面で確認してから送信されます。","zh":"报告 bug 或分享对话。你可以选择附带多少会话记录，并在同意页面确认后才会发送。","zh-hant":"回報 bug 或分享你的對話；你可以選擇要附上多少紀錄，而且在送出任何內容前都會請你確認。","ko":"버그를 신고하거나 대화를 공유합니다. 기록을 얼마나 포함할지 직접 고르고, 전송 전에 확인합니다.","ru":"Сообщает об ошибке или делится разговором; вы выбираете, сколько истории включить, и подтверждаете перед отправкой.","es":"Informa de un error o comparte tu conversación; tú eliges cuánto historial incluir y confirmas antes de que se envíe nada."},"use":{"en":"When Claude Code itself misbehaves.","ja":"明らかに Claude Code 自体の不具合に出会ったとき。","zh":"遇到明显是 Claude Code 本身的故障时。","zh-hant":"Claude Code 本身出現異常時。","ko":"Claude Code 자체가 이상하게 동작할 때.","ru":"Когда сбоит сам Claude Code.","es":"Cuando el propio Claude Code se comporta mal."}},{"cmd":"/debug","args":"[description]","cat":"support","kind":"skill","pick":false,"aliases":[],"word":"debug","gloss":{"zh":"调试","ja":"デバッグ","zh-hant":"除錯","ko":"디버그","ru":"отладка","es":"depurar"},"desc":{"en":"Enables debug logging from this point and troubleshoots by reading the session debug log. Optionally describe the issue.","ja":"このセッションのデバッグログを有効にし、ログを読んで問題を調べます。実行した時点から記録。問題の説明を添えられます。","zh":"为当前会话开启调试日志，并通过阅读日志排查问题。从运行时刻开始记录；可附上问题描述。","zh-hant":"從現在開始啟用除錯紀錄，並透過閱讀工作階段的除錯紀錄來排查問題。可以附上問題描述。","ko":"지금부터 디버그 로그를 켜고, 세션 디버그 로그를 읽어 문제를 해결합니다. 문제 내용을 설명할 수도 있습니다.","ru":"Включает журнал отладки с этого момента и ищет причину проблемы, читая журнал отладки сессии. Можно описать проблему.","es":"Activa el registro de depuración desde este momento y busca el problema leyendo el registro de depuración de la sesión. Opcionalmente, describe el problema."},"use":{"en":"`/debug the MCP server keeps failing to connect`.","ja":"`/debug MCP サーバーにつながらない`。","zh":"`/debug MCP 服务器一直连不上`。","zh-hant":"`/debug MCP 伺服器一直連不上`。","ko":"`/debug MCP 서버 연결이 계속 실패해`.","ru":"`/debug сервер MCP никак не подключается`.","es":"`/debug el servidor MCP no logra conectarse`."}},{"cmd":"/exit","args":"","cat":"support","kind":"builtin","pick":false,"aliases":["/quit"],"word":"exit","gloss":{"zh":"退出","ja":"終了","zh-hant":"離開","ko":"종료","ru":"выход","es":"salir"},"desc":{"en":"Exits the CLI. In an attached background session it detaches and the session keeps running.","ja":"CLI を終了します。接続中のバックグラウンドセッションでは切断だけで、セッションは動き続けます。","zh":"退出命令行。在已连接的后台会话中，它只是断开，会话继续运行。","zh-hant":"離開 CLI。在已連接的背景工作階段中，它只會中斷連接，工作階段會繼續執行。","ko":"CLI를 종료합니다. 연결된 백그라운드 세션에서는 분리만 되고 세션은 계속 실행됩니다.","ru":"Закрывает CLI. В подключённой фоновой сессии отключается от неё, а сессия продолжает работать.","es":"Sale de la CLI. En una sesión en segundo plano conectada, se desconecta y la sesión sigue en marcha."},"use":{"en":"Done for the day.","ja":"今日の作業を終えるとき。","zh":"今天收工。","zh-hant":"今天的工作結束了。","ko":"오늘 작업을 마칠 때.","ru":"Работа на сегодня закончена.","es":"Terminaste por hoy."}},{"cmd":"/feedback","args":"[report]","cat":"support","kind":"builtin","pick":false,"aliases":[],"risk":["external","secrets"],"word":"feedback","gloss":{"zh":"反馈","ja":"フィードバック","zh-hant":"意見回饋","ko":"피드백","ru":"отзыв","es":"comentarios"},"desc":{"en":"Sends product feedback using the same dialog and consent step as `/bug`.","ja":"製品へのフィードバックを送ります。`/bug` と同じ画面・同意手順です。","zh":"发送产品反馈，使用与 `/bug` 相同的对话框和同意步骤。","zh-hant":"用和 `/bug` 相同的對話框和同意步驟送出產品意見。","ko":"`/bug`와 같은 대화상자와 동의 단계를 거쳐 제품 피드백을 보냅니다.","ru":"Отправляет отзыв о продукте через то же окно и с тем же шагом согласия, что и `/bug`.","es":"Envía comentarios sobre el producto con el mismo diálogo y el mismo paso de consentimiento que `/bug`."},"use":{"en":"Request a feature.","ja":"ほしい機能があれば伝える。","zh":"想要某个新功能时告诉官方。","zh-hant":"想要求新功能時。","ko":"원하는 기능을 요청합니다.","ru":"Попросить новую функцию.","es":"Pide una función nueva."}},{"cmd":"/heapdump","args":"","cat":"support","kind":"builtin","pick":false,"aliases":[],"risk":["secrets"],"word":"heap dump","gloss":{"zh":"内存快照","ja":"ヒープダンプ（メモリーの記録）","zh-hant":"堆積傾印（記憶體快照）","ko":"힙 덤프 (메모리 기록)","ru":"дамп кучи (снимок памяти)","es":"volcado de heap (registro de la memoria)"},"desc":{"en":"Writes a heap snapshot and memory breakdown to the Desktop for diagnosing high memory. Share only the `-diagnostics.json`; the `.heapsnapshot` contains your conversation and credentials. Hidden from the menu.","ja":"JavaScript のヒープスナップショットとメモリー内訳をデスクトップに書き出し、メモリー使用量が多い問題を調べます。報告時は `-diagnostics.json` だけ添付。`.heapsnapshot` には会話全体と認証情報が含まれるので共有しないこと。メニューには出ないので全部入力。","zh":"把 JavaScript 内存快照和内存明细写到桌面，用于排查内存占用过高。报告问题时只附 `-diagnostics.json`；`.heapsnapshot` 含完整对话和凭据，不要分享。菜单中隐藏，需完整输入。","zh-hant":"把 heap 快照和記憶體明細寫到桌面，用來診斷記憶體用量過高的問題。只分享 `-diagnostics.json`；`.heapsnapshot` 含有你的對話和登入憑證。選單中不會顯示。","ko":"메모리 사용량이 높을 때 진단할 수 있도록 힙 스냅샷과 메모리 내역을 데스크톱에 저장합니다. `-diagnostics.json`만 공유하세요. `.heapsnapshot`에는 대화 내용과 인증 정보가 들어 있습니다. 메뉴에는 보이지 않습니다.","ru":"Записывает снимок кучи и разбивку по памяти на рабочий стол, чтобы разобраться с большим расходом памяти. Делитесь только файлом `-diagnostics.json`; файл `.heapsnapshot` содержит ваш разговор и учётные данные. Скрыта в меню.","es":"Escribe en el Escritorio una instantánea del heap y un desglose de la memoria para diagnosticar un uso alto de memoria. Comparte solo el `-diagnostics.json`; el `.heapsnapshot` contiene tu conversación y tus credenciales. Está oculto en el menú."},"use":{"en":"Report a memory blow-up.","ja":"数 GB のメモリーを使っているとき、報告用に。","zh":"Claude Code 占用好几 GB 内存时，用于向官方报告。","zh-hant":"回報記憶體用量暴增的問題。","ko":"메모리 사용량이 폭증했을 때 신고용으로.","ru":"Сообщить о резком росте расхода памяти.","es":"Informar de un consumo de memoria descontrolado."}},{"cmd":"/release-notes","args":"","cat":"support","kind":"builtin","pick":false,"aliases":[],"word":"release notes","gloss":{"zh":"版本更新说明","ja":"リリースノート","zh-hant":"版本更新說明","ko":"릴리스 노트","ru":"примечания к выпуску","es":"notas de la versión"},"desc":{"en":"Views the changelog in a version picker; notes appear without entering Claude's context.","ja":"バージョンを選んで更新履歴を表示します。表示はされますが、Claude の会話には入りません。","zh":"在版本选择器中查看更新日志。内容显示在记录里，但不会进入 Claude 的上下文。","zh-hant":"在版本選擇器中查看更新紀錄；內容會顯示出來，但不會進入 Claude 的上下文。","ko":"버전 선택 화면에서 변경 내역을 봅니다. 내용은 Claude의 컨텍스트에 들어가지 않습니다.","ru":"Показывает список изменений с выбором версии; заметки не попадают в контекст Claude.","es":"Muestra el registro de cambios en un selector de versiones; las notas aparecen sin entrar en el contexto de Claude."},"use":{"en":"See what's new after an update.","ja":"アップデート後に新機能を確認。","zh":"升级后看看有什么新功能。","zh-hant":"更新之後看看有什麼新功能。","ko":"업데이트 후 새로운 점을 확인합니다.","ru":"Посмотреть, что нового после обновления.","es":"Mira qué hay de nuevo después de una actualización."}},{"cmd":"/restart","args":"","cat":"support","kind":"builtin","pick":false,"aliases":["/update"],"since":"2.1.288","word":"restart","gloss":{"zh":"重启","ja":"再起動","zh-hant":"重新啟動","ko":"재시작","ru":"перезапустить","es":"reiniciar"},"desc":{"en":"Restarts Claude Code and resumes the session to apply an installed update. Requires Pro, Max or Ultra and a native macOS or Linux install (not WSL).","ja":"Claude Code を再起動してこのセッションを再開し、インストール済みの更新を反映します。Pro・Max・Ultra と、macOS／Linux のネイティブインストールが必要（WSL 不可）。","zh":"重启 Claude Code 并恢复当前会话，以应用已安装的更新。需要 Pro、Max 或 Ultra，以及 macOS/Linux 的原生安装（不支持 WSL）。","zh-hant":"重新啟動 Claude Code 並恢復工作階段，以套用已安裝的更新。需要 Pro、Max 或 Ultra，以及在 macOS 或 Linux 上的原生安裝（不支援 WSL）。","ko":"설치된 업데이트를 적용하기 위해 Claude Code를 재시작하고 세션을 이어갑니다. Pro, Max 또는 Ultra와 macOS·Linux 네이티브 설치(WSL 제외)가 필요합니다.","ru":"Перезапускает Claude Code и возобновляет сессию, чтобы применить установленное обновление. Нужны Pro, Max или Ultra и нативная установка на macOS или Linux (не WSL).","es":"Reinicia Claude Code y retoma la sesión para aplicar una actualización instalada. Requiere Pro, Max o Ultra y una instalación nativa en macOS o Linux (no WSL)."},"use":{"en":"When the footer offers it after an update.","ja":"下部に更新の案内が出たら実行。","zh":"底部提示更新已安装时运行。","zh-hant":"更新後底部出現提示時。","ko":"업데이트 후 하단에 안내가 나올 때.","ru":"Когда нижняя строка предлагает это после обновления.","es":"Cuando el pie de pantalla lo ofrece tras un без проверки к рабочим системам, важным данным или чужим репозиториям."},{"t":"Берегите секреты и личные данные","b":"Не вставляйте в запросы API-ключи, пароли, токены или личные данные других людей. Экспортированные разговоры, отчёты об ошибках и снимки памяти могут их содержать; проверяйте их, прежде чем делиться."},{"t":"Примеры приведены для наглядности","b":"Примеры «лучшего применения» объясняют назначение команды; это не инструкции для вашего окружения. Доступность зависит от версии, тарифа, платформы и политики организации."},{"t":"Эта страница не следит за вами","b":"Страница не использует cookie, аналитику, сторонние скрипты или шрифты. Она хранит только выбранный вами язык, локально в вашем браузере."},{"t":"Ограничение ответственности","b":"В максимальной степени, допустимой законом, авторы и участники проекта не несут ответственности за любой ущерб от использования этого проекта, включая потерю данных, расходы, инциденты безопасности или перебои в работе сервисов."}],"es":[{"t":"Proyecto no oficial","b":"Es un proyecto de la comunidad, sin relación con Anthropic y sin su patrocinio ni respaldo. «Claude», «Claude Code» y las marcas relacionadas son marcas comerciales de Anthropic y aquí se usan solo para identificar el producto descrito."},{"t":"Puede estar desactualizado o tener errores","b":"Cada descripción es una paráfrasis simplificada de la documentación oficial, ofrecida «tal cual», sin garantía de ningún tipo, ni expresa ni implícita. Claude Code cambia a menudo: se añaden, renombran y eliminan comandos. Si este proyecto y la documentación oficial no coinciden, manda la documentación oficial."},{"t":"Úsalo bajo tu propio riesgo","b":"Algunos comandos cambian o revierten archivos, ejecutan comandos, suben código, envían datos a servicios externos o consumen uso de pago. Entiende qué hace un comando antes de ejecutarlo, haz commit o una copia de seguridad antes, y no lo uses sin revisarlo en sistemas de producción, datos importantes o repositorios const LANGINFO = [{"code":"en","name":"English","html":"en","readme":"README.md"},{"code":"ja","name":"日本語","html":"ja","readme":"README.ja.md"},{"code":"zh","name":"简体中文","html":"zh-CN","readme":"README.zh-CN.md"},{"code":"zh-hant","name":"繁體中文","html":"zh-Hant","readme":"README.zh-Hant.md"},{"code":"ko","name":"한국어","html":"ko","readme":"README.ko.md"},{"code":"ru","name":"Русский","html":"ru","readme":"README.ru.md"},{"code":"es","name":"Español","html":"es","readme":"README.es.md"}];
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);
for (const t of Object.values(UI)) {
  const raw = {count: t.count, since: t.since, removedIn: t.removedIn, copied: t.copied, foot: t.foot};
  t.count = n => fill(raw.count, {n});
  t.since = v => fill(raw.since, {v});
  t.removedIn = v => fill(raw.removedIn, {v});
  t.copied = c => fill(raw.copied, {c});
  t.foot = m => fill(raw.foot, {
    checked: esc(m.checked),
    sourceLink: `<a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">${esc(m.source)}</a>`,
    repoLink: `<a href="${esc(m.repo)}" target="_blank" rel="noopener noreferrer">${esc(m.repo)}</a>`
  });
}

const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const LANGS = LANGINFO.map(x => x.code);

const slug = c => c.cmd.slice(1).replace(/ /g, "-");

const LANG_RE = [...LANGS].sort((a, b) => b.length - a.length).map(x => x.replace(/-/g, "\\-")).join("|");
const HASH = new RegExp("^(" + LANG_RE + ")(?:-([a-z0-9-]+))?$").exec(location.hash.slice(1)) || [];
const TARGET = HASH[2] && CMDS.find(c => slug(c) === HASH[2]);

function pickLang(){
  if (HASH[1]) return HASH[1];
  // A link's #en/#ja/#zh or the visitor's last choice wins; otherwise English.
  try { const s = localStorage.getItem("lang"); if (LANGS.includes(s)) return s; } catch(e) {}
  return "en";
}

function riskTag(r, withName){
  const k = RISK[r];
  return `<span class="tag risk r-${r}" title="${esc(k.desc[lang].replace(/`/g, ""))}">${esc(k.icon)}${withName ? " " + esc(k.name[lang]) : ""}</span>`;
}

function buildScens(){
  $("scens").innerHTML = SCENS.map(s => `<button type="button" class="scen" data-s="${esc(s.id)}" aria-pressed="${s.id === scen}"><span class="q">${esc(s.q[lang])}</span><span class="pills">${s.cmds.map(c => `<span>${esc(c)}</span>`).join("")}</span></button>`).join("");
}
$("scens").addEventListener("click", e => {

// One nav model, drawn as sidebar (desktop) and chips (phone).
function navItems(){

  return [
    {id: "all", label: t.all, n: CMDS.length},
    {id: "picks", label: "★ " + t.picks, n: CMDS.filter(c => c.pick).length},

function buildNav(){

  const btn = (it, cls) => `<button type="button" class="${cls}${it.hue ? " " + it.hue : ""}" data-cat="${it.id}" aria-pressed="${it.id === cat}">${it.hue ? '<span class="dot"></span>' : ""}<span>${esc(it.label)}</span>${cls === "" ? `<em>${it.n}</em>` : ""}</button>`;
  $("side").innerHTML = items.map(it => it ? btn(it, "") : "<hr>").join("");

}
function pickCat(id){

["side", "chips"].forEach(id => $(id).addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) pickCat(b.dataset.cat); }));

function card(c){
  const t = UI[lang];
  const tags = [
    c.pick ? `<span class="tag pick">${t.pick}</span>` : "",
    c.kind === "skill" ? `<span class="tag skill">${t.skill}</span>` : "",
    c.kind === "workflow" ? `<span class="tag workflow">${t.workflow}</span>` : "",
    c.kind === "removed" ? `<span class="tag removed">${c.removedIn ? t.removedIn(c.removedIn) : t.removed}</span>` : "",
    c.since ? `<span class="tag ver">${t.since(c.since)}</span>` : "",
    ...(c.risk || []).map(r => riskTag(r, true))
  ].join("");
  const gloss = lang === "en" ? "" : `<div class="gloss">${t.word} <b>${esc(c.word)}</b> ＝ ${esc(c.gloss[lang])}</div>`;
  const alias = c.aliases.length ? `<span>${t.alias}: ${c.aliases.map(a => `<code>${esc(a)}</code>`).join(" · ")}</span>` : "";
  return `<article class="card ${HUE[c.cat]}" id="c-${slug(c)}">

      <div class="top"><button class="cmd" type="button" data-c="${esc(c.cmd)}" title="${esc(t.copied(c.cmd))}">${esc(c.cmd)}</button>${c.args ? `<span class="args">${esc(c.args)}</span>` : ""}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}

    <div class="card-foot">${alias}<button class="link" type="button" data-l="${slug(c)}" aria-label="${t.link}: ${esc(c.cmd)}">${t.link}</button></div>
  </article>`;
}

// Searchable text per command, built once per language.
const HAY = {};
function haystack(c){
  const m = HAY[lang] || (HAY[lang] = new Map());
  if (!m.has(c)) {
    const scenQ = SCENS.filter(s => s.cmds.includes(c.cmd)).map(s => s.q[lang]);
    m.set(c, [c.cmd, c.args, c.word, ...c.aliases, ...(c.risk || []).map(r => RISK[r].name[lang]), c.desc[lang], c.use[lang], c.short ? c.short[lang] : "", ...scenQ, lang !== "en" ? c.gloss[lang] : "", c.desc.en].join(" ").toLowerCase());
  }
  return m.get(c);
}
function matches(c, k){
  if (!k) return true;
  const hay = haystack(c);
  return k.split(/\s+/).every(w => hay.includes(w));
}

    $("list").innerHTML = `<section><div class="scen-bar"><h2>${esc(sc.q[lang])}</h2><button type="button" class="clear" id="clear-scen">${t.back}</button></div><div class="grid">${rows.map(card).join("")}</div></section>`;
    $("count").textContent = t.count(rows.length);
    $("clear-scen").onclick = () => { scen = null; buildScens(); render(); };
    return;
  }
  if (k) {
    // While searching: one flat grid, best matches first (name, then alias, then text).
    const inCat = c => ["all", "picks", "risky"].includes(cat) || c.cat === cat;
    const rank = c => { const n = c.cmd.slice(1); return n.startsWith(k) ? 0 : n.includes(k) ? 1 : c.aliases.some(a => a.includes(k)) ? 2 : c.pick ? 3 : 4; };
    const rows = CMDS.filter(c => inCat(c) && (cat !== "picks" || c.pick) && (cat !== "risky" || (c.risk || []).length) && matches(c, k))
      .sort((a, b) => rank(a) - rank(b));
    n = rows.length;
    if (n) html = `<section><div class="sec-head"><h2>${t.results}</h2><small>${t.count(n)}</small></div><div class="grid">${rows.map(card).join("")}</div></section>`;
  } else CATS.forEach(cg => {
    if (!["all", "picks", "risky"].includes(cat) && cat !== cg.id) return;
    const rows = CMDS.filter(c => c.cat === cg.id && (cat !== "picks" || c.pick) && (cat !== "risky" || (c.risk || []).length) && matches(c, k));
    if (!rows.length) return;
    n += rows.length;
    html += `<section class="${HUE[cg.id]}"><div class="sec-head"><span class="sw"></span><h2>${esc(cg.name[lang])}</h2><small>${t.count(rows.length)}</small></div><p class="sec-desc">${esc(cg.desc[lang])}</p><div class="grid">${rows.map(card).join("")}</div></section>`;
  });
  $("list").innerHTML = html || `<div class="empty"><p>${t.empty}</p><p>${t.suggest}</p><div class="empty-s">${SCENS.slice(0, 6).map(s => `<button type="button" data-s="${esc(s.id)}">${esc(s.q[lang])}</button>`).join("")}</div></div>`;
  $("count").textContent = t.count(n);
  active = -1;
  if (k) highlight(k.split(/\s+/).filter(Boolean));
}

// Wrap matches in <mark> by splitting text nodes, never by rewriting HTML.
function highlight(words){
  const re = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  $("list").querySelectorAll(".cmd, .what, .ex, .gloss").forEach(root => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const parts = node.nodeValue.split(re);
      if (parts.length < 2) return;
      const frag = document.createDocumentFragment();
      parts.forEach((part, i) => {
        if (!part) return;
        if (i % 2) { const m = document.createElement("mark"); m.textContent = part; frag.appendChild(m); }
        else frag.appendChild(document.createTextNode(part));
      });
      node.parentNode.replaceChild(frag, node);
    });
  });
}

// Search mode: while there is a query, hide the intro so results sit right under the bar.
let active = -1;
function syncSearchMode(){
  const on = $("q").value.trim() !== "";
  const was = document.body.classList.contains("searching");
  document.body.classList.toggle("searching", on);
  $("qclear").hidden = !on;
  $("khint").hidden = on;
  if (on && !was) scrollTo({top: 0, behavior: "instant"});
}
function setActive(i){
  const cards = [...$("list").querySelectorAll(".card")];
  if (!cards.length) return;
  active = Math.max(0, Math.min(cards.length - 1, i));
  cards.forEach((c, j) => c.classList.toggle("active", j === active));
  cards[active].scrollIntoView({block: "nearest", behavior: "instant"});
}
function copyCmd(c){
  try { navigator.clipboard.writeText(c).then(() => say(UI[lang].copied(c))).catch(() => say(c)); } catch(err) { say(c); }
}
function clearSearch(){ $("q").value = ""; syncSearchMode(); render(); }
function scrollToList(){
  const y = $("list").getBoundingClientRect().top + scrollY - $("bar").offsetHeight - 12;
  if (scrollY > y || y - scrollY > innerHeight * .4) scrollTo({top: y, behavior: REDUCED ? "auto" : "smooth"});
}

// Hero terminal: types an editor's pick, then shows a slash-menu of related commands.
const DEMO = CMDS.filter(c => c.pick);
let demoI = 0, demoTimer = null;
// Menu narrows as the command is typed; the target is pinned first, so rows never disappear.
function menuFor(c, typed){
  const live = CMDS.filter(x => x.kind !== "removed" && x !== c);
  const hits = live.filter(x => x.cmd.startsWith(typed));
  const fill = live.filter(x => x.cat === c.cat && !hits.includes(x));
  const rows = [c, ...hits, ...fill].slice(0, 4);
  return rows.map((x, i) => `<li class="${i ? "" : "on"}"><b>${esc(x.cmd)}</b><span>${esc((x.short || x.desc)[lang].replace(/`/g, "").split(/[。．.]\s?/)[0])}</span></li>`).join("");
}
function demoShow(c, typed){ $("typed").textContent = typed; $("menu").innerHTML = menuFor(c, typed); }
function demoReset(){
  clearTimeout(demoTimer);
  const c = DEMO[demoI % DEMO.length];
  demoShow(c, c.cmd);  // complete at rest
  if (!REDUCED) demoTimer = setTimeout(demoNext, 3200);
}
function demoNext(){
  const c = DEMO[++demoI % DEMO.length];
  let i = 1;
  const step = () => {
    demoShow(c, c.cmd.slice(0, i));
    if (i++ < c.cmd.length) demoTimer = setTimeout(step, 70);
    else demoTimer = setTimeout(demoNext, 3200);
  };
  step();
}

$("lang").addEventListener("change", e => setLang(e.target.value));
// Digital rain behind the banner for the Matrix theme: each column spells real slash
// commands top to bottom. Skips frames while the banner is off screen or hidden (search
// mode) and never runs with reduced motion.
const rain = (() => {
  const hero = $("hero"), cv = document.createElement("canvas");
  cv.className = "rain"; cv.setAttribute("aria-hidden", "true"); hero.prepend(cv);
  const words = CMDS.filter(c => c.kind !== "removed").map(c => c.cmd.replace(/ /g, ""));
  const pick = () => ({w: words[Math.random() * words.length | 0], i: 0, gap: 2 + (Math.random() * 6 | 0)});
  let raf = 0, last = 0, drops = [];
  const size = () => {
    cv.width = hero.clientWidth; cv.height = hero.clientHeight;
    drops = Array.from({length: Math.ceil(cv.width / 16)}, () => ({...pick(), y: Math.random() * cv.height / 16 | 0}));
  };
  const frame = t => {
    raf = requestAnimationFrame(frame);
    if (t - last < 66 || scrollY > cv.height || !hero.offsetParent) return;
    last = t;
    const g = cv.getContext("2d");
    g.fillStyle = "rgba(0,0,0,.09)"; g.fillRect(0, 0, cv.width, cv.height);
    g.font = "bold 14px monospace";
    drops.forEach((d, x) => {
      if (d.i > 0 && d.i <= d.w.length) {  // settle the previous head to plain green
        g.fillStyle = "#00ff41"; g.fillText(d.w[d.i - 1], x * 16, (d.y - 1) * 16);
      }
      if (d.i < d.w.length) { g.fillStyle = "#d6ffe0"; g.fillText(d.w[d.i], x * 16, d.y * 16); }
      d.i++; d.y++;
      if (d.i >= d.w.length + d.gap) Object.assign(d, pick());  // next command after a short gap
      if (d.y * 16 > cv.height + 32 && Math.random() > .9) Object.assign(d, pick(), {y: 0});
    });
  };
  addEventListener("resize", () => { if (raf) size(); }, {passive: true});
  return {
    on() { if (raf || REDUCED) return; size(); raf = requestAnimationFrame(frame); },
    off() { cancelAnimationFrame(raf); raf = 0; cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); }
  };
})();
function setSkin(k){
  if (k === "matrix") rain.on(); else rain.off();
  if (k === "terminal") document.documentElement.removeAttribute("data-skin");
  else document.documentElement.setAttribute("data-skin", k);
  document.querySelectorAll(".skin-sel").forEach(sel => { sel.value = k; });
  try { localStorage.setItem("skin", k); } catch(e) {}
}
document.querySelectorAll(".skin-sel").forEach(sel => sel.addEventListener("change", e => setSkin(e.target.value)));
setSkin(document.documentElement.getAttribute("data-skin") || "terminal");
$("list").addEventListener("click", e => {
  const s = e.target.closest(".empty-s button"); if (!s) return;
  $("q").value = ""; syncSearchMode(); scen = s.dataset.s; buildScens(); render();
});
let typingTimer = 0;
$("q").addEventListener("input", () => {
  if (scen) { scen = null; buildScens(); }
  syncSearchMode();
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { typingTimer = 0; render(); }, 60);  // one render per pause in typing
});
$("q").addEventListener("keydown", e => {
  // Arrow keys and Enter act on the latest query, even mid-debounce.
  if (typingTimer && /^(ArrowDown|ArrowUp|Enter)$/.test(e.key)) { clearTimeout(typingTimer); typingTimer = 0; render(); }
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const list = $("list").querySelectorAll(".card");
    if (list.length) copyCmd(list[Math.max(active, 0)].querySelector(".cmd").dataset.c);
  }
  else if (e.key === "Escape") { if ($("q").value) clearSearch(); else $("q").blur(); }
});
$("qclear").onclick = () => { clearSearch(); $("q").focus(); };
$("brand").onclick = () => { clearSearch(); scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"}); };
const toast = $("toast"); let tt;
function say(s){ toast.textContent = s; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 1600); }
$("list").addEventListener("click", e => {
  const lk = e.target.closest(".link");
  if (lk) {
    const url = META.site + "#" + lang + "-" + lk.dataset.l;
    try { navigator.clipboard.writeText(url).then(() => say(UI[lang].copiedLink)).catch(() => say(url)); } catch(err) { say(url); }
    return;
  }
  const b = e.target.closest(".cmd"); if (!b) return;
  const c = b.dataset.c;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say(UI[lang].selected); };
  try { navigator.clipboard.writeText(c).then(() => say(UI[lang].copied(c))).catch(fallback); } catch(err) { fallback(); }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); $("q").focus(); $("q").select(); }
});
const totop = $("totop");
addEventListener("scroll", () => { totop.hidden = scrollY < 900; }, {passive: true});
totop.onclick = () => scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"});
setLang(pickLang());
if (TARGET) {
  const el = $("c-" + slug(TARGET));
  if (el) { el.scrollIntoView({block: "start", behavior: "instant"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
}
</script>
