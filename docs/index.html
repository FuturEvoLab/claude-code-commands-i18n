<style>
/* Layout: terminal-style hero band → onboarding + scenarios → sticky prompt bar → sidebar nav + card grid → disclaimer footer.
   Category hues come from static .h0–.h14 classes so the page needs no inline style attributes (CSP-safe). */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#141a24; --muted:#586374; --line:#dbe0e8;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#dcf2ef;
  --hero:#111827; --hero-2:#1b2537; --hero-ink:#e8edf6; --hero-muted:#93a1b8; --hero-line:#2a3650; --phos:#5eead4; --amber:#fbbf24;
  --star:#a15c00; --star-soft:#fdf0d9; --info:#3557b7; --info-soft:#e3e9fa;
  --r-cost:#a15c00; --r-cost-bg:#fdf0d9; --r-external:#2f5fc4; --r-external-bg:#e2eafb; --r-secrets:#7c3aed; --r-secrets-bg:#efe7fd;
  --r-files:#c2410c; --r-files-bg:#fde8dc; --r-perms:#b42318; --r-perms-bg:#fde3e1;
  --hue-s:52%; --hue-l:40%; --shadow:0 1px 2px rgba(20,26,36,.06),0 6px 18px rgba(20,26,36,.06);
  --font-zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --font-ja:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif;
  --font-en:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --surface:#141b26; --surface-2:#1a2330; --ink:#e6ebf3; --muted:#97a3b6; --line:#263142;
  --accent:#5eead4; --accent-ink:#06201d; --accent-soft:#12302d;
  --hero:#0a0f17; --hero-2:#121a27; --hero-line:#223047;
  --star:#f5b94a; --star-soft:#3a2b12; --info:#9db4f0; --info-soft:#1d2741;
  --r-cost:#f5b94a; --r-cost-bg:#3a2b12; --r-external:#8fb0f5; --r-external-bg:#1b2742; --r-secrets:#c4a5fb; --r-secrets-bg:#2a1f45;
  --r-files:#fb9a6b; --r-files-bg:#3d2216; --r-perms:#f38b82; --r-perms-bg:#3f1c1a;
  --hue-s:62%; --hue-l:68%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#141b26; --surface-2:#1a2330; --ink:#e6ebf3; --muted:#97a3b6; --line:#263142;
  --accent:#5eead4; --accent-ink:#06201d; --accent-soft:#12302d;
  --hero:#0a0f17; --hero-2:#121a27; --hero-line:#223047;
  --star:#f5b94a; --star-soft:#3a2b12; --info:#9db4f0; --info-soft:#1d2741;
  --r-cost:#f5b94a; --r-cost-bg:#3a2b12; --r-external:#8fb0f5; --r-external-bg:#1b2742; --r-secrets:#c4a5fb; --r-secrets-bg:#2a1f45;
  --r-files:#fb9a6b; --r-files-bg:#3d2216; --r-perms:#f38b82; --r-perms-bg:#3f1c1a;
  --hue-s:62%; --hue-l:68%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
.h0{--h:168}.h1{--h:212}.h2{--h:262}.h3{--h:350}.h4{--h:24}.h5{--h:42}.h6{--h:140}.h7{--h:300}
.h8{--h:4}.h9{--h:196}.h10{--h:226}.h11{--h:88}.h12{--h:30}.h13{--h:220}.h14{--h:0}
[class*=" h"],[class^="h"]{--c:hsl(var(--h) var(--hue-s) var(--hue-l))}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-zh);font-size:15px;line-height:1.7;margin:0;-webkit-font-smoothing:antialiased}
html[lang="ja"] body{font-family:var(--font-ja)}
html[lang="en"] body{font-family:var(--font-en)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px;word-break:break-word}
kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;padding:0 5px;opacity:.85}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}

/* Hero: always dark, a deliberate terminal look in both themes */
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(94,234,212,.16),transparent 60%),linear-gradient(var(--hero),var(--hero));color:var(--hero-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:32px 32px;opacity:.35;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:20px 72px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.badge{font-size:12px;color:var(--hero-muted);border:1px solid var(--hero-line);border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.03)}
.badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}
.langs{display:flex;border:1px solid var(--hero-line);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.04)}
.langs button{border:0;background:transparent;color:var(--hero-ink);padding:6px 14px;cursor:pointer;font-size:14px}
.langs button[aria-pressed="true"]{background:var(--phos);color:#06201d;font-weight:700}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;margin-top:34px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:26px;margin-top:24px}}
h1{font-size:clamp(32px,5.4vw,58px);font-weight:900;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance}
h1 .slash{font-family:var(--font-mono);color:var(--phos);font-weight:700;margin-right:.08em;text-shadow:0 0 24px rgba(94,234,212,.45)}
.lead{color:var(--hero-muted);margin:0;max-width:60ch;font-size:15.5px}
.lead small{display:block;margin-top:10px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.stat b{display:block;font-family:var(--font-mono);font-size:30px;line-height:1.1;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--hero-muted);letter-spacing:.04em}
.term{background:linear-gradient(var(--hero-2),var(--hero-2));border:1px solid var(--hero-line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;min-width:0}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--hero-line);font-size:12px;color:var(--hero-muted)}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#3a465c;display:inline-block}
.term-bar i:nth-child(1){background:#f87171}.term-bar i:nth-child(2){background:#fbbf24}.term-bar i:nth-child(3){background:#34d399}
.term-bar span{margin-left:8px;font-family:var(--font-mono)}
.term-body{padding:18px 18px 20px;font-family:var(--font-mono);font-size:14px;min-height:226px}
.prompt-line{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.prompt-line .p{color:var(--phos)}
.typed{color:var(--hero-ink);font-weight:700}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--phos);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu{margin:12px 0 0;padding:0;list-style:none;border-left:2px solid var(--hero-line)}
.menu li{display:flex;gap:14px;padding:4px 12px;font-size:13px;color:var(--hero-muted);min-width:0}
.menu li b{color:var(--hero-ink);font-weight:600;flex:none;min-width:8.5em}
.menu li.on{background:rgba(94,234,212,.1);border-left:2px solid var(--phos);margin-left:-2px}
.menu li.on b{color:var(--phos)}
.menu li span{min-width:0;font-family:var(--font-zh)}
html[lang="ja"] .menu li span{font-family:var(--font-ja)}
html[lang="en"] .menu li span{font-family:var(--font-en)}

/* Onboarding */
.intro{padding-block:28px 6px}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-58px;position:relative;z-index:2}
@media (max-width:1000px){.howto{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.howto{grid-template-columns:1fr}}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.howto .ic{font-family:var(--font-mono);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 6px;font-size:13px;margin-bottom:8px}
.howto b{display:block;font-size:14.5px;margin-bottom:3px}
.howto p{margin:0;color:var(--muted);font-size:13.5px}
.h-sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:38px 0 14px}
.h-sec h2{font-size:21px;margin:0;letter-spacing:-.01em}
.h-sec p{margin:0;color:var(--muted);font-size:13.5px}
.scens{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));gap:10px}
.scen{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.scen:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.scen[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scen .q{font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.scen .q::after{content:"→";color:var(--accent);font-family:var(--font-mono)}
.scen .pills{display:flex;flex-wrap:wrap;gap:4px}
.scen .pills span{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);color:var(--muted);border-radius:5px;padding:0 6px}
@media (max-width:560px){.howto{gap:10px}.howto div{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:12px 14px}.howto .ic{margin:0;grid-row:span 2}.howto p{grid-column:2}}
.safety{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0;padding:0}
@media (max-width:1000px){.safety{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.safety{grid-template-columns:1fr}}
.safety li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);min-width:0}
.safety li b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;margin-bottom:4px}
.safety ul{margin:0;padding:0;display:contents}

/* Prompt bar: pinned to the top from the first frame */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--hero) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--hero-line)}
.bar-row{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{flex:none;border:0;background:transparent;color:var(--hero-ink);font-family:var(--font-mono);font-weight:700;font-size:17px;cursor:pointer;padding:6px 4px}
.brand span{color:var(--phos)}
.bar .search{flex:1;min-width:0}
.bar-langs{flex:none}
.hero-langs{display:none}
@media (max-width:720px){.brand,.bar-langs,.khint{display:none}.hero-langs{display:flex}}
.qclear{flex:none;border:0;background:var(--hero-line);color:var(--hero-ink);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.khint{color:var(--hero-muted);margin-right:6px;flex:none}
.hint{display:none;font-size:12px;color:var(--hero-muted);padding:0 2px 8px;font-family:var(--font-mono)}
body.searching .hint{display:block}
@media (pointer:coarse){.hint{display:none!important}}
body.searching .hero,body.searching .intro{display:none}
.search{display:flex;align-items:center;gap:10px;background:var(--hero);border:1px solid var(--hero-line);border-radius:12px;padding:4px 6px 4px 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--phos);box-shadow:0 0 0 3px rgba(94,234,212,.25)}
.search .p{font-family:var(--font-mono);color:var(--phos);font-weight:700}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 4px;border:0;background:transparent;color:var(--hero-ink);outline:none}
#q::placeholder{color:var(--hero-muted)}
#count{color:var(--hero-muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:4px}
.chips{display:none;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (max-width:900px){.chips{display:flex}}
.chip{flex:none;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--hero-line);background:rgba(255,255,255,.04);color:var(--hero-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--phos);border-color:var(--phos);color:#06201d}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}

/* Body: sidebar + list */
.body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-block:28px 40px}
@media (max-width:900px){.body{grid-template-columns:1fr}.side{display:none}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.side button em{margin-left:auto;font-style:normal;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 0}
main section{margin-bottom:40px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.sec-head .sw{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.sec-head h2{font-size:21px;margin:0;letter-spacing:-.01em}
.sec-head small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-desc{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:transform .15s,box-shadow .15s;scroll-margin-top:84px;border-top:3px solid var(--c,var(--line))}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.flash,.card.active{outline:3px solid var(--accent);outline-offset:3px}
mark{background:color-mix(in srgb,var(--amber) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.cmd mark{background:rgba(251,191,36,.35);color:var(--phos)}
.empty-s{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.empty-s button{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
@media (pointer:coarse){.chip{padding:8px 14px;font-size:14px}.link{padding:6px 12px;font-size:13px}.langs button{padding:9px 14px}.scen{padding:15px 16px}.side button{padding:10px}.cmd{padding:7px 13px}.qclear{width:34px;height:34px}}
.card-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmd{font-family:var(--font-mono);font-weight:700;font-size:16px;background:var(--hero);color:var(--phos);padding:4px 11px;border-radius:7px;cursor:pointer;border:0;text-align:left;position:relative}
.cmd:hover::after{content:"⧉";margin-left:8px;font-size:12px;color:var(--hero-muted)}
.args{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);word-break:break-word;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.tag.pick{background:var(--star-soft);color:var(--star)}
.tag.skill,.tag.workflow{background:var(--accent-soft);color:var(--accent)}
.tag.removed{background:var(--r-perms-bg);color:var(--r-perms)}
.tag.ver{background:var(--info-soft);color:var(--info);font-family:var(--font-mono);font-weight:500}
.tag.risk{cursor:help}
.r-cost{background:var(--r-cost-bg);color:var(--r-cost)}.r-external{background:var(--r-external-bg);color:var(--r-external)}
.r-secrets{background:var(--r-secrets-bg);color:var(--r-secrets)}.r-files{background:var(--r-files-bg);color:var(--r-files)}
.r-perms{background:var(--r-perms-bg);color:var(--r-perms)}
.ri{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;flex:none}
.gloss{font-size:12.5px;color:var(--muted)}
.gloss b{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.what{margin:0 16px 12px}
.ex{margin:0 16px 14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.ex .lbl{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.08em;display:block;margin-bottom:2px;text-transform:uppercase}
.ex code{background:transparent;padding:0;color:var(--ink);font-weight:700}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.card-foot code{background:transparent;color:var(--muted);padding:0}
.link{margin-left:auto;font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.link:hover{color:var(--accent);border-color:var(--accent)}
.scen-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scen-bar h2{margin:0;font-size:21px}
.clear{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:60px 0;font-family:var(--font-mono)}

footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
footer .wrap{padding-block:30px 48px}
footer h2{font-size:18px;color:var(--ink);margin:0 0 14px}
