*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{--body-font:var(--font-en)}
html[lang="ja"]{--body-font:var(--font-ja)}
html[lang="zh-CN"]{--body-font:var(--font-zh)}
html[lang="zh-Hant"]{--body-font:var(--font-tc)}
html[lang="ko"]{--body-font:var(--font-ko)}
body{background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.7;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px;word-break:break-word}
kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;padding:0 5px;opacity:.85}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}

/* Hero: always dark, a deliberate terminal look in both themes */
.hero{background:radial-gradient(1200px 400px at 85% -10%,var(--phos-glow),transparent 60%),linear-gradient(var(--hero),var(--hero));color:var(--hero-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:32px 32px;opacity:.35;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:20px 72px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topline .badge{margin-right:auto}
.badge{font-size:12px;color:var(--hero-muted);border:1px solid var(--hero-line);border-radius:999px;padding:3px 12px;background:var(--hero-tint)}
.badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}
/* Dropdowns (language, theme): native selects, restyled; the chevron is drawn with borders so it follows the theme */
.sel-wrap{position:relative;flex:none;display:inline-flex;align-items:center}
.sel-wrap::before{content:"";position:absolute;left:12px;width:13px;height:13px;border-radius:50%;pointer-events:none}
.lang-wrap::before{border:1.5px solid var(--hero-muted)}
.skin-wrap::before{background:var(--phos);box-shadow:0 0 0 2px var(--hero-tint),0 0 8px color-mix(in srgb,var(--phos) 50%,transparent)}
.sel-wrap::after{content:"";position:absolute;right:12px;width:6px;height:6px;border-right:1.5px solid var(--hero-muted);border-bottom:1.5px solid var(--hero-muted);transform:translateY(-2px) rotate(45deg);pointer-events:none}
.sel{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;color:var(--hero-ink);background:var(--hero-tint);border:1px solid var(--hero-line);border-radius:10px;padding:7px 32px;cursor:pointer;min-height:38px}
.sel:hover{border-color:var(--hero-muted)}
.sel:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.sel option{background:var(--surface);color:var(--ink)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:start;margin-top:34px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:26px;margin-top:24px}}
h1{font-size:clamp(32px,5.4vw,58px);font-weight:900;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance}
h1 .slash{font-family:var(--font-mono);color:var(--phos);font-weight:700;margin-right:.08em;text-shadow:0 0 24px color-mix(in srgb,var(--phos) 45%,transparent)}
.lead{color:var(--hero-muted);margin:0;max-width:60ch;font-size:15.5px}
.lead small{display:block;margin-top:10px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.stat b{display:block;font-family:var(--font-mono);font-size:30px;line-height:1.1;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--hero-muted);letter-spacing:.04em}
.term{background:var(--term-bg);border:1px solid var(--term-line);border-radius:14px;box-shadow:var(--term-shadow),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;min-width:0}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--term-line);font-size:12px;color:var(--term-muted)}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#3a465c;display:inline-block}
.term-bar i:nth-child(1){background:#f87171}.term-bar i:nth-child(2){background:#fbbf24}.term-bar i:nth-child(3){background:#34d399}
.term-bar span{margin-left:8px;font-family:var(--font-mono)}
.term-body{padding:18px 18px 20px;font-family:var(--font-mono);font-size:14px;height:212px;overflow:hidden}
.term{margin-top:18px}
@media (max-width:900px){.term{margin-top:0}}
.prompt-line{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.prompt-line .p{color:var(--term-accent)}
.typed{color:var(--term-ink);font-weight:700}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--term-accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu{margin:12px 0 0;padding:0;list-style:none;border-left:2px solid var(--term-line);height:132px}
.menu li{display:flex;gap:14px;padding:0 12px;height:33px;align-items:center;font-size:13px;color:var(--term-muted);min-width:0;white-space:nowrap}
.menu li b{color:var(--term-ink);font-weight:600;flex:none;min-width:8.5em}

const CMDS = [{"cmd":"/clear","args":"[name]","cat":"session","kind":"builtin","pick":true,"aliases":["/reset","/new"],"short":{"en":"Start a fresh conversation (the old one stays resumable)","ja":"会話をリセットして新しく始める（前の会話は戻せる）","zh":"开始全新对话，旧对话可找回","zh-hant":"開始全新對話（舊對話之後仍可接續）","ko":"새 대화 시작 (이전 대화는 다시 열 수 있음)","ru":"Начать новый разговор (старый можно вернуть)","es":"Empezar una conversación nueva (la anterior se puede retomar)"},"word":"clear","gloss":{"zh":"清空","ja":"消去・クリア","zh-hant":"清除、清空","ko":"지우기·초기화","ru":"очистить","es":"borrar, limpiar"},"desc":{"en":"Starts a new conversation with empty context while keeping project memory. The previous conversation is kept and can be reopened with `/resume`; pass a name to label it in the picker.","ja":"コンテキストが空の新しい会話を始めます。プロジェクトの記憶（CLAUDE.md）は残ります。前の会話は削除されず `/resume` で戻れます。名前を付けると前の会話にラベルが付きます。","zh":"开始一个上下文为空的新对话。项目记忆（CLAUDE.md）仍然有效。旧对话不会删除，可以用 `/resume` 找回；写上名字可以给旧对话加标签。","zh-hant":"開始一個上下文為空的新對話，專案記憶仍然有效。舊對話會保留，可以用 `/resume` 重新開啟；加上名稱可以在清單中幫舊對話加標籤。","ko":"컨텍스트가 비어 있는 새 대화를 시작합니다. 프로젝트 메모리는 그대로 남습니다. 이전 대화는 삭제되지 않고 `/resume`으로 다시 열 수 있습니다. 이름을 붙이면 선택 목록에서 이전 대화에 라벨이 붙습니다.","ru":"Начинает новый разговор с пустым контекстом, но память проекта сохраняется. Прежний разговор не удаляется, его можно снова открыть через `/resume`; укажите имя, чтобы подписать его в списке.","es":"Empieza una conversación nueva con el contexto vacío, pero conserva la memoria del proyecto. La conversación anterior se guarda y puedes volver a abrirla con `/resume`; si escribes un nombre, sirve de etiqueta en el selector."},"use":{"en":"When you finish one feature and move to an unrelated task: `/clear login-feature`. Old context stops interfering and usage drops.","ja":"ある機能が終わり、関係のない次の作業に移るとき：`/clear ログイン機能`。前の内容に引きずられず、使用量も節約できます。","zh":"做完一个功能、要开始一件无关的新任务时：`/clear 登录功能`。避免旧内容干扰，也更省用量。","zh-hant":"做完一個功能、要開始無關的新工作時：`/clear 登入功能`。舊內容不再干擾，用量也會減少。","ko":"한 기능을 끝내고 관계없는 다음 작업으로 넘어갈 때: `/clear 로그인-기능`. 이전 내용에 방해받지 않고 사용량도 줄어듭니다.","ru":"Вы закончили одну функцию и переходите к другой, несвязанной задаче: `/clear функция-входа`. Старый контекст больше не мешает, и расход снижается.","es":"Cuando terminas una función y pasas a una tarea sin relación: `/clear funcion-de-inicio-de-sesion`. El contexto viejo deja de interferir y el uso baja."}},{"cmd":"/compact","args":"[instructions]","cat":"session","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Summarize a long conversation to free space","ja":"長い会話を要約して空きを作り、続ける","zh":"压缩长对话，腾出空间继续聊","zh-hant":"把很長的對話整理成摘要，騰出空間","ko":"긴 대화를 요약해 공간 확보","ru":"Сжать длинный разговор, чтобы освободить место","es":"Resumir una conversación larga para liberar espacio"},"word":"compact","gloss":{"zh":"压缩","ja":"圧縮","zh-hant":"壓縮","ko":"압축","ru":"сжать","es":"compactar, resumir"},"desc":{"en":"Summarizes the conversation so far to free context space, continuing the same conversation. Optional instructions steer what the summary keeps.","ja":"これまでの会話を要約してコンテキストの空きを作り、同じ会話を続けます。「要約で何を残すか」を指示できます。","zh":"把到目前为止的对话总结成摘要，腾出上下文空间，对话继续。可以附上「摘要要重点保留什么」。","zh-hant":"把目前為止的對話整理成摘要，騰出上下文空間，並在同一個對話中繼續。可以附上指示，決定摘要要保留哪些內容。","ko":"지금까지의 대화를 요약해서 컨텍스트 공간을 확보하고, 같은 대화를 이어갑니다. 지시를 덧붙이면 요약에 무엇을 남길지 정할 수 있습니다.","ru":"Кратко пересказывает разговор, чтобы освободить место в контексте, и продолжает тот же разговор. Можно добавить указания, что сохранить в пересказе.","es":"Resume la conversación hasta ahora para liberar espacio de contexto y sigue en la misma conversación. Puedes añadir instrucciones para indicar qué debe conservar el resumen."},"use":{"en":"After a long session: `/compact keep the database schema and the list of open bugs`.","ja":"長い会話のあとで：`/compact データベース構造と未修正のバグ一覧を残して`。","zh":"长时间对话后：`/compact 保留数据库结构和尚未修复的 bug 列表`。","zh-hant":"長時間對話之後：`/compact 保留資料庫結構和尚未修正的 bug 清單`。","ko":"긴 작업을 한 뒤: `/compact 데이터베이스 구조와 미해결 버그 목록은 남겨 줘`.","ru":"После долгой сессии: `/compact сохрани схему базы данных и список открытых ошибок`.","es":"Después de una sesión larga: `/compact conserva el esquema de la base de datos y la lista de errores pendientes`."}},{"cmd":"/context","args":"[all]","cat":"session","kind":"builtin","pick":true,"aliases":[],"short":{"en":"See what is filling the context window","ja":"コンテキストを何が埋めているか見る","zh":"查看记忆空间被什么占满","zh-hant":"查看是什麼佔滿了上下文","ko":"컨텍스트를 무엇이 채우는지 보기","ru":"Посмотреть, чем заполнен контекст","es":"Ver qué está llenando la ventana de contexto"},"word":"context","gloss":{"zh":"上下文（Claude 当前能「记住」的内容）","ja":"コンテキスト（Claude が今「覚えている」内容）","zh-hant":"上下文（Claude 目前能「記住」的內容）","ko":"컨텍스트 (Claude가 지금 \"기억하고\" 있는 내용)","ru":"контекст (то, что Claude сейчас «помнит»)","es":"contexto (lo que Claude «recuerda» ahora)"},"desc":{"en":"Shows context usage as a colored grid with optimization suggestions and capacity warnings. `all` expands the per-item breakdown.","ja":"コンテキストの使用量と内訳を色付きのマス目で表示し、節約のヒントや容量の警告を出します。`all` で詳細をすべて表示します。","zh":"用彩色方格图显示上下文用了多少、被什么占用，并给出节省建议和容量警告。`all` 展开全部明细。","zh-hant":"用彩色方格圖顯示上下文的使用量，並提供最佳化建議和容量警告。`all` 會展開每一項的明細。","ko":"컨텍스트 사용량을 색깔 격자로 보여 주고, 최적화 제안과 용량 경고도 표시합니다. `all`을 붙이면 항목별 내역을 펼쳐 보여 줍니다.","ru":"Показывает заполнение контекста в виде цветной сетки, с советами по оптимизации и предупреждениями о нехватке места. `all` раскрывает подробную разбивку по элементам.","es":"Muestra el uso del contexto como una cuadrícula de colores, con sugerencias para optimizar y avisos de capacidad. `all` muestra el desglose por elemento."},"use":{"en":"When Claude seems forgetful or usage climbs fast, run `/context` to see whether large files or tool output are filling the window.","ja":"Claude が「忘れっぽく」なった、使用量の増えが速いと感じたら、まず `/context` で大きなファイルやツール出力が原因か確認します。","zh":"感觉 Claude 变「健忘」或用量涨得快时，先 `/context` 看是不是被大文件或工具输出占满。","zh-hant":"覺得 Claude 變健忘或用量增加很快時，執行 `/context`，看看是不是大型檔案或工具輸出佔滿了視窗。","ko":"Claude가 자꾸 잊어버리거나 사용량이 빠르게 늘 때, `/context`로 큰 파일이나 도구 출력이 공간을 채우고 있는지 확인합니다.","ru":"Если Claude стал забывчивым или расход быстро растёт, запустите `/context` и посмотрите, не заполняют ли окно большие файлы или вывод инструментов.","es":"Cuando Claude parece olvidar cosas o el uso sube rápido, ejecuta `/context` para ver si archivos grandes o la salida de herramientas están llenando la ventana."}},{"cmd":"/plan","args":"[description]","cat":"session","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Get a plan first; edits wait for your approval","ja":"先に計画を出し、承認後に作業する","zh":"先出方案、你批准后再动手","zh-hant":"先看計畫；經你核准後才會修改","ko":"먼저 계획부터, 수정은 승인 후에","ru":"Сначала план; правки ждут вашего одобрения","es":"Ver primero un plan; los cambios esperan tu aprobación"},"word":"plan","gloss":{"zh":"计划","ja":"計画","zh-hant":"計畫","ko":"계획","ru":"план","es":"plan"},"desc":{"en":"Enters plan mode, where Claude researches and proposes a plan before editing. Pass a description to start on that task immediately.","ja":"プランモードに入ります。Claude はまず調査して計画を示し、承認されてからファイルを変更します。作業内容を添えるとすぐ開始。","zh":"直接进入计划模式：Claude 先调查并提出方案，你批准后才开始修改文件。可附上任务描述立即开始。","zh-hant":"進入計畫模式：Claude 會先調查並提出計畫，再進行編輯。附上描述的話，會立刻開始處理那項工作。","ko":"계획 모드로 들어갑니다. Claude가 수정하기 전에 조사하고 계획을 제안합니다. 설명을 붙이면 그 작업을 바로 시작합니다.","ru":"Включает режим планирования: Claude изучает задачу и предлагает план, прежде чем что-то менять. Укажите описание, чтобы сразу начать эту задачу.","es":"Entra en el modo plan: Claude investiga y propone un plan antes de editar. Si añades una descripción, empieza esa tarea de inmediato."},"use":{"en":"Before a big change: `/plan fix the auth bug`, review, then approve.","ja":"大きな変更の前に：`/plan ログインのエラーを直して`。計画を確認してから任せます。","zh":"大改动之前：`/plan 修复登录报错`，看完方案再放手让它改。","zh-hant":"大幅修改之前：`/plan 修正登入驗證的 bug`，看過計畫後再核准。","ko":"큰 변경 전에: `/plan 인증 버그 수정`. 계획을 검토한 뒤 승인합니다.","ru":"Перед крупным изменением: `/plan исправь ошибку авторизации`, проверьте план и одобрите.","es":"Antes de un cambio grande: `/plan corrige el error de autenticación`, revisa y luego aprueba."}},{"cmd":"/resume","args":"[session]","cat":"session","kind":"builtin","pick":true,"aliases":["/continue"],"short":{"en":"Go back to an earlier conversation","ja":"以前の会話に戻る","zh":"回到以前的对话","zh-hant":"回到之前的對話","ko":"이전 대화로 돌아가기","ru":"Вернуться к прежнему разговору","es":"Volver a una conversación anterior"},"word":"resume","gloss":{"zh":"继续、恢复","ja":"再開","zh-hant":"繼續、恢復","ko":"재개·이어서 하기","ru":"возобновить","es":"reanudar"},"desc":{"en":"Resumes a conversation by ID or name, or opens the session picker. Background sessions are marked `bg`.","ja":"ID か名前で以前の会話を再開します。引数なしなら一覧が開きます。バックグラウンドの会話には `bg` と表示されます。","zh":"按 ID 或名字恢复以前的对话，不写参数则打开对话列表。后台会话会标记为 `bg`。","zh-hant":"用 ID 或名稱恢復之前的對話，或開啟工作階段清單。背景工作階段會標示為 `bg`。","ko":"ID나 이름으로 대화를 다시 열거나, 세션 선택 화면을 엽니다. 백그라운드 세션에는 `bg` 표시가 붙습니다.","ru":"Возобновляет разговор по ID или имени либо открывает список сессий. Фоновые сессии отмечены `bg`.","es":"Retoma una conversación por su ID o nombre, o abre el selector de sesiones. Las sesiones en segundo plano aparecen marcadas con `bg`."},"use":{"en":"You closed the laptop mid-task yesterday: `/resume` and pick yesterday's conversation.","ja":"昨日途中でパソコンを閉じたら：今日 `/resume` で昨日の会話を選んで続きから。","zh":"昨天没做完就关了电脑：今天 `/resume`，选昨天的对话接着做。","zh-hant":"昨天做到一半就闔上筆電：執行 `/resume`，選擇昨天的對話。","ko":"어제 작업 도중 노트북을 닫았다면: `/resume`으로 어제 대화를 골라 이어서 합니다.","ru":"Вчера вы закрыли ноутбук посреди задачи: `/resume` и выберите вчерашний разговор.","es":"Ayer cerraste el portátil a mitad de una tarea: `/resume` y elige la conversación de ayer."}},{"cmd":"/rewind","args":"","cat":"session","kind":"builtin","pick":true,"aliases":["/checkpoint","/undo"],"short":{"en":"Undo: roll code and conversation back","ja":"元に戻す：コードと会話を以前の状態へ","zh":"撤销：把代码和对话退回之前","zh-hant":"復原：把程式碼和對話退回去","ko":"되돌리기: 코드와 대화를 이전으로","ru":"Отмена: откатить код и разговор","es":"Deshacer: volver atrás el código y la conversación"},"risk":["files"],"word":"rewind","gloss":{"zh":"倒带","ja":"巻き戻し","zh-hant":"倒帶","ko":"되감기","ru":"перемотать назад","es":"rebobinar"},"desc":{"en":"Rolls the conversation and/or code back to an earlier checkpoint, or summarizes from a selected message.","ja":"会話とコード（片方だけも可）を以前のチェックポイントに戻します。選んだメッセージ以降を要約することもできます。ゲームの「セーブデータを読み込む」に近い機能です。","zh":"把对话和/或代码退回到之前的某个检查点，或者从选中的消息开始做摘要。类似游戏「读档」。","zh-hant":"把對話和（或）程式碼退回到之前的檢查點，或從選取的訊息開始做摘要。","ko":"대화나 코드(또는 둘 다)를 이전 체크포인트로 되돌리거나, 선택한 메시지부터 요약합니다.","ru":"Откатывает разговор и/или код к более ранней контрольной точке или делает пересказ начиная с выбранного сообщения.","es":"Devuelve la conversación, el código o ambos a un punto de control anterior, o resume a partir de un mensaje que elijas."},"use":{"en":"Claude broke several files: run `/rewind`, pick the message before the edits, and restore both code and conversation.","ja":"Claude がファイルを壊してしまったら：`/rewind` で変更前のメッセージを選ぶと、コードと会話がまとめて元に戻ります。","zh":"Claude 把文件改坏了：`/rewind`，选择改动之前的那条消息，代码和对话一起恢复。","zh-hant":"Claude 把好幾個檔案改壞了：執行 `/rewind`，選擇修改之前的那則訊息，把程式碼和對話一起還原。","ko":"Claude가 여러 파일을 망가뜨렸다면: `/rewind`를 실행하고 수정 전 메시지를 골라 코드와 대화를 함께 되돌립니다.","ru":"Claude сломал несколько файлов: запустите `/rewind`, выберите сообщение до правок и восстановите и код, и разговор.","es":"Claude rompió varios archivos: ejecuta `/rewind`, elige el mensaje anterior a los cambios y restaura el código y la conversación."}},{"cmd":"/autocompact","args":"[auto|<tokens>]","cat":"session","kind":"builtin","pick":false,"aliases":[],"since":"2.1.221","word":"auto compact","gloss":{"zh":"自动压缩","ja":"自動圧縮","zh-hant":"自動壓縮","ko":"자동 압축","ru":"автосжатие","es":"compactación automática"},"desc":{"en":"Sets how full the context window gets before automatic compaction, e.g. `500k`; `auto` restores the model-tuned default. Saved to user settings and applied immediately.","ja":"コンテキストがどれだけ埋まったら自動圧縮するかを設定します（例：`500k`）。`auto` でモデルの既定値に戻ります。ユーザー設定に保存され、すぐ反映されます。","zh":"设置上下文用到多满时自动压缩，例如 `500k`；`auto` 恢复为模型默认值。保存到用户设置并立即生效。","zh-hant":"設定上下文視窗用到多滿時自動壓縮，例如 `500k`；`auto` 會恢復成依模型調整的預設值。會儲存到使用者設定並立即生效。","ko":"컨텍스트 창이 얼마나 찼을 때 자동 압축할지 정합니다. 예: `500k`. `auto`는 모델에 맞춘 기본값으로 되돌립니다. 사용자 설정에 저장되고 바로 적용됩니다.","ru":"Задаёт, насколько должно заполниться окно контекста перед автоматическим сжатием, например `500k`; `auto` возвращает значение по умолчанию, подобранное для модели. Сохраняется в пользовательских настройках и применяется сразу.","es":"Define cuánto se llena la ventana de contexto antes de la compactación automática, por ejemplo `500k`; `auto` vuelve al valor predeterminado ajustado al modelo. Se guarda en la configuración de usuario y se aplica al momento."},"use":{"en":"Long task interrupted by frequent compaction: `/autocompact 500k`.","ja":"長い作業で圧縮が頻繁に入るのを避けたいとき：`/autocompact 500k`。","zh":"长任务不想被频繁压缩打断：`/autocompact 500k`。","zh-hant":"長時間工作一直被壓縮打斷：`/autocompact 500k`。","ko":"긴 작업이 잦은 압축으로 끊길 때: `/autocompact 500k`.","ru":"Длинную задачу постоянно прерывает сжатие: `/autocompact 500k`.","es":"Una tarea larga se interrumpe por compactaciones frecuentes: `/autocompact 500k`."}},{"cmd":"/branch","args":"[name]","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"branch","gloss":{"zh":"分支","ja":"分岐・ブランチ","zh-hant":"分支","ko":"분기·브랜치","ru":"ветка, ответвление","es":"rama, bifurcación"},"desc":{"en":"Creates a branch of the conversation at this point and switches into it; the original is preserved and reachable via `/resume`. (A conversation branch, not a Git branch.)","ja":"今の時点で会話の分岐を作って切り替え、別の方向を試せます。元の会話は残り `/resume` で戻れます。（Git のブランチではなく会話の分岐です。）","zh":"在当前位置为对话建一个分支并切换过去，用来尝试另一个方向；原对话保留，可用 `/resume` 回去。（这是对话分支，不是 Git 分支。）","zh-hant":"在目前位置為對話建立一個分支並切換過去；原本的對話會保留，可以用 `/resume` 回去。（這是對話分支，不是 Git 分支。）","ko":"이 지점에서 대화를 분기하고 그쪽으로 전환합니다. 원래 대화는 보존되며 `/resume`으로 돌아갈 수 있습니다. (Git 브랜치가 아니라 대화의 분기입니다.)","ru":"Создаёт ответвление разговора с этого места и переключается в него; исходный разговор сохраняется и доступен через `/resume`. (Это ветка разговора, а не ветка Git.)","es":"Crea una rama de la conversación en este punto y cambia a ella; la original se conserva y puedes volver con `/resume`. (Es una rama de la conversación, no una rama de Git)."},"use":{"en":"Unsure between two approaches: `/branch try-plan-b`; if it fails, go back and continue plan A.","ja":"案 A と案 B で迷ったら：`/branch 案Bを試す`。だめなら元の会話で A を続けます。","zh":"方案 A 和 B 拿不准：`/branch 试方案B`，不行就回到原对话继续 A。","zh-hant":"兩種做法拿不定主意：`/branch 試試方案B`；如果不行，就回去繼續方案 A。","ko":"두 가지 방법 중 고민될 때: `/branch B안-시도`. 실패하면 원래 대화로 돌아가 A안을 계속합니다.","ru":"Не можете выбрать между двумя подходами: `/branch план-б`; если не получится, вернитесь и продолжайте план А.","es":"Dudas entre dos enfoques: `/branch probar-plan-b`; si no funciona, vuelve atrás y sigue con el plan A."}},{"cmd":"/btw","args":"[question]","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"by the way","gloss":{"zh":"顺便问一下","ja":"ところで","zh-hant":"順便問一下","ko":"그런데·참고로","ru":"кстати","es":"por cierto"},"desc":{"en":"Asks a side question about the current session without adding it to the conversation. Without a question, shows your most recent side question.","ja":"今の会話について、履歴に残さない「ついでの質問」をします。質問なしで実行すると直近の質問と回答を表示します。","zh":"就当前会话问一个旁支问题，答案不会加入对话历史。不带问题则显示最近一次旁支问答。","zh-hant":"針對目前的工作階段問一個旁支問題，不會加入對話紀錄。不加問題則顯示你最近一次的旁支問題。","ko":"현재 세션에 대해 곁가지 질문을 하되, 그 내용을 대화에는 추가하지 않습니다. 질문 없이 실행하면 가장 최근의 곁가지 질문을 보여 줍니다.","ru":"Задаёт попутный вопрос о текущей сессии, не добавляя его в разговор. Без вопроса показывает ваш последний попутный вопрос.","es":"Hace una pregunta aparte sobre la sesión actual sin añadirla a la conversación. Sin pregunta, muestra tu última pregunta aparte."},"use":{"en":"Mid-task you want to understand an error: `/btw what does this 404 mean` without derailing the main thread.","ja":"作業中にエラーの意味だけ知りたいとき：`/btw この 404 は何の意味？`。本題の流れを乱しません。","zh":"Claude 正在写代码，你想知道一个报错的意思：`/btw 这个 404 是什么意思`，不打乱主任务。","zh-hant":"工作進行中想弄懂一個錯誤：`/btw 這個 404 是什麼意思`，不會打亂主要工作。","ko":"작업 중에 오류의 뜻만 알고 싶을 때: `/btw 이 404는 무슨 뜻이야`. 본 작업의 흐름이 흐트러지지 않습니다.","ru":"Посреди задачи хотите понять ошибку: `/btw что значит эта ошибка 404`, не сбивая основной ход работы.","es":"En medio de una tarea quieres entender un error: `/btw qué significa este 404`, sin desviar el hilo principal."}},{"cmd":"/copy","args":"[N]","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"copy","gloss":{"zh":"复制","ja":"コピー","zh-hant":"複製","ko":"복사","ru":"копировать","es":"copiar"},"desc":{"en":"Copies the last response to the clipboard; `/copy 2` copies the second-to-last. With code blocks, a picker lets you copy one block; press `w` to write to a file instead (useful over SSH).","ja":"直前の回答をクリップボードにコピーします。`/copy 2` で 2 つ前の回答。コードブロックがあれば選択画面が出て、一部だけコピーできます。`w` でファイルに書き出し（SSH 接続時に便利）。","zh":"把最近一条回答复制到剪贴板；`/copy 2` 复制倒数第二条。有代码块时会弹出选择器，可只复制某一块；按 `w` 写入文件（SSH 远程时有用）。","zh-hant":"把最後一則回答複製到剪貼簿；`/copy 2` 複製倒數第二則。有程式碼區塊時，會出現選擇器讓你只複製其中一塊；按 `w` 改為寫入檔案（透過 SSH 連線時很有用）。","ko":"마지막 응답을 클립보드에 복사합니다. `/copy 2`는 끝에서 두 번째 응답을 복사합니다. 코드 블록이 있으면 선택 화면에서 블록 하나만 복사할 수 있고, `w`를 누르면 대신 파일로 저장합니다(SSH 접속 중에 편리).","ru":"Копирует последний ответ в буфер обмена; `/copy 2` копирует предпоследний. Если есть блоки кода, можно выбрать один из них; нажмите `w`, чтобы вместо этого записать в файл (удобно при работе через SSH).","es":"Copia la última respuesta al portapapeles; `/copy 2` copia la penúltima. Si hay bloques de código, un selector te deja copiar uno solo; pulsa `w` para escribirlo en un archivo (útil por SSH)."},"use":{"en":"Claude drafted a snippet or command: `/copy` and paste it wherever you need it.","ja":"Claude が書いた文章やコマンドを `/copy` でそのまま貼り付け。","zh":"Claude 写好一段文案或命令，`/copy` 直接粘贴到别处。","zh-hant":"Claude 寫好一段程式碼或指令：`/copy`，再貼到你需要的地方。","ko":"Claude가 써 준 코드 조각이나 명령을 `/copy`로 복사해 필요한 곳에 붙여 넣습니다.","ru":"Claude написал фрагмент кода или команду: `/copy` и вставьте, куда нужно.","es":"Claude escribió un fragmento de código o un comando: `/copy` y pégalo donde lo necesites."}},{"cmd":"/export","args":"[filename]","cat":"session","kind":"builtin","pick":false,"aliases":[],"risk":["secrets"],"word":"export","gloss":{"zh":"导出","ja":"エクスポート・書き出し","zh-hant":"匯出","ko":"내보내기","ru":"экспорт","es":"exportar"},"desc":{"en":"Exports the conversation as plain text, directly to a file if you give a name, otherwise via a copy/save dialog.","ja":"今の会話をプレーンテキストで書き出します。ファイル名を指定すると直接保存、なしならコピーか保存かを選べます。","zh":"把当前对话导出为纯文本。写文件名则直接保存，不写则弹出「复制或保存」对话框。","zh-hant":"把對話匯出為純文字。有給檔名就直接存成檔案，否則會開啟「複製或儲存」對話框。","ko":"대화를 일반 텍스트로 내보냅니다. 이름을 주면 바로 파일로 저장하고, 아니면 복사/저장 대화상자를 엽니다.","ru":"Экспортирует разговор как простой текст: сразу в файл, если вы указали имя, иначе через окно копирования/сохранения.","es":"Exporta la conversación como texto plano: directamente a un archivo si le das un nombre o, si no, mediante un diálogo para copiar o guardar."},"use":{"en":"Archive a valuable debugging session: `/export debugging-notes.txt`.","ja":"役に立ったトラブル対応の記録を `/export 対応記録.txt` で保存して共有。","zh":"一次很有价值的排错过程：`/export 排错记录.txt` 存档或发给同事。","zh-hant":"把一次很有價值的除錯過程存檔：`/export 除錯筆記.txt`。","ko":"도움이 된 디버깅 기록을 보관할 때: `/export 디버깅-기록.txt`.","ru":"Сохранить ценную сессию отладки: `/export заметки-отладки.txt`.","es":"Para archivar una sesión de depuración valiosa: `/export notas-de-depuracion.txt`."}},{"cmd":"/goal","args":"[condition|clear]","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"goal","gloss":{"zh":"目标","ja":"目標・ゴール","zh-hant":"目標","ko":"목표","ru":"цель","es":"objetivo, meta"},"desc":{"en":"Sets a goal: Claude keeps working across turns until the condition is met or the goal clears. No argument shows the current goal; `clear` (or `stop`, `off`, …) removes it.","ja":"完了条件を設定すると、条件を満たすか解除されるまで Claude が複数ターンにわたり作業を続けます。引数なしで現在の目標を表示、`clear`・`stop`・`off` などで途中解除。","zh":"设定一个完成条件，Claude 会跨多轮持续工作，直到条件满足或目标被清除。不带参数显示当前目标；`clear`、`stop`、`off` 等可提前取消。","zh-hant":"設定目標：Claude 會跨多輪持續工作，直到條件達成或目標被清除。不加參數會顯示目前的目標；`clear`（或 `stop`、`off` 等）會移除目標。","ko":"목표를 설정합니다. 조건이 충족되거나 목표가 해제될 때까지 Claude가 여러 턴에 걸쳐 계속 작업합니다. 인수 없이 실행하면 현재 목표를 보여 주고, `clear`(또는 `stop`, `off` 등)로 목표를 지웁니다.","ru":"Задаёт цель: Claude продолжает работать ход за ходом, пока условие не выполнится или цель не будет снята. Без аргумента показывает текущую цель; `clear` (или `stop`, `off`, …) снимает её.","es":"Fija un objetivo: Claude sigue trabajando turno tras turno hasta que se cumple la condición o se borra el objetivo. Sin argumento, muestra el objetivo actual; `clear` (o `stop`, `off`, …) lo elimina."},"use":{"en":"`/goal all tests pass`, then let it iterate until the suite is green.","ja":"`/goal すべてのテストが通る` と設定し、全部通るまで任せます。","zh":"`/goal 所有测试都通过`，然后让它自己一轮轮修，直到全绿。","zh-hant":"`/goal 所有測試都通過`，然後讓它反覆修改，直到測試全部通過。","ko":"`/goal 모든 테스트 통과`로 설정하고, 테스트가 모두 통과할 때까지 반복하게 둡니다.","ru":"`/goal все тесты проходят`, и пусть работает, пока все тесты не станут зелёными.","es":"`/goal todas las pruebas pasan`, y deja que itere hasta que todo esté en verde."}},{"cmd":"/memory","args":"","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"memory","gloss":{"zh":"记忆","ja":"記憶・メモリー","zh-hant":"記憶","ko":"기억·메모리","ru":"память","es":"memoria"},"desc":{"en":"Edits `CLAUDE.md` memory files, toggles auto memory, and shows auto memory entries.","ja":"記憶ファイル `CLAUDE.md` の編集、「自動メモリー」のオン・オフ、自動で記憶した内容の確認ができます。","zh":"编辑 `CLAUDE.md` 记忆文件，开关「自动记忆」，查看自动记住的条目。","zh-hant":"編輯 `CLAUDE.md` 記憶檔案、開關自動記憶，並顯示自動記憶的項目。","ko":"`CLAUDE.md` 메모리 파일을 편집하고, 자동 메모리를 켜고 끄며, 자동 메모리 항목을 보여 줍니다.","ru":"Редактирует файлы памяти `CLAUDE.md`, включает и выключает автопамять и показывает её записи.","es":"Edita los archivos de memoria `CLAUDE.md`, activa o desactiva la memoria automática y muestra sus entradas."},"use":{"en":"Want every answer in your language: open `/memory` and add a line such as “Always reply in Japanese.”","ja":"いつも日本語で答えてほしいなら：`/memory` で CLAUDE.md を開き「常に日本語で回答して」と書きます。","zh":"想让 Claude 每次都用中文回答：`/memory` 打开 CLAUDE.md，写入「请始终用简体中文回答」。","zh-hant":"希望每次都用中文回答：開啟 `/memory`，加上一行「請一律用繁體中文回答」。","ko":"항상 한국어로 답하게 하고 싶다면: `/memory`를 열고 \"항상 한국어로 답해 줘\" 같은 줄을 추가합니다.","ru":"Хотите, чтобы все ответы были на вашем языке: откройте `/memory` и добавьте строку, например «Всегда отвечай по-русски».","es":"Quieres que todas las respuestas estén en tu idioma: abre `/memory` y añade una línea como «Responde siempre en español»."}},{"cmd":"/recap","args":"","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"recap","gloss":{"zh":"回顾、概括","ja":"振り返り・要約","zh-hant":"回顧、摘要","ko":"요약·정리","ru":"краткий итог","es":"recapitular, resumen"},"desc":{"en":"Generates a one-line summary of the current session on demand.","ja":"今のセッションの内容を一文で要約します。","zh":"立即生成当前会话的一句话总结。","zh-hant":"隨時為目前的工作階段產生一句話的摘要。","ko":"현재 세션을 한 줄로 요약해 줍니다. 원할 때 바로 실행할 수 있습니다.","ru":"По запросу создаёт краткое содержание текущей сессии в одну строку.","es":"Genera cuando lo pides un resumen de una línea de la sesión actual."},"use":{"en":"Back from a meeting and lost track: `/recap`.","ja":"会議から戻ってどこまで進んだか忘れたら：`/recap`。","zh":"开完会回来忘了做到哪：`/recap`。","zh-hant":"開完會回來，忘了做到哪裡：`/recap`。","ko":"회의에서 돌아와 어디까지 했는지 잊었을 때: `/recap`.","ru":"Вернулись со встречи и потеряли нить: `/recap`.","es":"Vuelves de una reunión y perdiste el hilo: `/recap`."}},{"cmd":"/rename","args":"[name]","cat":"session","kind":"builtin","pick":false,"aliases":[],"word":"rename","gloss":{"zh":"重命名","ja":"名前の変更","zh-hant":"重新命名","ko":"이름 바꾸기","ru":"переименовать","es":"renombrar"},"desc":{"en":"Renames the session and shows the name on the prompt bar; without a name, generates one from the conversation.","ja":"今のセッションの名前を変え、入力欄の上に表示します。名前なしなら会話内容から自動で付けます。","zh":"给当前会话改名，并显示在输入栏上方。不写名字则根据对话内容自动生成。","zh-hant":"替工作階段改名，並把名稱顯示在輸入列上；不給名稱則根據對話內容自動產生。","ko":"세션 이름을 바꾸고 프롬프트 바에 표시합니다. 이름 없이 실행하면 대화 내용으로 이름을 만들어 줍니다.","ru":"Переименовывает сессию и показывает имя в строке ввода; без имени придумывает его по содержанию разговора.","es":"Cambia el nombre de la sesión y lo muestra en la barra del prompt; sin nombre, genera uno a partir de la conversación."},"use":{"en":"With many sessions open: `/rename backtest` so it stands out in `/resume`.","ja":"複数のセッションを開いているとき：`/rename 株価バックテスト` にしておくと `/resume` で見つけやすい。","zh":"同时开着多个会话时：`/rename 量化回测`，之后在 `/resume` 里一眼认出。","zh-hant":"同時開著很多工作階段時：`/rename 回測`，在 `/resume` 裡一眼就能找到。","ko":"세션을 여러 개 열어 둘 때: `/rename 백테스트`로 바꿔 두면 `/resume`에서 찾기 쉽습니다.","ru":"Открыто много сессий: `/rename бэктест`, чтобы её было легко найти в `/resume`.","es":"Con muchas sesiones abiertas: `/rename backtest` para que destaque en `/resume`."}},{"cmd":"/model","args":"[model]","cat":"model","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Switch models","ja":"モデルを切り替える","zh":"切换模型","zh-hant":"切換模型","ko":"모델 바꾸기","ru":"Сменить модель","es":"Cambiar de modelo"},"word":"model","gloss":{"zh":"模型","ja":"モデル","zh-hant":"模型","ko":"모델","ru":"модель","es":"modelo"},"desc":{"en":"Switches the model and saves it as the default for new sessions. No argument opens a picker; left/right adjusts effort on supported models; press `s` on a row to switch for this session only.","ja":"AI モデルを切り替え、新しいセッションの既定にも保存します。引数なしで選択画面。対応モデルでは左右キーで推論の深さを調整、行で `s` を押すとこのセッションだけ切り替えます。","zh":"切换 AI 模型，并保存为新会话的默认模型。不带参数打开选择器；支持的模型可用左右方向键调思考力度；在某一行按 `s` 只对当前会话生效。","zh-hant":"切換模型，並儲存為新工作階段的預設值。不加參數會開啟選擇器；支援的模型可以用左右鍵調整思考力度；在某一列按 `s` 則只在這次工作階段切換。","ko":"모델을 바꾸고 새 세션의 기본값으로 저장합니다. 인수 없이 실행하면 선택 화면이 열립니다. 지원되는 모델에서는 좌우 키로 노력 수준을 조절하고, 행에서 `s`를 누르면 이 세션에서만 바꿉니다.","ru":"Переключает модель и сохраняет её по умолчанию для новых сессий. Без аргумента открывает список; стрелки влево/вправо меняют уровень усилий на моделях, где это поддерживается; нажмите `s` на строке, чтобы переключить только для этой сессии.","es":"Cambia de modelo y lo guarda como predeterminado para las sesiones nuevas. Sin argumento abre un selector; las flechas izquierda/derecha ajustan el esfuerzo en los modelos compatibles; pulsa `s` en una fila para cambiar solo en esta sesión."},"use":{"en":"Use a faster model for small edits; switch with `/model opus` when a bug gets hard.","ja":"簡単な修正は速くて安いモデル、難しいバグは `/model opus` で強いモデルに。","zh":"简单改文案用较快较省的模型；遇到难 bug 时 `/model opus` 换更强的模型。","zh-hant":"小修改用比較快的模型；遇到難纏的 bug 時用 `/model opus` 切換。","ko":"작은 수정은 빠른 모델로 하고, 버그가 어려워지면 `/model opus`로 바꿉니다.","ru":"Для мелких правок используйте быструю модель; когда ошибка оказалась сложной, переключитесь: `/model opus`.","es":"Usa un modelo más rápido para cambios pequeños; cambia con `/model opus` cuando un error se complica."}},{"cmd":"/advisor","args":"[model|off]","cat":"model","kind":"builtin","pick":false,"aliases":[],"word":"advisor","gloss":{"zh":"顾问","ja":"アドバイザー","zh-hant":"顧問","ko":"조언자","ru":"советник","es":"asesor"},"desc":{"en":"Enables or disables the advisor tool, which consults a second model at key moments. Accepts `fable`, `opus`, `sonnet` or a full model ID (`fable` requires access). No argument opens a picker.","ja":"「アドバイザー」を切り替えます。作業の重要な場面で別のモデルに助言を求めます。`fable`・`opus`・`sonnet` または完全なモデル ID を指定（`fable` は利用権限が必要）。引数なしで選択画面。","zh":"开关「顾问工具」：任务关键时刻请第二个模型提供建议。可填 `fable`、`opus`、`sonnet` 或完整模型 ID（`fable` 需要相应权限）。不带参数打开选择器。","zh-hant":"開啟或關閉顧問工具，在關鍵時刻詢問第二個模型的意見。可以填 `fable`、`opus`、`sonnet` 或完整的模型 ID（`fable` 需要存取權限）。不加參數會開啟選擇器。","ko":"중요한 순간에 두 번째 모델에게 의견을 묻는 advisor 도구를 켜거나 끕니다. `fable`, `opus`, `sonnet` 또는 전체 모델 ID를 받습니다(`fable`은 접근 권한이 필요). 인수 없이 실행하면 선택 화면이 열립니다.","ru":"Включает или выключает инструмент-советник, который в ключевые моменты обращается ко второй модели. Принимает `fable`, `opus`, `sonnet` или полный ID модели (для `fable` нужен доступ). Без аргумента открывает список.","es":"Activa o desactiva la herramienta de asesor, que consulta a un segundo modelo en los momentos clave. Acepta `fable`, `opus`, `sonnet` o un ID de modelo completo (`fable` requiere acceso). Sin argumento abre un selector."},"use":{"en":"Work on a faster model but get a stronger second opinion at key decisions: `/advisor opus`.","ja":"普段は速いモデルで作業し、重要な判断だけ強いモデルに見てもらう：`/advisor opus`。","zh":"平时用较快的模型干活，又怕关键决策出错：`/advisor opus`。","zh-hant":"平常用較快的模型工作，但在關鍵決策時取得更強模型的第二意見：`/advisor opus`。","ko":"평소에는 빠른 모델로 작업하고, 중요한 판단에서만 더 강한 모델의 의견을 받을 때: `/advisor opus`.","ru":"Работайте на быстрой модели, но получайте мнение более сильной в важных решениях: `/advisor opus`.","es":"Trabaja con un modelo más rápido, pero recibe una segunda opinión más potente en las decisiones clave: `/advisor opus`."}},{"cmd":"/effort","args":"[level|auto|status|ultracode [on|off]]","cat":"model","kind":"builtin","pick":false,"aliases":[],"word":"effort","gloss":{"zh":"努力程度（思考力度）","ja":"努力の度合い（推論の深さ）","zh-hant":"努力程度（思考力度）","ko":"노력 수준 (추론의 깊이)","ru":"усилие (глубина рассуждений)","es":"esfuerzo (profundidad del razonamiento)"},"desc":{"en":"Sets the effort level: `low` to `xhigh`, `max`, or `auto`; `status` prints it. `max` is session-only. `ultracode on|off` toggles ultracode.","ja":"推論の深さを `low`〜`xhigh`、`max`、`auto` から設定します。`status` で現在値を表示。`max` はこのセッションのみ。`ultracode on|off` で ultracode を切り替えます。","zh":"设置推理力度：`low` 到 `xhigh`、`max` 或 `auto`；`status` 显示当前值。`max` 只对当前会话有效。`ultracode on|off` 开关 ultracode 模式。","zh-hant":"設定思考力度：`low` 到 `xhigh`、`max` 或 `auto`；`status` 會顯示目前的值。`max` 只在這次工作階段有效。`ultracode on|off` 可開關 ultracode。","ko":"노력 수준을 정합니다: `low`부터 `xhigh`, `max`, `auto` 중 하나. `status`는 현재 값을 표시합니다. `max`는 이 세션에서만 유효합니다. `ultracode on|off`로 ultracode를 켜고 끕니다.","ru":"Задаёт уровень усилий: от `low` до `xhigh`, `max` или `auto`; `status` показывает текущий. `max` действует только в этой сессии. `ultracode on|off` включает и выключает ultracode.","es":"Define el nivel de esfuerzo: de `low` a `xhigh`, `max` o `auto`; `status` lo muestra. `max` vale solo para la sesión. `ultracode on|off` activa o desactiva ultracode."},"use":{"en":"Hunting a flaky bug: `/effort high`; fixing a typo: `/effort low`.","ja":"再現しにくいバグの調査：`/effort high`、誤字の修正だけ：`/effort low`。","zh":"排查难以复现的 bug：`/effort high`；只是改错别字：`/effort low`。","zh-hant":"追查時好時壞的 bug：`/effort high`；只是改錯字：`/effort low`。","ko":"재현이 어려운 버그를 찾을 때: `/effort high`, 오타만 고칠 때: `/effort low`.","ru":"Ищете нестабильную ошибку: `/effort high`; исправляете опечатку: `/effort low`.","es":"Para cazar un error intermitente: `/effort high`; para corregir una errata: `/effort low`."}},{"cmd":"/fast","args":"[on|off]","cat":"model","kind":"builtin","pick":false,"aliases":[],"word":"fast","gloss":{"zh":"快速","ja":"高速","zh-hant":"快速","ko":"빠르게","ru":"быстрый","es":"rápido"},"desc":{"en":"Toggles fast mode (same model, faster output). It can be toggled mid-response; the running turn finishes at its original speed. See the official fast mode docs for pricing.","ja":"高速モード（同じモデルで出力が速くなる）を切り替えます。応答中でも切り替えられますが、進行中のターンは元の速度のまま終わります。料金は公式の fast mode の説明を確認してください。","zh":"开关快速模式（同一个模型，输出更快）。在 Claude 回复中途也能切换，但正在进行的这一轮仍按原速度完成。计费方式请以官方 fast mode 说明为准。","zh-hant":"開關快速模式（同一個模型，輸出更快）。可以在回答途中切換，但正在進行的這一輪仍以原本的速度完成。價格請參考官方 fast mode 說明。","ko":"빠른 모드를 켜고 끕니다(같은 모델, 더 빠른 출력). 응답 도중에도 바꿀 수 있으며, 진행 중인 턴은 원래 속도로 끝납니다. 요금은 공식 빠른 모드 문서를 확인하세요.","ru":"Включает и выключает быстрый режим (та же модель, более быстрый вывод). Переключать можно прямо во время ответа; текущий ход завершится с исходной скоростью. Цены смотрите в официальной документации о быстром режиме.","es":"Activa o desactiva el modo rápido (mismo modelo, salida más rápida). Puedes cambiarlo en medio de una respuesta; el turno en curso termina a su velocidad original. Consulta la documentación oficial del modo rápido para ver los precios."},"use":{"en":"Under time pressure: `/fast on`; otherwise `/fast off`.","ja":"急ぎで大量に生成したいとき `/fast on`、急がないときは `/fast off`。","zh":"赶时间需要大量生成时 `/fast on`，不急时 `/fast off`。","zh-hant":"趕時間時：`/fast on`；其他時候：`/fast off`。","ko":"시간이 촉박할 때: `/fast on`, 그렇지 않을 때: `/fast off`.","ru":"Мало времени: `/fast on`; в остальных случаях `/fast off`.","es":"Si tienes prisa: `/fast on`; si no, `/fast off`."}},{"cmd":"/output-style","args":"[style]","cat":"model","kind":"builtin","pick":false,"aliases":[],"since":"2.1.269","word":"output style","gloss":{"zh":"输出风格","ja":"出力スタイル","zh-hant":"輸出風格","ko":"출력 스타일","ru":"стиль вывода","es":"estilo de salida"},"desc":{"en":"Lists output styles or switches to one, e.g. `/output-style concise`.","ja":"出力スタイル（回答の書き方）を一覧表示・切り替えします。例：`/output-style concise`。","zh":"列出或切换输出风格（回答的写法），例如 `/output-style concise`。","zh-hant":"列出輸出風格或切換到其中一種，例如 `/output-style concise`。","ko":"출력 스타일 목록을 보여 주거나 하나로 바꿉니다. 예: `/output-style concise`.","ru":"Показывает список стилей вывода или переключает на один из них, например `/output-style concise`.","es":"Muestra los estilos de salida o cambia a uno, por ejemplo `/output-style concise`."},"use":{"en":"Run `/output-style` with no argument to see what is available, then pick one (for example a more concise style).","ja":"まず引数なしの `/output-style` で一覧を見て、自分に合うもの（例：簡潔なもの）を選びます。","zh":"先不带参数运行 `/output-style` 看有哪些风格，再选一个适合你的（例如更简洁的）。","zh-hant":"先不加參數執行 `/output-style`，看看有哪些風格，再選一個（例如比較簡潔的風格）。","ko":"먼저 인수 없이 `/output-style`을 실행해 무엇이 있는지 보고, 하나를 고릅니다(예: 더 간결한 스타일).","ru":"Запустите `/output-style` без аргумента, чтобы увидеть доступные стили, и выберите один (например, более краткий).","es":"Ejecuta `/output-style` sin argumento para ver qué hay disponible y luego elige uno (por ejemplo, un estilo más conciso)."}},{"cmd":"/init","args":"","cat":"project","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Create the project's CLAUDE.md","ja":"プロジェクトの説明書 CLAUDE.md を作る","zh":"生成项目说明书 CLAUDE.md","zh-hant":"建立專案的 CLAUDE.md","ko":"프로젝트의 CLAUDE.md 만들기","ru":"Создать CLAUDE.md для проекта","es":"Crear el CLAUDE.md del proyecto"},"word":"initialize","gloss":{"zh":"初始化","ja":"初期化","zh-hant":"初始化","ko":"초기화","ru":"инициализировать","es":"inicializar"},"desc":{"en":"Initializes the project with a `CLAUDE.md` guide that every new session reads. Offers `/import` if it finds Codex or Gemini CLI configuration.","ja":"プロジェクトを読み込んで `CLAUDE.md`（プロジェクトの説明書）を作ります。以降の新しい会話は毎回これを読みます。Codex や Gemini CLI の設定があれば `/import` での移行を提案します。","zh":"读取项目并生成 `CLAUDE.md`「项目说明书」，之后每次新对话都会先读它。如果发现 Codex 或 Gemini CLI 的配置，会提议用 `/import` 迁移。","zh-hant":"為專案建立一份 `CLAUDE.md` 說明，之後每個新工作階段都會先讀它。如果發現 Codex 或 Gemini CLI 的設定，會建議使用 `/import`。","ko":"새 세션마다 읽는 `CLAUDE.md` 안내 파일로 프로젝트를 초기화합니다. Codex나 Gemini CLI 설정을 찾으면 `/import`를 제안합니다.","ru":"Подготавливает проект: создаёт руководство `CLAUDE.md`, которое читает каждая новая сессия. Предлагает `/import`, если находит настройки Codex или Gemini CLI.","es":"Inicializa el proyecto con una guía `CLAUDE.md` que lee cada sesión nueva. Ofrece `/import` si encuentra configuración de Codex o Gemini CLI."},"use":{"en":"First thing in a new repo: `/init`, then refine it with `/memory`.","ja":"新しいプロジェクトでまず `/init`。そのあと `/memory` で「日本語で答えて」などの希望を追記します。","zh":"接手新项目时第一件事：`/init`，然后用 `/memory` 补充「请用中文回答」等个人要求。","zh-hant":"接手新的程式庫時第一件事：`/init`，然後用 `/memory` 補充調整。","ko":"새 저장소에서 가장 먼저: `/init`. 그다음 `/memory`로 내용을 다듬습니다.","ru":"Первое, что стоит сделать в новом репозитории: `/init`, затем уточнить через `/memory`.","es":"Lo primero en un repositorio nuevo: `/init`, y luego mejóralo con `/memory`."}},{"cmd":"/add-dir","args":"<path>","cat":"project","kind":"builtin","pick":false,"aliases":[],"word":"add directory","gloss":{"zh":"添加文件夹","ja":"フォルダーの追加","zh-hant":"新增資料夾","ko":"폴더 추가","ru":"добавить папку","es":"añadir carpeta"},"desc":{"en":"Adds a working directory for file access this session without moving. Partial paths autocomplete with `Tab`. Most `.claude/` config in the added directory isn't discovered, and most network paths can't be added.","ja":"このセッションで別のフォルダーへのアクセスを追加します（作業場所はそのまま）。パスの途中まで入力すると候補が出て `Tab` で確定。追加したフォルダーの `.claude/` 設定はほとんど読み込まれず、ネットワークパスの多くは追加できません。","zh":"本次会话额外允许访问另一个文件夹，当前工作位置不变。输入部分路径会提示补全，按 `Tab` 接受。被添加文件夹里的大部分 `.claude/` 配置不会被读取；多数网络路径不能添加。","zh-hant":"在這次工作階段中額外允許存取另一個工作資料夾，目前位置不會改變。輸入部分路徑後可以按 `Tab` 自動完成。新增的資料夾裡大部分的 `.claude/` 設定不會被讀取，而且大多數網路路徑無法新增。","ko":"이동하지 않고 이 세션에서 파일에 접근할 작업 폴더를 추가합니다. 경로 일부를 입력하고 `Tab`을 누르면 자동 완성됩니다. 추가한 폴더의 `.claude/` 설정은 대부분 인식되지 않으며, 네트워크 경로는 대부분 추가할 수 없습니다.","ru":"Добавляет рабочую папку для доступа к файлам в этой сессии, не переходя в неё. Неполные пути дополняются клавишей `Tab`. Большая часть настроек `.claude/` в добавленной папке не подхватывается, а большинство сетевых путей добавить нельзя.","es":"Añade una carpeta de trabajo para acceder a sus archivos en esta sesión, sin moverte. Las rutas parciales se autocompletan con `Tab`. La mayor parte de la configuración `.claude/` de la carpeta añadida no se detecta, y la mayoría de las rutas de red no se pueden añadir."},"use":{"en":"Frontend and backend live side by side: `/add-dir ../backend`.","ja":"フロントとバックエンドが別フォルダーなら：`/add-dir ../backend` で両方を見せます。","zh":"前端和后端分在两个文件夹：`/add-dir ../backend`，让它同时看两边。","zh-hant":"前端和後端放在相鄰的資料夾：`/add-dir ../backend`。","ko":"프런트엔드와 백엔드가 나란히 있을 때: `/add-dir ../backend`.","ru":"Фронтенд и бэкенд лежат рядом: `/add-dir ../backend`.","es":"El frontend y el backend están uno al lado del otro: `/add-dir ../backend`."}},{"cmd":"/cd","args":"<path>","cat":"project","kind":"builtin","pick":false,"aliases":[],"word":"change directory","gloss":{"zh":"切换文件夹","ja":"フォルダーの移動","zh-hant":"切換資料夾","ko":"폴더 이동","ru":"сменить папку","es":"cambiar de carpeta"},"desc":{"en":"Moves the session to a new working directory, keeping the conversation. Unlike `/add-dir`, `/cd` changes where the session lives.","ja":"会話を残したまま、セッションを別のフォルダーに移します。`/add-dir` との違い：`/cd` は引っ越し、`/add-dir` は入り口を一つ増やすイメージです。","zh":"把当前会话移到另一个工作文件夹，对话保留。和 `/add-dir` 的区别：`/cd` 是搬家，`/add-dir` 是多开一扇门。","zh-hant":"把工作階段移到新的工作資料夾，對話會保留。和 `/add-dir` 不同，`/cd` 會改變工作階段所在的位置。","ko":"대화를 유지한 채 세션을 새 작업 폴더로 옮깁니다. `/add-dir`와 달리 `/cd`는 세션이 있는 위치 자체를 바꿉니다.","ru":"Переносит сессию в другую рабочую папку, сохраняя разговор. В отличие от `/add-dir`, `/cd` меняет место, где работает сессия.","es":"Mueve la sesión a otra carpeta de trabajo y conserva la conversación. A diferencia de `/add-dir`, `/cd` cambia el lugar donde vive la sesión."},"use":{"en":"Started in the wrong folder: `/cd ~/projects/website` instead of starting over.","ja":"違うフォルダーで始めてしまったら：`/cd ~/projects/website` でやり直し不要。","zh":"在错误的文件夹里开始了对话：`/cd ~/projects/website`，不用重来。","zh-hant":"在錯誤的資料夾開始了：`/cd ~/projects/website`，不用從頭來過。","ko":"엉뚱한 폴더에서 시작했다면 처음부터 다시 하지 말고: `/cd ~/projects/website`.","ru":"Начали не в той папке: `/cd ~/projects/website` вместо того, чтобы начинать заново.","es":"Empezaste en la carpeta equivocada: `/cd ~/projects/website` en lugar de empezar de nuevo."}},{"cmd":"/diff","args":"","cat":"project","kind":"builtin","pick":false,"aliases":[],"word":"difference","gloss":{"zh":"差异、改动对比","ja":"差分","zh-hant":"差異、修改比對","ko":"차이·변경 내역","ru":"разница, изменения","es":"diferencia"},"desc":{"en":"Reviews changes in your working tree, including Claude's edits so far.","ja":"作業ツリーの変更（Claude がこれまでに行った編集を含む）を確認します。","zh":"查看工作区的改动，包括 Claude 目前做的修改。","zh-hant":"檢視工作目錄中的修改，包括 Claude 到目前為止做的編輯。","ko":"작업 트리의 변경 사항을 검토합니다. 지금까지 Claude가 수정한 내용도 포함됩니다.","ru":"Показывает изменения в рабочей копии, включая уже сделанные правки Claude.","es":"Revisa los cambios de tu árbol de trabajo, incluidos los que Claude ha hecho hasta ahora."},"use":{"en":"Before committing, `/diff` to see exactly what changed.","ja":"「できました」と言われたら、コミット前に `/diff` で中身を自分の目で確認。","zh":"Claude 说「改好了」后，提交前先 `/diff` 亲眼确认改了什么。","zh-hant":"提交之前，用 `/diff` 確認到底改了什麼。","ko":"커밋하기 전에 `/diff`로 정확히 무엇이 바뀌었는지 확인합니다.","ru":"Перед коммитом: `/diff`, чтобы точно увидеть, что изменилось.","es":"Antes de hacer commit, `/diff` para ver exactamente qué cambió."}},{"cmd":"/import","args":"[codex|gemini|cursor] [--dry-run] [--yes]","cat":"project","kind":"builtin","pick":false,"aliases":[],"risk":["files"],"word":"import","gloss":{"zh":"导入","ja":"インポート・取り込み","zh-hant":"匯入","ko":"가져오기","ru":"импорт","es":"importar"},"desc":{"en":"Imports instruction files, MCP servers, commands, subagents and skills from OpenAI Codex, Gemini CLI or Cursor. `--dry-run` previews. Unavailable on some cloud providers; Cursor import requires v2.1.265+.","ja":"OpenAI Codex・Google Gemini CLI・Cursor の設定（指示ファイル、MCP サーバー、コマンド、サブエージェント、スキル）を取り込みます。`--dry-run` はプレビューのみ。一部のクラウド環境では使えません。Cursor からは v2.1.265 以降。","zh":"把本机 OpenAI Codex、Google Gemini CLI 或 Cursor 的配置（说明文件、MCP 服务器、命令、子代理、技能）导入 Claude Code。`--dry-run` 只预览不写入。部分云平台不可用；从 Cursor 导入需 v2.1.265+。","zh-hant":"從 OpenAI Codex、Gemini CLI 或 Cursor 匯入說明檔、MCP 伺服器、指令、子代理和技能。`--dry-run` 只預覽。部分雲端供應商無法使用；從 Cursor 匯入需要 v2.1.265+。","ko":"OpenAI Codex, Gemini CLI, Cursor에서 지침 파일, MCP 서버, 명령, 서브에이전트, 스킬을 가져옵니다. `--dry-run`은 미리 보기만 합니다. 일부 클라우드 제공업체에서는 사용할 수 없고, Cursor 가져오기는 v2.1.265 이상이 필요합니다.","ru":"Импортирует файлы инструкций, серверы MCP, команды, субагентов и навыки из OpenAI Codex, Gemini CLI или Cursor. `--dry-run` показывает, что будет сделано. Недоступно у некоторых облачных провайдеров; для импорта из Cursor нужна версия v2.1.265+.","es":"Importa archivos de instrucciones, servidores MCP, comandos, subagentes y habilidades de OpenAI Codex, Gemini CLI o Cursor. `--dry-run` muestra una vista previa. No está disponible en algunos proveedores en la nube; importar desde Cursor requiere v2.1.265 o posterior."},"use":{"en":"Moving from Cursor: `/import cursor --dry-run` first, then import for real.","ja":"Cursor から移るとき：まず `/import cursor --dry-run` で内容を確認してから本番の取り込み。","zh":"从 Cursor 转过来：先 `/import cursor --dry-run` 看会导入什么，没问题再正式导入。","zh-hant":"從 Cursor 轉過來：先執行 `/import cursor --dry-run`，再正式匯入。","ko":"Cursor에서 옮겨 올 때: 먼저 `/import cursor --dry-run`으로 확인한 뒤 실제로 가져옵니다.","ru":"Переходите с Cursor: сначала `/import cursor --dry-run`, потом импорт по-настоящему.","es":"Si vienes de Cursor: primero `/import cursor --dry-run` y después importa de verdad."}},{"cmd":"/insights","args":"","cat":"project","kind":"builtin","pick":false,"aliases":[],"word":"insights","gloss":{"zh":"洞察、分析","ja":"インサイト・分析","zh-hant":"洞察、分析","ko":"인사이트·분석","ru":"выводы, аналитика","es":"ideas, análisis"},"desc":{"en":"Generates an HTML report of your recent sessions on this machine: projects, habits, where things go wrong, features to try. Not available in cloud sessions.","ja":"このマシンでの最近の使い方（よく使うプロジェクト、使い方、つまずきやすい点、試すとよい機能）を分析した HTML レポートを作ります。クラウドセッションでは使えません。","zh":"生成一份 HTML 报告，分析你在本机的近期使用：常用项目、使用方式、容易出错的地方、值得尝试的功能。云端会话中不可用。","zh-hant":"為你在這台電腦上最近的工作階段產生一份 HTML 報告：專案、使用習慣、容易出問題的地方、值得嘗試的功能。雲端工作階段中無法使用。","ko":"이 컴퓨터의 최근 세션을 HTML 보고서로 만들어 줍니다: 프로젝트, 사용 습관, 자주 막히는 곳, 써 볼 만한 기능. 클라우드 세션에서는 사용할 수 없습니다.","ru":"Создаёт HTML-отчёт о ваших недавних сессиях на этом компьютере: проекты, привычки, где возникают проблемы, какие функции стоит попробовать. Недоступно в облачных сессиях.","es":"Genera un informe HTML de tus sesiones recientes en este equipo: proyectos, hábitos, dónde fallan las cosas y funciones que vale la pena probar. No está disponible en sesiones en la nube."},"use":{"en":"After a few weeks, run `/insights` to discover features you never tried.","ja":"しばらく使ったら `/insights` で、まだ使っていない便利な機能を見つけます。","zh":"用了一段时间后 `/insights`，发现自己从没用过的好功能。","zh-hant":"用了幾週之後，執行 `/insights`，發現你從沒用過的功能。","ko":"몇 주 사용한 뒤 `/insights`로 아직 써 보지 않은 기능을 찾아봅니다.","ru":"Через несколько недель запустите `/insights`, чтобы найти функции, которые вы ещё не пробовали.","es":"Después de unas semanas, ejecuta `/insights` para descubrir funciones que nunca probaste."}},{"cmd":"/team-onboarding","args":"","cat":"project","kind":"builtin","pick":false,"aliases":[],"risk":["secrets"],"word":"team onboarding","gloss":{"zh":"团队新人入门","ja":"チームへの新人受け入れ","zh-hant":"團隊新成員入門","ko":"팀 온보딩 (새 팀원 맞이하기)","ru":"ввод в команду","es":"incorporación al equipo"},"desc":{"en":"Analyzes your last 30 days of sessions, commands and MCP usage and writes a Markdown guide a teammate can paste as their first message.","ja":"過去 30 日のセッション・コマンド・MCP の使い方を分析し、新しいメンバーが最初のメッセージとして貼り付けられる Markdown のガイドを作ります。","zh":"分析你过去 30 天的会话、命令和 MCP 使用情况，生成一份 Markdown 入门指南，新同事可以直接作为第一条消息粘贴。","zh-hant":"分析你過去 30 天的工作階段、指令和 MCP 使用情況，寫出一份 Markdown 指南，讓同事可以貼上當作第一則訊息。","ko":"최근 30일간의 세션, 명령, MCP 사용 내역을 분석해서, 새 팀원이 첫 메시지로 붙여 넣을 수 있는 Markdown 가이드를 작성합니다.","ru":"Анализирует ваши сессии, команды и использование MCP за последние 30 дней и пишет руководство в Markdown, которое коллега может вставить первым сообщением.","es":"Analiza tus sesiones, comandos y uso de MCP de los últimos 30 días y escribe una guía en Markdown que un compañero puede pegar como su primer mensaje."},"use":{"en":"A new teammate joins: run `/team-onboarding` and send them the guide.","ja":"新メンバーが来たら：`/team-onboarding` でガイドを作って渡します。","zh":"团队来了新人：`/team-onboarding`，把生成的指南发给 TA。","zh-hant":"有新同事加入：執行 `/team-onboarding`，把指南傳給對方。","ko":"새 팀원이 합류하면: `/team-onboarding`을 실행하고 가이드를 보내 줍니다.","ru":"В команду пришёл новый человек: запустите `/team-onboarding` и отправьте ему руководство.","es":"Llega alguien nuevo al equipo: ejecuta `/team-onboarding` y envíale la guía."}},{"cmd":"/code-review","args":"[low|medium|high|xhigh|max|ultra] [--fix] [--comment] [--max-findings n|all|default] [pr#|branch|path]","cat":"quality","kind":"skill","pick":true,"aliases":["/review"],"short":{"en":"Check for bugs before committing, optionally fix them","ja":"コミット前にバグを確認し、自動修正も可能","zh":"提交前检查 bug，可自动修复","zh-hant":"提交前檢查 bug，也可以順便修正","ko":"커밋 전에 버그 검사, 필요하면 수정까지","ru":"Найти ошибки перед коммитом и при желании исправить","es":"Buscar errores antes del commit y, si quieres, corregirlos"},"risk":["cost","external","files"],"word":"code review","gloss":{"zh":"代码审查","ja":"コードレビュー","zh-hant":"程式碼審查","ko":"코드 리뷰","ru":"ревью кода","es":"revisión de código"},"desc":{"en":"Reviews the current diff, or a PR, branch or path, for correctness bugs. `--fix` applies findings, `--comment` posts to the GitHub PR or GitLab MR, `ultra` runs a deep cloud review.","ja":"現在の変更（または指定した PR・ブランチ・パス）に正しさのバグがないか調べます。深さを選べ、`--fix` で修正まで、`--comment` で GitHub PR／GitLab MR にコメント、`ultra` でクラウドの詳細レビュー。","zh":"检查当前改动（或指定的 PR、分支、路径）有没有正确性 bug。可选力度；`--fix` 让 Claude 直接修，`--comment` 发到 GitHub PR 或 GitLab MR；`ultra` 在云端做深度审查。","zh-hant":"檢查目前的修改（或指定的 PR、分支、路徑）有沒有正確性方面的 bug。`--fix` 會套用修正，`--comment` 會發布到 GitHub PR 或 GitLab MR，`ultra` 會在雲端進行深度審查。","ko":"현재 diff, 또는 PR·브랜치·경로를 대상으로 정확성 버그를 검토합니다. `--fix`는 지적 사항을 적용하고, `--comment`는 GitHub PR이나 GitLab MR에 댓글을 남기며, `ultra`는 클라우드에서 심층 리뷰를 실행합니다.","ru":"Проверяет текущий diff, а также PR, ветку или путь на ошибки в логике. `--fix` применяет найденные исправления, `--comment` публикует замечания в GitHub PR или GitLab MR, `ultra` запускает глубокую проверку в облаке.","es":"Revisa el diff actual, o un PR, una rama o una ruta, en busca de errores de funcionamiento. `--fix` aplica las correcciones, `--comment` publica en el PR de GitHub o el MR de GitLab, `ultra` hace una revisión profunda en la nube."},"use":{"en":"Before committing: `/code-review high --fix`. For a PR: `/code-review high 1234`.","ja":"コミット前に：`/code-review high --fix`。他人の PR なら：`/code-review high 1234`。","zh":"提交前：`/code-review high --fix`，找出问题并顺手修好。审查别人的 PR：`/code-review high 1234`。","zh-hant":"提交之前：`/code-review high --fix`。審查 PR：`/code-review high 1234`。","ko":"커밋 전에: `/code-review high --fix`. PR을 검토할 때: `/code-review high 1234`.","ru":"Перед коммитом: `/code-review high --fix`. Для PR: `/code-review high 1234`.","es":"Antes de hacer commit: `/code-review high --fix`. Para un PR: `/code-review high 1234`."}},{"cmd":"/run","args":"","cat":"quality","kind":"skill","pick":false,"aliases":[],"word":"run","gloss":{"zh":"运行","ja":"実行","zh-hant":"執行","ko":"실행","ru":"запустить","es":"ejecutar"},"desc":{"en":"Launches and drives your project's app to see a change working.","ja":"プロジェクトのアプリを起動・操作して、変更の実際の動きを見ます。","zh":"启动并操作你的项目应用，看改动的实际效果。","zh-hant":"啟動並操作你專案的應用程式，看看修改實際運作的樣子。","ko":"프로젝트의 앱을 실행하고 조작해서 변경이 동작하는 모습을 확인합니다.","ru":"Запускает приложение проекта и управляет им, чтобы увидеть изменение в работе.","es":"Inicia y maneja la aplicación de tu proyecto para ver un cambio funcionando."},"use":{"en":"`/run` to start the site and screenshot the new homepage.","ja":"`/run` でサイトを起動し、新しいトップページのスクリーンショットを見せてもらう。","zh":"`/run`，让它启动网站并截图新首页给你看。","zh-hant":"`/run`，啟動網站並截圖新的首頁。","ko":"`/run`으로 사이트를 띄우고 새 홈페이지의 스크린샷을 찍게 합니다.","ru":"`/run`, чтобы запустить сайт и сделать снимок экрана новой главной страницы.","es":"`/run` para arrancar el sitio y hacer una captura de la nueva página de inicio."}},{"cmd":"/run-skill-generator","args":"","cat":"quality","kind":"skill","pick":false,"aliases":[],"word":"skill generator","gloss":{"zh":"技能生成器","ja":"スキル生成","zh-hant":"技能產生器","ko":"스킬 생성기","ru":"генератор навыка","es":"generador de habilidades"},"desc":{"en":"Writes a per-project skill that teaches `/run` and `/verify` how to build, launch and drive your app from a clean environment.","ja":"このプロジェクト専用のスキルを書き、`/run` と `/verify` にクリーンな環境からのビルド・起動・操作方法を教えます。","zh":"为本项目写一个专属技能，教会 `/run` 和 `/verify` 如何从干净环境构建、启动和操作你的应用。","zh-hant":"為這個專案寫一個專屬技能，教 `/run` 和 `/verify` 如何從乾淨的環境建置、啟動和操作你的應用程式。","ko":"깨끗한 환경에서 앱을 빌드, 실행, 조작하는 방법을 `/run`과 `/verify`에 알려 주는 프로젝트 전용 스킬을 작성합니다.","ru":"Пишет навык для проекта, который учит `/run` и `/verify` собирать, запускать и управлять вашим приложением в чистом окружении.","es":"Escribe una habilidad propia del proyecto que enseña a `/run` y `/verify` a compilar, iniciar y manejar tu aplicación desde un entorno limpio."},"use":{"en":"Startup needs several steps (database first, etc.): run this once, then `/run` just works.","ja":"起動手順が複雑（先に DB を起動など）なら一度実行。以後は `/run` だけで済みます。","zh":"项目启动步骤复杂（要先起数据库等），跑一次，以后 `/run` 一步到位。","zh-hant":"啟動需要好幾個步驟（例如要先開資料庫）：執行一次這個指令，之後 `/run` 就能直接運作。","ko":"시작 절차가 여러 단계일 때(먼저 데이터베이스 실행 등): 한 번 실행해 두면 이후 `/run`만으로 됩니다.","ru":"Запуск требует нескольких шагов (сначала база данных и т. п.): выполните это один раз, и дальше `/run` просто работает.","es":"El arranque necesita varios pasos (primero la base de datos, etc.): ejecútalo una vez y después `/run` funciona sin más."}},{"cmd":"/security-review","args":"","cat":"quality","kind":"builtin","pick":false,"aliases":[],"word":"security review","gloss":{"zh":"安全审查","ja":"セキュリティレビュー","zh-hant":"安全性審查","ko":"보안 리뷰","ru":"проверка безопасности","es":"revisión de seguridad"},"desc":{"en":"Analyzes your branch's diff against origin's default branch for vulnerabilities such as injection, auth issues and data exposure. Needs an `origin` remote.","ja":"現在のブランチとリモートの既定ブランチの差分から、インジェクション・認証の問題・データ漏えいなどの危険を探します。`origin` リモートが必要です。","zh":"对比当前分支与远程默认分支的差异，找出安全隐患，如注入、认证问题、数据泄露。需要名为 `origin` 的远程仓库。","zh-hant":"比對你的分支與 origin 預設分支之間的差異，找出漏洞，例如注入、驗證問題和資料外洩。需要名為 `origin` 的遠端。","ko":"현재 브랜치와 origin 기본 브랜치의 diff를 분석해 인젝션, 인증 문제, 데이터 노출 같은 취약점을 찾습니다. `origin` 원격 저장소가 필요합니다.","ru":"Анализирует diff вашей ветки относительно ветки по умолчанию в origin на уязвимости: инъекции, проблемы с авторизацией, утечки данных. Нужен remote `origin`.","es":"Analiza el diff de tu rama frente a la rama predeterminada de origin en busca de vulnerabilidades como inyección, problemas de autenticación o exposición de datos. Necesita un remoto `origin`."},"use":{"en":"Before shipping anything touching auth, payments or user data.","ja":"ログイン・決済・個人情報に関わる変更を公開する前に一度実行。","zh":"涉及登录、支付、用户数据的改动上线前跑一次。","zh-hant":"任何涉及登入驗證、付款或使用者資料的修改，上線前都跑一次。","ko":"인증, 결제, 사용자 데이터와 관련된 변경을 배포하기 전에 실행합니다.","ru":"Перед выпуском всего, что касается авторизации, платежей или данных пользователей.","es":"Antes de publicar algo que toque autenticación, pagos o datos de usuarios."}},{"cmd":"/simplify","args":"[target]","cat":"quality","kind":"skill","pick":false,"aliases":[],"risk":["files"],"word":"simplify","gloss":{"zh":"简化","ja":"簡素化","zh-hant":"簡化","ko":"단순화","ru":"упростить","es":"simplificar"},"desc":{"en":"Four parallel agents review changed code for reuse, simplification, efficiency and abstraction level, then apply fixes. It does not look for correctness bugs; use `/code-review` for that.","ja":"4 つのレビューエージェントが並行して、既存コードの再利用・簡素化・効率・抽象度を確認し、修正まで行います。正しさのバグは対象外（それは `/code-review`）。","zh":"4 个审查代理并行检查改动：能否复用现有代码、能否更简单、效率、抽象层级是否合适，并直接改好。不查正确性 bug（那是 `/code-review` 的事）。","zh-hant":"4 個代理平行檢查修改過的程式碼：能否重複利用、能否更簡單、效率、抽象層級，然後直接套用修正。它不會找正確性的 bug；那要用 `/code-review`。","ko":"에이전트 4개가 병렬로 변경된 코드를 재사용, 단순화, 효율, 추상화 수준 관점에서 검토한 뒤 수정을 적용합니다. 정확성 버그는 찾지 않으니, 그런 용도에는 `/code-review`를 사용하세요.","ru":"Четыре агента параллельно проверяют изменённый код на повторное использование, простоту, эффективность и уровень абстракции, затем применяют исправления. Ошибки в логике не ищет; для этого используйте `/code-review`.","es":"Cuatro agentes en paralelo revisan el código cambiado buscando reutilización, simplificación, eficiencia y nivel de abstracción, y luego aplican las correcciones. No busca errores de funcionamiento; para eso usa `/code-review`."},"use":{"en":"The feature works and you want cleaner code: `/simplify`.","ja":"動くようになったあと、保守しやすくしたいとき：`/simplify`。","zh":"功能已经能跑，想让代码更好维护：`/simplify`。","zh-hant":"功能已經能正常運作，想讓程式碼更乾淨：`/simplify`。","ko":"기능은 동작하는데 코드를 더 깔끔하게 하고 싶을 때: `/simplify`.","ru":"Функция работает, и вы хотите код почище: `/simplify`.","es":"La función ya funciona y quieres un código más limpio: `/simplify`."}},{"cmd":"/ultrareview","args":"[PR or branch]","cat":"quality","kind":"builtin","pick":false,"aliases":[],"risk":["cost"],"word":"ultra review","gloss":{"zh":"超深度审查","ja":"超詳細レビュー","zh-hant":"超深度審查","ko":"울트라 리뷰 (초정밀 리뷰)","ru":"сверхглубокое ревью","es":"revisión ultra"},"desc":{"en":"Deep multi-agent review in a cloud sandbox. The preferred form is `/code-review ultra`; `/ultrareview` is an alias. Includes 3 free runs on Pro, Max and Ultra, then requires usage credits.","ja":"クラウドのサンドボックスで複数エージェントによる詳細レビューを行います。推奨は `/code-review ultra`（`/ultrareview` は別名）。Pro・Max・Ultra は 3 回無料、その後は使用量クレジットが必要です。","zh":"在云端沙箱里用多个代理深度审查代码。推荐写法是 `/code-review ultra`，`/ultrareview` 是别名。Pro、Max、Ultra 含 3 次免费，之后需要用量额度。","zh-hant":"在雲端沙箱中用多個代理深度審查。建議的寫法是 `/code-review ultra`；`/ultrareview` 是別名。Pro、Max 和 Ultra 包含 3 次免費執行，之後需要用量額度。","ko":"클라우드 샌드박스에서 여러 에이전트가 심층 리뷰를 합니다. 권장 형식은 `/code-review ultra`이고, `/ultrareview`는 별칭입니다. Pro, Max, Ultra에서 무료 3회가 포함되며, 그 뒤에는 사용량 크레딧이 필요합니다.","ru":"Глубокая проверка несколькими агентами в облачной песочнице. Предпочтительная форма — `/code-review ultra`; `/ultrareview` — её псевдоним. На тарифах Pro, Max и Ultra есть 3 бесплатных запуска, дальше нужны кредиты использования.","es":"Revisión profunda con varios agentes en un sandbox en la nube. La forma preferida es `/code-review ultra`; `/ultrareview` es un alias. Incluye 3 ejecuciones gratis en Pro, Max y Ultra; después requiere créditos de uso."},"use":{"en":"Before a major release: `/code-review ultra`.","ja":"重要なリリースの前に：`/code-review ultra`。","zh":"重要版本发布前：`/code-review ultra`。","zh-hant":"重大版本發布前：`/code-review ultra`。","ko":"중요한 릴리스 전에: `/code-review ultra`.","ru":"Перед крупным релизом: `/code-review ultra`.","es":"Antes de una versión importante: `/code-review ultra`."}},{"cmd":"/verify","args":"","cat":"quality","kind":"skill","pick":false,"aliases":[],"word":"verify","gloss":{"zh":"验证","ja":"検証","zh-hant":"驗證","ko":"검증","ru":"проверить","es":"verificar"},"desc":{"en":"Builds, runs and observes your app to confirm a change works, rather than relying on tests or type checks. Runs only when you invoke it.","ja":"アプリを実際にビルド・起動して結果を観察し、変更が意図どおりか確認します（テストや型チェックだけに頼らない）。手動で呼んだときだけ動きます。","zh":"真正构建并运行你的应用、观察结果，确认改动有效，而不是只看测试或类型检查。只在你手动调用时运行。","zh-hant":"實際建置、執行並觀察你的應用程式，確認修改有效，而不是只依賴測試或型別檢查。只有在你呼叫時才會執行。","ko":"테스트나 타입 검사에만 의존하지 않고, 앱을 빌드하고 실행해서 직접 보며 변경이 제대로 동작하는지 확인합니다. 직접 실행했을 때만 동작합니다.","ru":"Собирает и запускает ваше приложение и наблюдает за ним, чтобы убедиться, что изменение работает, а не полагаться только на тесты или проверку типов. Запускается, только когда вы сами его вызываете.","es":"Compila, ejecuta y observa tu aplicación para confirmar que un cambio funciona, en lugar de fiarse de las pruebas o de la comprobación de tipos. Solo se ejecuta cuando lo invocas."},"use":{"en":"Changed a button's behavior: `/verify` so it actually clicks it.","ja":"ボタンの動作を変えたら：`/verify` で実際に開いて押して確認。","zh":"改了按钮逻辑：`/verify`，让它亲自打开应用点一下。","zh-hant":"改了按鈕的行為：`/verify`，讓它真的去點一下。","ko":"버튼 동작을 바꿨다면: `/verify`로 실제로 버튼을 눌러 보게 합니다.","ru":"Изменили поведение кнопки: `/verify`, чтобы Claude действительно нажал на неё.","es":"Cambiaste el comportamiento de un botón: `/verify` para que de verdad haga clic en él."}},{"cmd":"/agents","args":"","cat":"parallel","kind":"builtin","pick":false,"aliases":[],"word":"agents","gloss":{"zh":"代理（智能体）","ja":"エージェント","zh-hant":"代理（智慧代理）","ko":"에이전트","ru":"агенты","es":"agentes"},"desc":{"en":"Prints a reminder to ask Claude to create or manage subagents, or to edit `.claude/agents/` directly. On v2.1.197 and earlier, opened an interactive manager.","ja":"新しいバージョンでは案内が表示されるだけです：Claude にサブエージェントの作成・管理を頼むか、`.claude/agents/` を直接編集します。v2.1.197 以前は管理画面が開きます。","zh":"新版本中只显示一条提示：直接让 Claude 创建或管理子代理，或编辑 `.claude/agents/` 文件夹。v2.1.197 及更早版本会打开管理界面。","zh-hant":"顯示一則提醒：請直接要求 Claude 建立或管理子代理，或直接編輯 `.claude/agents/`。在 v2.1.197 及更早的版本中，會開啟互動式管理介面。","ko":"서브에이전트를 만들거나 관리하려면 Claude에게 부탁하거나 `.claude/agents/`를 직접 편집하라는 안내를 표시합니다. v2.1.197 이하에서는 대화형 관리 화면을 열었습니다.","ru":"Выводит напоминание: попросите Claude создать субагентов или управлять ими либо редактируйте `.claude/agents/` напрямую. В версии v2.1.197 и раньше открывал интерактивный менеджер.","es":"Muestra un recordatorio de que puedes pedirle a Claude que cree o gestione subagentes, o editar `.claude/agents/` directamente. En v2.1.197 y anteriores abría un gestor interactivo."},"use":{"en":"Just ask: “Create a subagent that only writes tests.”","ja":"「テスト専門のサブエージェントを作って」と頼むだけで OK。","zh":"直接说：「帮我建一个专门写测试的子代理」。","zh-hant":"直接說：「建立一個只負責寫測試的子代理。」","ko":"그냥 부탁하면 됩니다: \"테스트만 작성하는 서브에이전트를 만들어 줘.\"","ru":"Просто попросите: «Создай субагента, который только пишет тесты».","es":"Simplemente pídelo: «Crea un subagente que solo escriba pruebas»."}},{"cmd":"/background","args":"[prompt]","cat":"parallel","kind":"builtin","pick":false,"aliases":["/bg"],"word":"background","gloss":{"zh":"后台","ja":"バックグラウンド","zh-hant":"背景","ko":"백그라운드","ru":"фон","es":"segundo plano"},"desc":{"en":"Detaches the session to run as a background agent and frees the terminal. Optionally sends one more instruction first. Monitor with `claude agents`.","ja":"今のセッションをバックグラウンドのエージェントとして動かし続け、ターミナルを空けます。最後の指示を添えることもできます。確認は `claude agents`。","zh":"把当前会话转为后台代理继续运行，释放终端。可附带最后一条指令。用 `claude agents` 查看。","zh-hant":"把工作階段轉為背景代理繼續執行，並釋放終端機。可以先再傳一條指示。用 `claude agents` 查看狀態。","ko":"세션을 분리해 백그라운드 에이전트로 실행하고 터미널을 비워 줍니다. 그 전에 지시를 하나 더 보낼 수도 있습니다. `claude agents`로 상태를 지켜봅니다.","ru":"Отсоединяет сессию, чтобы она работала как фоновый агент, и освобождает терминал. По желанию сначала отправляет ещё одно указание. Следить можно через `claude agents`.","es":"Separa la sesión para que siga como agente en segundo plano y libera la terminal. Opcionalmente, antes envía una instrucción más. Síguela con `claude agents`."},"use":{"en":"A 30-minute job: `/bg write the results to report.md when done`.","ja":"30 分かかる作業なら：`/bg 終わったら結果を report.md に書いて`。","zh":"一个要跑半小时的整理任务：`/bg 完成后把结果写进 report.md`。","zh-hant":"需要 30 分鐘的工作：`/bg 完成後把結果寫進 report.md`。","ko":"30분 걸리는 작업이라면: `/bg 끝나면 결과를 report.md에 써 줘`.","ru":"Работа на 30 минут: `/bg когда закончишь, запиши результаты в report.md`.","es":"Un trabajo de 30 minutos: `/bg escribe los resultados en report.md cuando termines`."}},{"cmd":"/batch","args":"<instruction>","cat":"parallel","kind":"skill","pick":false,"aliases":[],"risk":["files"],"word":"batch","gloss":{"zh":"批量","ja":"一括処理","zh-hant":"批次","ko":"일괄 처리","ru":"пакетная обработка","es":"lote"},"desc":{"en":"Orchestrates large changes in parallel: decomposes the work into 5–30 independent units, and after approval runs one background subagent per unit in its own worktree. Requires a git repository or a WorktreeCreate hook.","ja":"大規模な変更を並列で行います。コードを調べて 5〜30 の独立した単位に分けて計画を示し、承認後は単位ごとにバックグラウンドのサブエージェントが独立した worktree で実装・テスト・反映します。Git リポジトリ（または対応する hook）が必要です。","zh":"大规模并行改代码：先研究代码库，把工作拆成 5～30 个独立单元并给出计划；你批准后，每个单元由一个后台子代理在独立 worktree 中实现、测试并提交。需要 Git 仓库（或相应 hook）。","zh-hant":"平行處理大規模修改：把工作拆成 5～30 個獨立單元，經你核准後，每個單元由一個背景子代理在自己的 worktree 中執行。需要 git 儲存庫或 WorktreeCreate hook。","ko":"큰 변경을 병렬로 진행합니다: 작업을 독립된 단위 5~30개로 나누고, 승인하면 단위마다 자체 worktree에서 백그라운드 서브에이전트를 하나씩 실행합니다. git 저장소 또는 WorktreeCreate 훅이 필요합니다.","ru":"Организует большие изменения параллельно: делит работу на 5–30 независимых частей и после вашего одобрения запускает по одному фоновому субагенту на каждую часть в отдельном worktree. Нужен git-репозиторий или хук WorktreeCreate.","es":"Coordina cambios grandes en paralelo: divide el trabajo en 5–30 unidades independientes y, tras tu aprobación, ejecuta un subagente en segundo plano por unidad, cada uno en su propio worktree. Requiere un repositorio git o un hook WorktreeCreate."},"use":{"en":"`/batch migrate src/ from JavaScript to TypeScript`.","ja":"`/batch src/ を JavaScript から TypeScript に移行`。","zh":"`/batch 把 src/ 从 JavaScript 迁移到 TypeScript`。","zh-hant":"`/batch 把 src/ 從 JavaScript 遷移到 TypeScript`。","ko":"`/batch src/를 JavaScript에서 TypeScript로 이전`.","ru":"`/batch перевести src/ с JavaScript на TypeScript`.","es":"`/batch migra src/ de JavaScript a TypeScript`."}},{"cmd":"/fork","args":"[prompt]","cat":"parallel","kind":"builtin","pick":false,"aliases":[],"word":"fork","gloss":{"zh":"分叉（复制一份）","ja":"フォーク（複製）","zh-hant":"分岔（複製一份）","ko":"포크 (복제)","ru":"форк (копия)","es":"bifurcar (copia)"},"desc":{"en":"Copies the conversation into a new background session while you keep working here. With a prompt, the copy starts immediately; it is normally told to create its own worktree first.","ja":"今の会話を新しいバックグラウンドセッションに複製し、こちらは作業を続けます。指示を付けると複製がすぐ作業開始。複製は通常、自分用の worktree を作ってから編集します。","zh":"把当前对话复制成一个新的后台会话，这边继续工作。带上指令则副本立即开始。副本一般会先创建自己的 worktree 再改代码。","zh-hant":"把對話複製成一個新的背景工作階段，你可以繼續在這裡工作。附上指示的話，副本會立刻開始；通常會先讓它建立自己的 worktree。","ko":"대화를 새 백그라운드 세션으로 복사하고, 나는 여기서 계속 작업합니다. 프롬프트를 주면 복사본이 바로 시작하며, 보통 먼저 자체 worktree를 만들도록 지시받습니다.","ru":"Копирует разговор в новую фоновую сессию, а вы продолжаете работать здесь. С запросом копия начинает сразу; обычно ей велят сначала создать свой worktree.","es":"Copia la conversación en una sesión nueva en segundo plano mientras tú sigues trabajando aquí. Con un prompt, la copia empieza de inmediato; normalmente se le indica que primero cree su propio worktree."},"use":{"en":"Working on feature A and want a side fix in parallel: `/fork fix the footer alignment`.","ja":"機能 A の作業中に小さな不具合も直したいとき：`/fork フッターのずれを直して`。","zh":"正在做功能 A，想同时修一个小问题：`/fork 修复页脚错位`。","zh-hant":"正在做功能 A，想同時修一個小問題：`/fork 修正頁尾對齊`。","ko":"기능 A를 작업하면서 작은 수정도 동시에 하고 싶을 때: `/fork 푸터 정렬 고쳐 줘`.","ru":"Работаете над функцией А и хотите параллельно сделать мелкое исправление: `/fork поправь выравнивание футера`.","es":"Trabajas en la función A y quieres una corrección aparte en paralelo: `/fork corrige la alineación del pie de página`."}},{"cmd":"/list-agents","args":"","cat":"parallel","kind":"builtin","pick":false,"aliases":["/peers"],"since":"2.1.224","word":"list agents","gloss":{"zh":"列出代理","ja":"エージェント一覧","zh-hant":"列出代理","ko":"에이전트 목록","ru":"список агентов","es":"lista de agentes"},"desc":{"en":"Lists subagents, teammates and other sessions Claude can message, with the name to use for each. Only where cross-session messaging is enabled.","ja":"Claude がメッセージを送れるサブエージェント・チームメイト・他のセッションと、その名前を一覧表示します。セッション間メッセージが有効な場合のみ。","zh":"列出 Claude 可以发消息的子代理、团队成员和其他会话，以及各自的名字。仅在启用跨会话消息时可用。","zh-hant":"列出 Claude 可以傳訊息的子代理、團隊成員和其他工作階段，以及各自要用的名稱。只在啟用跨工作階段訊息時可用。","ko":"Claude가 메시지를 보낼 수 있는 서브에이전트, 팀원, 다른 세션을 각각 부를 이름과 함께 나열합니다. 세션 간 메시지 기능이 켜진 곳에서만 쓸 수 있습니다.","ru":"Показывает субагентов, коллег по команде и другие сессии, которым Claude может писать, и имя, по которому к каждому обращаться. Только там, где включён обмен сообщениями между сессиями.","es":"Lista los subagentes, compañeros y otras sesiones a los que Claude puede enviar mensajes, con el nombre que debes usar para cada uno. Solo donde los mensajes entre sesiones están activados."},"use":{"en":"Coordinating several sessions: check what each is called.","ja":"複数のセッションで連携するとき、お互いの名前を確認。","zh":"多个会话协作时，确认彼此的名字。","zh-hant":"協調多個工作階段時：確認每個工作階段的名稱。","ko":"여러 세션을 함께 운영할 때 각각의 이름을 확인합니다.","ru":"Координируете несколько сессий: проверьте, как называется каждая.","es":"Si coordinas varias sesiones: comprueba cómo se llama cada una."}},{"cmd":"/stop","args":"","cat":"parallel","kind":"builtin","pick":false,"aliases":[],"word":"stop","gloss":{"zh":"停止","ja":"停止","zh-hant":"停止","ko":"정지","ru":"остановить","es":"detener"},"desc":{"en":"Stops the background session you're attached to; transcript and worktree are kept. To detach without stopping, use `/exit` or press `←`.","ja":"接続中のバックグラウンドセッションを停止します（記録と worktree は残ります）。止めずに離れたいだけなら `/exit` か `←`。","zh":"停止你当前连接的后台会话，记录和 worktree 保留。只想断开不停止，用 `/exit` 或按 `←`。","zh-hant":"停止你目前連接的背景工作階段；紀錄和 worktree 會保留。只想中斷連接而不停止，請用 `/exit` 或按 `←`。","ko":"연결된 백그라운드 세션을 정지합니다. 대화 기록과 worktree는 남습니다. 정지하지 않고 분리만 하려면 `/exit`를 쓰거나 `←`를 누르세요.","ru":"Останавливает фоновую сессию, к которой вы подключены; запись разговора и worktree сохраняются. Чтобы отключиться без остановки, используйте `/exit` или нажмите `←`.","es":"Detiene la sesión en segundo plano a la que estás conectado; la transcripción y el worktree se conservan. Para desconectarte sin detenerla, usa `/exit` o pulsa `←`."},"use":{"en":"A background job went off course: `/stop`.","ja":"バックグラウンドの作業が方向違いになったら：`/stop`。","zh":"后台任务方向跑偏：`/stop`。","zh-hant":"背景工作偏離方向：`/stop`。","ko":"백그라운드 작업이 엉뚱한 방향으로 갈 때: `/stop`.","ru":"Фоновая задача пошла не туда: `/stop`.","es":"Un trabajo en segundo plano se desvió: `/stop`."}},{"cmd":"/subtask","args":"<task>","cat":"parallel","kind":"builtin","pick":false,"aliases":[],"word":"subtask","gloss":{"zh":"子任务","ja":"サブタスク","zh-hant":"子任務","ko":"하위 작업","ru":"подзадача","es":"subtarea"},"desc":{"en":"Spawns a forked subagent that inherits the conversation and reports its result back here. The difference from `/fork`: `/subtask` reports back here, while `/fork` starts a separate session.","ja":"会話全体を引き継いだバックグラウンドのサブエージェントに作業を任せ、終わると結果がこの会話に戻ります。`/fork` との違い：`/subtask` は結果が戻り、`/fork` は独立したセッションです。","zh":"派出一个继承完整对话的后台子代理去做任务，完成后结果回到当前对话。与 `/fork` 的区别：`/subtask` 的结果会汇报回来，`/fork` 是独立的会话。","zh-hant":"派出一個分岔的子代理，它會繼承對話內容，並把結果回報到這裡。與 `/fork` 的差別：`/subtask` 會把結果回報到這裡，`/fork` 則是另一個獨立的工作階段。","ko":"대화를 물려받는 포크된 서브에이전트를 만들고, 결과를 이곳에 보고하게 합니다. `/fork`와의 차이: `/subtask`는 결과를 이곳에 보고하고, `/fork`는 별도의 세션을 만듭니다.","ru":"Запускает ответвлённого субагента, который наследует разговор и сообщает результат сюда. Отличие от `/fork`: `/subtask` возвращает результат сюда, а `/fork` создаёт отдельную сессию.","es":"Lanza un subagente bifurcado que hereda la conversación y devuelve su resultado aquí. La diferencia con `/fork`: `/subtask` devuelve el resultado aquí, mientras que `/fork` crea una sesión aparte."},"use":{"en":"`/subtask document these API endpoints` while you keep coding.","ja":"`/subtask これらの API のドキュメントを書いて`、自分はコードを書き続けます。","zh":"`/subtask 为这些接口写 API 文档`，你这边继续写代码。","zh-hant":"`/subtask 替這些 API 端點寫文件`，你這邊繼續寫程式。","ko":"코딩을 계속하면서: `/subtask 이 API 엔드포인트들 문서화해 줘`.","ru":"`/subtask задокументируй эти эндпоинты API`, пока вы продолжаете писать код.","es":"`/subtask documenta estos endpoints de la API` mientras sigues programando."}},{"cmd":"/tasks","args":"","cat":"parallel","kind":"builtin","pick":false,"aliases":["/bashes"],"word":"tasks","gloss":{"zh":"任务","ja":"タスク","zh-hant":"工作、任務","ko":"작업 목록","ru":"задачи","es":"tareas"},"desc":{"en":"Views and manages background work in this session, including finished subagents.","ja":"このセッションのバックグラウンド作業（完了したサブエージェントを含む）を確認・管理します。","zh":"查看和管理当前会话的后台工作，包括已完成的子代理。","zh-hant":"檢視並管理這次工作階段中的背景工作，包括已完成的子代理。","ko":"이 세션의 백그라운드 작업을 보고 관리합니다. 끝난 서브에이전트도 포함됩니다.","ru":"Показывает фоновую работу в этой сессии и позволяет управлять ею, включая завершённых субагентов.","es":"Muestra y gestiona el trabajo en segundo plano de esta sesión, incluidos los subagentes que ya terminaron."},"use":{"en":"Check progress on background tests or subagents with `/tasks`.","ja":"テストやサブエージェントを裏で動かしている間に `/tasks` で進み具合を確認。","zh":"后台跑着测试或子代理时，用 `/tasks` 看进度。","zh-hant":"用 `/tasks` 查看背景測試或子代理的進度。","ko":"백그라운드에서 돌리는 테스트나 서브에이전트의 진행 상황을 `/tasks`로 확인합니다.","ru":"Проверить ход фоновых тестов или субагентов: `/tasks`.","es":"Mira el avance de pruebas o subagentes en segundo plano con `/tasks`."}},{"cmd":"/workflow-authoring","args":"","cat":"parallel","kind":"skill","pick":false,"aliases":[],"word":"workflow authoring","gloss":{"zh":"编写工作流","ja":"ワークフローの作成","zh-hant":"撰寫工作流程","ko":"워크플로 작성","ru":"написание рабочих процессов","es":"creación de flujos de trabajo"},"desc":{"en":"Loads the reference for writing dynamic workflow scripts. Claude normally loads it itself; run it before hand-editing a saved script. Only where dynamic workflows are enabled.","ja":"動的ワークフローのスクリプトを書くための資料を読み込みます。通常は Claude が自動で読み込みます。保存済みスクリプトを手で直す前に実行するとよいでしょう。動的ワークフローが有効な場合のみ。","zh":"加载编写动态工作流脚本的参考资料。Claude 一般会自动加载；手动修改已保存脚本前可以自己运行。仅在启用动态工作流时可用。","zh-hant":"載入撰寫動態工作流程腳本的參考資料。Claude 通常會自己載入；手動編輯已儲存的腳本前可以先執行。只在啟用動態工作流程時可用。","ko":"동적 워크플로 스크립트를 작성하기 위한 참고 자료를 불러옵니다. 보통은 Claude가 알아서 불러오며, 저장된 스크립트를 직접 고치기 전에 실행하세요. 동적 워크플로가 켜진 곳에서만 쓸 수 있습니다.","ru":"Загружает справку по написанию скриптов динамических рабочих процессов. Обычно Claude загружает её сам; запустите вручную перед правкой сохранённого скрипта. Только там, где включены динамические рабочие процессы.","es":"Carga la referencia para escribir scripts de flujos de trabajo dinámicos. Claude normalmente la carga solo; ejecútalo antes de editar a mano un script guardado. Solo donde los flujos de trabajo dinámicos están activados."},"use":{"en":"Before hand-editing a saved workflow script.","ja":"保存したワークフローを手で調整する前に。","zh":"想手动调整一个保存的工作流脚本前。","zh-hant":"手動編輯已儲存的工作流程腳本之前。","ko":"저장된 워크플로 스크립트를 직접 고치기 전에.","ru":"Перед ручной правкой сохранённого скрипта рабочего процесса.","es":"Antes de editar a mano un script de flujo de trabajo guardado."}},{"cmd":"/workflows","args":"","cat":"parallel","kind":"builtin","pick":false,"aliases":[],"word":"workflows","gloss":{"zh":"工作流","ja":"ワークフロー","zh-hant":"工作流程","ko":"워크플로","ru":"рабочие процессы","es":"flujos de trabajo"},"desc":{"en":"Opens the workflow progress view to watch, pause, resume or save running and completed workflows.","ja":"ワークフローの進行画面を開き、実行中・完了済みのワークフローの確認・一時停止・再開・保存ができます。","zh":"打开工作流进度视图，查看、暂停、继续、保存正在运行或已完成的多代理工作流。","zh-hant":"開啟工作流程進度畫面，可以查看、暫停、繼續或儲存正在執行和已完成的工作流程。","ko":"워크플로 진행 화면을 열어, 실행 중이거나 완료된 워크플로를 지켜보고, 일시 정지, 재개, 저장할 수 있습니다.","ru":"Открывает экран хода рабочих процессов, где можно следить за запущенными и завершёнными процессами, ставить их на паузу, продолжать или сохранять.","es":"Abre la vista de progreso de flujos de trabajo para ver, pausar, reanudar o guardar flujos en curso y terminados."},"use":{"en":"Keep an eye on a long-running workflow.","ja":"大きな調査や改修のワークフローを動かしているとき、進み具合を見るのに使います。","zh":"跑大型研究或改造工作流时，用它盯进度。","zh-hant":"隨時留意一個執行很久的工作流程。","ko":"오래 걸리는 워크플로를 지켜볼 때 사용합니다.","ru":"Следить за долгим рабочим процессом.","es":"Vigilar un flujo de trabajo que tarda mucho."}},{"cmd":"/loop","args":"[interval] [prompt]","cat":"automation","kind":"skill","pick":true,"aliases":["/proactive"],"short":{"en":"Repeat a prompt on an interval","ja":"一定間隔で指示を繰り返す","zh":"按间隔重复执行一条指令","zh-hant":"依固定間隔重複執行提示","ko":"일정 간격으로 프롬프트 반복","ru":"Повторять запрос через интервал","es":"Repetir un prompt cada cierto tiempo"},"word":"loop","gloss":{"zh":"循环","ja":"ループ・繰り返し","zh-hant":"迴圈","ko":"반복","ru":"цикл, повтор","es":"bucle, repetir"},"desc":{"en":"Runs a prompt repeatedly while the session stays open. Omit the interval and Claude self-paces; omit the prompt and it runs the built-in maintenance prompt or your `loop.md`.","ja":"セッションが開いている間、指示を繰り返し実行します。間隔を省略すると Claude がペースを決め、指示を省略すると組み込みの保守用プロンプトか `loop.md` を実行します。セッションを閉じると止まります。","zh":"在会话开着时反复执行一条指令。不写间隔则由 Claude 自己掌握节奏；不写指令则运行内置维护提示或你的 `loop.md`。关闭会话就停止。","zh-hant":"在工作階段開著的期間反覆執行一個提示。不寫間隔則由 Claude 自己決定節奏；不寫提示則執行內建的維護提示或你的 `loop.md`。","ko":"세션이 열려 있는 동안 프롬프트를 반복해서 실행합니다. 간격을 생략하면 Claude가 스스로 속도를 정하고, 프롬프트를 생략하면 기본 제공 유지 관리 프롬프트나 `loop.md`를 실행합니다.","ru":"Повторяет запрос, пока сессия открыта. Без интервала Claude сам выбирает темп; без запроса выполняется встроенный запрос обслуживания или ваш `loop.md`.","es":"Ejecuta un prompt una y otra vez mientras la sesión sigue abierta. Si omites el intervalo, Claude marca su propio ritmo; si omites el prompt, ejecuta el prompt de mantenimiento integrado o tu `loop.md`."},"use":{"en":"`/loop 5m check if the deploy finished`. For runs that continue when your computer is off, use `/schedule`.","ja":"`/loop 5m デプロイが終わったか確認`。パソコンを閉じても動かしたいなら `/schedule`。","zh":"`/loop 5m 检查部署是否完成`。需要电脑关机也执行的话用 `/schedule`。","zh-hant":"`/loop 5m 檢查部署是否完成`。如果要在電腦關機時也繼續執行，請用 `/schedule`。","ko":"`/loop 5m 배포가 끝났는지 확인해 줘`. 컴퓨터가 꺼져 있어도 계속 실행하려면 `/schedule`을 사용하세요.","ru":"`/loop 5m проверь, закончился ли деплой`. Если запуски должны продолжаться при выключенном компьютере, используйте `/schedule`.","es":"`/loop 5m comprueba si terminó el despliegue`. Para ejecuciones que sigan con el equipo apagado, usa `/schedule`."}},{"cmd":"/autofix-pr","args":"[prompt]","cat":"automation","kind":"builtin","pick":false,"aliases":[],"risk":["external"],"word":"auto-fix PR","gloss":{"zh":"自动修复 PR","ja":"PR の自動修正","zh-hant":"自動修正 PR","ko":"PR 자동 수정","ru":"автоисправление PR","es":"corrección automática de PR"},"desc":{"en":"Spawns a cloud session that watches the current branch's PR and pushes fixes on CI failures or review comments. Requires the `gh` CLI and cloud sessions.","ja":"現在のブランチの PR をクラウドセッションが見張り、CI の失敗やレビューコメントがあれば修正を push します。`gh` CLI とクラウドセッションの利用権が必要です。","zh":"开一个云端会话盯住当前分支的 PR，CI 失败或有人留评审意见时自动推送修复。需要 `gh` 命令行工具和云端会话权限。","zh-hant":"開啟一個雲端工作階段，盯著目前分支的 PR，在 CI 失敗或有審查意見時推送修正。需要 `gh` CLI 和雲端工作階段。","ko":"현재 브랜치의 PR을 지켜보다가 CI 실패나 리뷰 댓글이 생기면 수정을 푸시하는 클라우드 세션을 시작합니다. `gh` CLI와 클라우드 세션이 필요합니다.","ru":"Запускает облачную сессию, которая следит за PR текущей ветки и отправляет исправления при сбоях CI или замечаниях ревьюеров. Нужны CLI `gh` и облачные сессии.","es":"Lanza una sesión en la nube que vigila el PR de la rama actual y sube correcciones cuando falla la CI o hay comentarios de revisión. Requiere la CLI `gh` y sesiones en la nube."},"use":{"en":"`/autofix-pr only fix lint and type errors`.","ja":"lint だけ任せたいなら：`/autofix-pr lint と型エラーだけ直して`。","zh":"只想让它修格式问题：`/autofix-pr 只修 lint 和类型错误`。","zh-hant":"`/autofix-pr 只修 lint 和型別錯誤`。","ko":"`/autofix-pr lint와 타입 오류만 고쳐 줘`.","ru":"`/autofix-pr исправляй только ошибки линтера и типов`.","es":"`/autofix-pr corrige solo errores de lint y de tipos`."}},{"cmd":"/deep-research","args":"
