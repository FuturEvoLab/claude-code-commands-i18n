<question>","cat":"automation","kind":"workflow","pick":false,"aliases":[],"word":"deep research","gloss":{"zh":"深度研究","ja":"詳細リサーチ","zh-hant":"深度研究","ko":"심층 리서치","ru":"глубокое исследование","es":"investigación a fondo"},"desc":{"en":"A bundled workflow that fans out web searches, fetches and cross-checks sources, and writes a cited report. Runs in the background.","ja":"マルチエージェントのワークフローです。Web を広く検索し、情報源を取得・照合して、出典付きのレポートにまとめます。バックグラウンドで動きます。","zh":"多代理工作流：大量搜索网页、抓取并交叉核对来源，写成带引用的报告。在后台运行。","zh-hant":"內建的工作流程：大量搜尋網路、抓取並交叉比對來源，然後寫出附有引用的報告。在背景執行。","ko":"웹 검색을 여러 갈래로 수행하고, 출처를 가져와 교차 확인한 뒤, 출처가 달린 보고서를 쓰는 기본 제공 워크플로입니다. 백그라운드에서 실행됩니다.","ru":"Встроенный рабочий процесс: параллельно ищет в интернете, загружает и сверяет источники и пишет отчёт со ссылками на них. Работает в фоне.","es":"Un flujo de trabajo incluido que lanza muchas búsquedas web, obtiene y contrasta fuentes y escribe un informe con citas. Se ejecuta en segundo plano."},"use":{"en":"`/deep-research compare pricing and quality of leading AI video tools`.","ja":"`/deep-research 主要な AI 動画生成ツールの料金と画質の比較`。","zh":"`/deep-research 主流 AI 视频生成工具的价格与画质对比`。","zh-hant":"`/deep-research 比較主流 AI 影片工具的價格和品質`。","ko":"`/deep-research 주요 AI 영상 도구의 가격과 품질 비교`.","ru":"`/deep-research сравни цены и качество ведущих ИИ-сервисов для видео`.","es":"`/deep-research compara precios y calidad de las principales herramientas de video con IA`."}},{"cmd":"/schedule","args":"[description]","cat":"automation","kind":"builtin","pick":false,"aliases":["/routines"],"word":"schedule","gloss":{"zh":"日程、定时","ja":"スケジュール","zh-hant":"排程","ko":"예약·일정","ru":"расписание","es":"programar"},"desc":{"en":"Creates, updates, lists or runs cloud scheduled tasks (formerly routines) through a guided conversation. Not available with a Console API key.","ja":"クラウドの定期実行タスク（旧 routines）を作成・変更・一覧・実行します。会話形式で設定でき、最近の実行結果も聞けます。Console の API キーでは使えません。","zh":"创建、修改、列出或运行云端定时任务（以前叫 routines），通过对话引导设置，也可以问最近的运行记录。使用 Console API 密钥时不可用。","zh-hant":"透過引導式對話，建立、更新、列出或執行雲端排程工作（以前叫 routines）。使用 Console API 金鑰時無法使用。","ko":"안내형 대화를 통해 클라우드 예약 작업(이전 이름: routines)을 만들고, 수정하고, 나열하고, 실행합니다. Console API 키로는 사용할 수 없습니다.","ru":"Создаёт, изменяет, показывает или запускает облачные задачи по расписанию (раньше назывались routines) в форме пошагового диалога. Недоступно с API-ключом Console.","es":"Crea, actualiza, lista o ejecuta tareas programadas en la nube (antes llamadas rutinas) mediante una conversación guiada. No está disponible con una clave de API de Console."},"use":{"en":"`/schedule every weekday at 9am, summarize new issues in the repo`.","ja":"`/schedule 平日の毎朝 9 時に新しい issue をまとめて`。","zh":"`/schedule 每个工作日早上 9 点检查仓库新 issue 并总结`。","zh-hant":"`/schedule 每個工作日早上 9 點，整理儲存庫中新的 issue`。","ko":"`/schedule 평일 매일 오전 9시에 저장소의 새 이슈를 요약해 줘`.","ru":"`/schedule каждый будний день в 9 утра кратко описывай новые issues в репозитории`.","es":"`/schedule cada día laborable a las 9, resume los issues nuevos del repositorio`."}},{"cmd":"/artifact-capabilities","args":"","cat":"create","kind":"skill","pick":false,"aliases":[],"word":"artifact capabilities","gloss":{"zh":"成品页面的高级能力","ja":"アーティファクトの機能","zh-hant":"成品頁面的進階功能","ko":"아티팩트 기능","ru":"возможности артефактов","es":"capacidades de artefactos"},"desc":{"en":"Loads the reference for artifact runtime capabilities, such as calling connectors or offering downloads, and which your account has. Claude usually loads it itself.","ja":"アーティファクトで使える実行時機能（コネクターの呼び出し、ファイルのダウンロード提供など）と、自分のアカウントで使えるものの資料を読み込みます。通常は Claude が自動で読み込みます。","zh":"加载 artifact 运行时可用能力的参考，例如调用你的连接器、给访客提供文件下载，以及你的账号有哪些。Claude 一般会自动加载。","zh-hant":"載入 artifact 執行時功能的參考資料，例如呼叫連接器或提供下載，以及你的帳號有哪些功能。Claude 通常會自己載入。","ko":"커넥터 호출이나 다운로드 제공 같은 아티팩트 실행 기능에 대한 참고 자료와, 내 계정에서 쓸 수 있는 기능을 불러옵니다. 보통은 Claude가 알아서 불러옵니다.","ru":"Загружает справку о возможностях артефактов во время работы, например вызов коннекторов или предложение скачать файл, и о том, какие из них есть в вашем аккаунте. Обычно Claude загружает её сам.","es":"Carga la referencia de las capacidades de ejecución de los artefactos, como llamar a conectores u ofrecer descargas, y cuáles tiene tu cuenta. Claude normalmente la carga solo."},"use":{"en":"Before building a page that many people fill in.","ja":"複数人が入力できる申込ページを作る前に。","zh":"打算做一个多人填写的报名表页面之前。","zh-hant":"要做一個很多人填寫的頁面之前。","ko":"여러 사람이 입력하는 페이지를 만들기 전에.","ru":"Перед созданием страницы, которую будут заполнять многие люди.","es":"Antes de crear una página que mucha gente va a rellenar."}},{"cmd":"/artifact-diagramming","args":"","cat":"create","kind":"skill","pick":false,"aliases":[],"since":"2.1.221","word":"artifact diagramming","gloss":{"zh":"成品页面中的绘图","ja":"アーティファクトの図解","zh-hant":"成品頁面中的繪圖","ko":"아티팩트 다이어그램","ru":"схемы для артефактов","es":"diagramas para artefactos"},"desc":{"en":"Loads diagramming guidance for artifacts: when a diagram helps, what to draw, and SVG that stays legible in light and dark themes.","ja":"アーティファクトで図を描くためのガイドを読み込みます。図が必要な場面、何を描くか、明暗どちらのテーマでも見やすい SVG の書き方。","zh":"加载在 artifact 中画示意图的规范：何时需要图、画什么、如何写出在浅色和深色主题下都清楚的 SVG。","zh-hant":"載入在 artifact 中繪製圖表的指引：什麼時候圖有幫助、要畫什麼，以及如何寫出在淺色和深色主題下都清楚的 SVG。","ko":"아티팩트용 다이어그램 안내를 불러옵니다: 다이어그램이 도움이 되는 경우, 무엇을 그릴지, 밝은 테마와 어두운 테마 모두에서 잘 보이는 SVG.","ru":"Загружает советы по схемам для артефактов: когда схема полезна, что рисовать и как сделать SVG, который хорошо читается в светлой и тёмной темах.","es":"Carga una guía de diagramas para artefactos: cuándo ayuda un diagrama, qué dibujar y SVG que se lee bien en temas claros y oscuros."},"use":{"en":"When you need a clear architecture diagram.","ja":"わかりやすいシステム構成図がほしいとき。","zh":"需要一张清楚的系统流程图时。","zh-hant":"需要一張清楚的架構圖時。","ko":"알아보기 쉬운 아키텍처 다이어그램이 필요할 때.","ru":"Когда нужна понятная схема архитектуры.","es":"Cuando necesitas un diagrama de arquitectura claro."}},{"cmd":"/artifacts","args":"","cat":"create","kind":"builtin","pick":false,"aliases":[],"word":"artifacts","gloss":{"zh":"成品（发布的网页）","ja":"アーティファクト（公開ページ）","zh-hant":"成品（發布的網頁）","ko":"아티팩트 (공개 페이지)","ru":"артефакты (опубликованные страницы)","es":"artefactos (páginas publicadas)"},"desc":{"en":"Lists artifacts you own or that are shared with you, then attaches one, opens it, or copies its link. Where artifacts are available.","ja":"自分が持っている、または共有されたアーティファクト（公開ページ）を一覧表示し、セッションへの追加・ブラウザーで開く・リンクのコピーができます。対応環境のみ。","zh":"列出你拥有或别人分享给你的 artifact（网页成品），可以接入当前会话、在浏览器打开或复制链接。仅在支持 artifact 的环境可用。","zh-hant":"列出你擁有或別人分享給你的 artifact，然後可以接入其中一個、開啟它，或複製連結。只在支援 artifact 的環境中可用。","ko":"내가 소유하거나 공유받은 아티팩트를 나열하고, 하나를 연결하거나, 열거나, 링크를 복사합니다. 아티팩트를 쓸 수 있는 곳에서만 동작합니다.","ru":"Показывает артефакты, которые принадлежат вам или которыми с вами поделились, и позволяет подключить один из них, открыть или скопировать ссылку. Там, где доступны артефакты.","es":"Lista los artefactos que te pertenecen o que otros comparten contigo, y luego conecta uno, lo abre o copia su enlace. Donde los artefactos están disponibles."},"use":{"en":"Find last week's dashboard and keep editing it.","ja":"先週作ったダッシュボードを探して続きを編集。","zh":"找回上周做的那个仪表盘页面，接着修改。","zh-hant":"找到上週做的儀表板，繼續編輯。","ko":"지난주에 만든 대시보드를 찾아 이어서 편집합니다.","ru":"Найти дашборд с прошлой недели и продолжить его редактировать.","es":"Encuentra el panel de la semana pasada y sigue editándolo."}},{"cmd":"/dataviz","args":"[request]","cat":"create","kind":"skill","pick":false,"aliases":[],"word":"data visualization","gloss":{"zh":"数据可视化","ja":"データ可視化","zh-hant":"資料視覺化","ko":"데이터 시각화","ru":"визуализация данных","es":"visualización de datos"},"desc":{"en":"Chart design guidance: picks the chart form, assigns color by role, and validates the palette for colorblind safety and contrast with a bundled script.","ja":"グラフ作成のガイドです。データに合う形を選び、役割ごとに色を割り当て、付属スクリプトで色覚多様性への配慮とコントラストを確認します。","zh":"图表设计指南：为数据选择合适的图表形式、按用途配色，用自带脚本检查色盲友好和对比度。","zh-hant":"圖表設計指引：選擇圖表形式、依角色分配顏色，並用內建的腳本檢查配色是否色盲友善、對比是否足夠。","ko":"차트 디자인 안내: 차트 형태를 고르고, 역할에 따라 색을 지정하며, 함께 제공되는 스크립트로 색맹 안전성과 대비를 기준으로 팔레트를 검증합니다.","ru":"Советы по оформлению графиков: выбирает вид графика, назначает цвета по ролям и встроенным скриптом проверяет палитру на контраст и различимость при дальтонизме.","es":"Guía para diseñar gráficos: elige el tipo de gráfico, asigna los colores según su función y valida la paleta (seguridad para daltonismo y contraste) con un script incluido."},"use":{"en":"`/dataviz turn this monthly sales table into a trend chart`.","ja":"`/dataviz この月次売上表を推移グラフにして`。","zh":"`/dataviz 把这份月度销售表做成趋势图`。","zh-hant":"`/dataviz 把這份每月銷售表做成趨勢圖`。","ko":"`/dataviz 이 월별 매출 표를 추이 차트로 만들어 줘`.","ru":"`/dataviz сделай из этой таблицы продаж по месяцам график тренда`.","es":"`/dataviz convierte esta tabla de ventas mensuales en un gráfico de tendencia`."}},{"cmd":"/design","args":"[brief]","cat":"create","kind":"skill","pick":false,"aliases":[],"since":"2.1.265","word":"design","gloss":{"zh":"设计","ja":"デザイン","zh-hant":"設計","ko":"디자인","ru":"дизайн","es":"diseño"},"desc":{"en":"Drafts UI mockups, flows, landing pages or posters as artboards on one canvas (a Claude Design artifact); edit in a desktop browser and export PNG or PDF. Unavailable on Bedrock, Vertex and other third-party platforms.","ja":"UI のラフ、画面遷移、LP、ポスターを 1 枚のキャンバスに描きます（Claude Design のアーティファクト）。デスクトップのブラウザーで編集し、PNG・PDF で書き出せます。Bedrock や Vertex などでは使えません。","zh":"在一张画布上绘制界面草图、页面流程、落地页或海报（Claude Design artifact），可在桌面浏览器编辑并导出 PNG 或 PDF。Bedrock、Vertex 等第三方平台不可用。","zh-hant":"在同一張畫布上以多個畫板草擬 UI 模型、操作流程、到達頁或海報（Claude Design artifact）；可在桌面瀏覽器中編輯，並匯出 PNG 或 PDF。Bedrock、Vertex 及其他第三方平台無法使用。","ko":"UI 목업, 화면 흐름, 랜딩 페이지, 포스터를 하나의 캔버스 위 아트보드로 초안 작성합니다(Claude Design 아티팩트). 데스크톱 브라우저에서 편집하고 PNG나 PDF로 내보냅니다. Bedrock, Vertex 등 서드파티 플랫폼에서는 사용할 수 없습니다.","ru":"Набрасывает макеты интерфейса, сценарии, лендинги или постеры в виде артбордов на одном холсте (артефакт Claude Design); редактировать можно в браузере на компьютере, экспорт в PNG или PDF. Недоступно в Bedrock, Vertex и на других сторонних платформах.","es":"Crea bocetos de interfaz, flujos, páginas de aterrizaje o pósteres como mesas de trabajo en un solo lienzo (un artefacto de Claude Design); edítalos en un navegador de escritorio y expórtalos en PNG o PDF. No está disponible en Bedrock, Vertex ni otras plataformas de terceros."},"use":{"en":"`/design a settings screen for a mobile banking app`.","ja":"`/design 家計簿アプリの設定画面`。","zh":"`/design 手机记账 App 的设置页`。","zh-hant":"`/design 行動網銀 App 的設定畫面`。","ko":"`/design 모바일 뱅킹 앱의 설정 화면`.","ru":"`/design экран настроек для мобильного банковского приложения`.","es":"`/design una pantalla de configuración para una app de banca móvil`."}},{"cmd":"/design consent","args":"","cat":"create","kind":"builtin","pick":false,"aliases":["/design revoke"],"word":"consent / revoke","gloss":{"zh":"同意授权 / 撤销","ja":"同意 / 取り消し","zh-hant":"同意 / 撤銷","ko":"동의 / 철회","ru":"согласие / отзыв","es":"consentimiento / revocar"},"desc":{"en":"Grants or withdraws Claude's access to Claude Design. When Claude asks you to run `/design consent`, type it yourself.","ja":"Claude Design へのアクセスを許可・取り消します。Claude の返答で `/design consent` を求められたら、自分で入力してください。","zh":"授予或撤销 Claude 对 Claude Design 的访问权限。当 Claude 的回复要求你运行 `/design consent` 时，需要你自己在输入框中输入。","zh-hant":"授予或撤回 Claude 對 Claude Design 的存取權。當 Claude 要求你執行 `/design consent` 時，請自己輸入。","ko":"Claude의 Claude Design 접근을 허용하거나 철회합니다. Claude가 `/design consent`를 실행하라고 하면 직접 입력하세요.","ru":"Даёт или отзывает доступ Claude к Claude Design. Когда Claude просит выполнить `/design consent`, введите её сами.","es":"Concede o retira el acceso de Claude a Claude Design. Cuando Claude te pida ejecutar `/design consent`, escríbelo tú mismo."},"use":{"en":"When prompted, type `/design consent` yourself.","ja":"許可を求められたら自分で `/design consent` と入力。","zh":"Claude 提示需要授权时，手动输入 `/design consent`。","zh-hant":"出現提示時，自己輸入 `/design consent`。","ko":"요청을 받으면 `/design consent`를 직접 입력합니다.","ru":"Когда появится запрос, сами введите `/design consent`.","es":"Cuando se te pida, escribe tú mismo `/design consent`."}},{"cmd":"/design-login","args":"","cat":"create","kind":"builtin","pick":false,"aliases":[],"word":"design login","gloss":{"zh":"设计登录","ja":"デザインのログイン","zh-hant":"設計登入","ko":"디자인 로그인","ru":"вход для дизайна","es":"inicio de sesión de diseño"},"desc":{"en":"Authorizes design-system access for `/design-sync` with your claude.ai account, when `/design-sync` or `/design consent` asks you to.","ja":"`/design-sync` 用に claude.ai アカウントで認可します。`/design-sync` や `/design consent` に求められたときに使います。","zh":"为 `/design-sync` 用 claude.ai 账号授权。当 `/design-sync` 或 `/design consent` 提示时使用。","zh-hant":"當 `/design-sync` 或 `/design consent` 要求時，用你的 claude.ai 帳號為 `/design-sync` 授權設計系統存取。","ko":"`/design-sync`나 `/design consent`가 요청할 때, claude.ai 계정으로 `/design-sync`의 디자인 시스템 접근을 승인합니다.","ru":"Разрешает доступ к дизайн-системе для `/design-sync` через ваш аккаунт claude.ai, когда этого просит `/design-sync` или `/design consent`.","es":"Autoriza el acceso al sistema de diseño para `/design-sync` con tu cuenta de claude.ai, cuando `/design-sync` o `/design consent` te lo pidan."},"use":{"en":"Run it when `/design-sync` asks you to sign in.","ja":"`/design-sync` にログインを求められたら実行。","zh":"`/design-sync` 提示需要登录时运行。","zh-hant":"`/design-sync` 要求你登入時執行。","ko":"`/design-sync`가 로그인을 요청할 때 실행합니다.","ru":"Запустите, когда `/design-sync` просит войти.","es":"Ejecútalo cuando `/design-sync` te pida iniciar sesión."}},{"cmd":"/design-sync","args":"[hint]","cat":"create","kind":"skill","pick":false,"aliases":[],"risk":["external"],"word":"design sync","gloss":{"zh":"设计同步","ja":"デザインの同期","zh-hant":"設計同步","ko":"디자인 동기화","ru":"синхронизация дизайна","es":"sincronización de diseño"},"desc":{"en":"Converts and uploads your repo's React design system to Claude Design so designs use your real components. First sync can take hours on large repos. It targets the standalone claude.ai/design site, which closes by December 14, 2026.","ja":"リポジトリの React デザインシステムを変換して Claude Design にアップロードし、実際のコンポーネントでデザインできるようにします。初回は全コンポーネントを検証するため、大きなリポジトリでは数時間かかることも。アップロード先の claude.ai/design は 2026 年 12 月 14 日までに終了予定です。","zh":"把仓库中的 React 设计系统转换并上传到 Claude Design，让生成的设计使用你真实的组件。首次同步会逐个验证组件，大仓库可能要几个小时。上传目标是独立的 claude.ai/design 网站，该网站将于 2026 年 12 月 14 日前关闭。","zh-hant":"把你儲存庫中的 React 設計系統轉換並上傳到 Claude Design，讓設計使用你真正的元件。大型儲存庫第一次同步可能要好幾個小時。上傳目標是獨立的 claude.ai/design 網站，該網站將在 2026 年 12 月 14 日前關閉。","ko":"저장소의 React 디자인 시스템을 변환해 Claude Design에 업로드하여, 디자인에 실제 컴포넌트가 쓰이게 합니다. 큰 저장소에서는 첫 동기화에 몇 시간이 걸릴 수 있습니다. 대상은 독립된 claude.ai/design 사이트이며, 이 사이트는 2026년 12월 14일까지 종료됩니다.","ru":"Преобразует и загружает React-дизайн-систему вашего репозитория в Claude Design, чтобы в макетах использовались ваши настоящие компоненты. Первая синхронизация в больших репозиториях может занять несколько часов. Работает с отдельным сайтом claude.ai/design, который закроется не позднее 14 декабря 2026 года.","es":"Convierte y sube el sistema de diseño React de tu repositorio a Claude Design para que los diseños usen tus componentes reales. La primera sincronización puede tardar horas en repositorios grandes. Usa el sitio independiente claude.ai/design, que cierra a más tardar el 14 de diciembre de 2026."},"use":{"en":"`/design-sync Acme DS` (mind the closing date above).","ja":"自社のコンポーネント集があるなら：`/design-sync Acme DS`。上記の終了日に注意。","zh":"公司有自己的组件库：`/design-sync Acme DS`。注意上述关闭日期。","zh-hant":"`/design-sync Acme DS`（請注意上面提到的關閉日期）。","ko":"`/design-sync Acme DS` (위의 종료 날짜에 주의하세요).","ru":"`/design-sync Acme DS` (учтите дату закрытия, указанную выше).","es":"`/design-sync Acme DS` (ten en cuenta la fecha de cierre indicada arriba)."}},{"cmd":"/slides","args":"[brief]","cat":"create","kind":"skill","pick":false,"aliases":[],"since":"2.1.265","word":"slides","gloss":{"zh":"幻灯片","ja":"スライド","zh-hant":"投影片","ko":"슬라이드","ru":"слайды","es":"diapositivas"},"desc":{"en":"Makes a Claude Slides artifact from your brief. Requires a session with artifacts and an account where the Slides template is available.","ja":"説明をもとに Claude Slides のプレゼン（アーティファクト）を作ります。アーティファクト対応のセッションと Slides テンプレートが必要です。","zh":"根据你的描述生成一套 Claude Slides 演示文稿（artifact）。需要支持 artifact 的会话和可用的 Slides 模板。","zh-hant":"根據你的說明製作一份 Claude Slides artifact。需要支援 artifact 的工作階段，以及可以使用 Slides 範本的帳號。","ko":"요청 내용을 바탕으로 Claude Slides 아티팩트를 만듭니다. 아티팩트를 쓸 수 있는 세션과 Slides 템플릿을 쓸 수 있는 계정이 필요합니다.","ru":"Делает артефакт Claude Slides по вашему описанию. Нужна сессия с артефактами и аккаунт, где доступен шаблон Slides.","es":"Crea un artefacto de Claude Slides a partir de tus indicaciones. Requiere una sesión con artefactos y una cuenta donde esté disponible la plantilla de Slides."},"use":{"en":"`/slides a quarterly review for leadership, 8 slides`.","ja":"`/slides 四半期の業績レビュー、8 枚、経営層向け`。","zh":"`/slides 季度业绩回顾，8 页，面向管理层`。","zh-hant":"`/slides 給主管看的季度回顧，8 張投影片`。","ko":"`/slides 경영진용 분기 리뷰, 8장`.","ru":"`/slides квартальный отчёт для руководства, 8 слайдов`.","es":"`/slides una revisión trimestral para la dirección, 8 diapositivas`."}},{"cmd":"/mcp","args":"[reconnect (<server>|all)|enable|disable [<server>|all]]","cat":"extend","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Manage external tool connections","ja":"外部ツールとの接続を管理する","zh":"管理外部工具连接","zh-hant":"管理外部工具的連線","ko":"외부 도구 연결 관리","ru":"Управлять подключениями внешних инструментов","es":"Gestionar conexiones con herramientas externas"},"word":"MCP (Model Context Protocol)","gloss":{"zh":"模型上下文协议（连接外部工具的标准）","ja":"Model Context Protocol（外部ツール連携の標準）","zh-hant":"MCP（Model Context Protocol，模型上下文協定）","ko":"MCP (Model Context Protocol, 외부 도구 연결 표준)","ru":"MCP (Model Context Protocol, стандарт подключения внешних инструментов)","es":"MCP (Model Context Protocol, estándar para conectar herramientas externas)"},"desc":{"en":"Manages MCP server connections and OAuth. No argument opens the list; `reconnect`, `enable` or `disable` with a server name or `all` acts directly.","ja":"MCP サーバーの接続と OAuth 認証を管理します。引数なしで一覧、`reconnect`・`enable`・`disable` とサーバー名か `all` で直接操作。","zh":"管理 MCP 服务器连接和 OAuth 登录。不带参数打开列表；`reconnect`、`enable`、`disable` 加服务器名或 `all` 可直接操作。","zh-hant":"管理 MCP 伺服器連線和 OAuth。不加參數會開啟清單；`reconnect`、`enable` 或 `disable` 加上伺服器名稱或 `all` 可直接操作。","ko":"MCP 서버 연결과 OAuth를 관리합니다. 인수 없이 실행하면 목록이 열리고, `reconnect`, `enable`, `disable`에 서버 이름이나 `all`을 붙이면 바로 실행합니다.","ru":"Управляет подключениями к серверам MCP и OAuth. Без аргумента открывает список; `reconnect`, `enable` или `disable` с именем сервера или `all` действуют сразу.","es":"Gestiona las conexiones a servidores MCP y OAuth. Sin argumento abre la lista; `reconnect`, `enable` o `disable` con el nombre de un servidor o `all` actúan directamente."},"use":{"en":"A connector failed or needs auth: `/mcp reconnect all`.","ja":"コネクターのエラーや再ログインが必要なとき：`/mcp reconnect all`。","zh":"连接器报错或需要登录：`/mcp reconnect all`。","zh-hant":"連接器失敗或需要驗證：`/mcp reconnect all`。","ko":"커넥터가 실패했거나 인증이 필요할 때: `/mcp reconnect all`.","ru":"Коннектор сломался или требует авторизации: `/mcp reconnect all`.","es":"Un conector falló o necesita autenticación: `/mcp reconnect all`."}},{"cmd":"/chrome","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"Chrome","gloss":{"zh":"Chrome 浏览器","ja":"Chrome ブラウザー","zh-hant":"Chrome 瀏覽器","ko":"Chrome 브라우저","ru":"Chrome (браузер)","es":"navegador Chrome"},"desc":{"en":"Configures Claude in Chrome settings.","ja":"Claude in Chrome の設定を行います。","zh":"配置 Claude in Chrome 的设置。","zh-hant":"設定 Claude in Chrome。","ko":"Claude in Chrome 설정을 구성합니다.","ru":"Настраивает параметры Claude in Chrome.","es":"Configura los ajustes de Claude in Chrome."},"use":{"en":"When first connecting the Chrome extension.","ja":"Chrome 拡張と初めて接続するとき。","zh":"第一次连接 Chrome 扩展时。","zh-hant":"第一次連接 Chrome 擴充功能時。","ko":"Chrome 확장 프로그램을 처음 연결할 때.","ru":"При первом подключении расширения Chrome.","es":"Al conectar la extensión de Chrome por primera vez."}},{"cmd":"/claude-api","args":"[subcommand]","cat":"extend","kind":"skill","pick":false,"aliases":[],"word":"Claude API","gloss":{"zh":"Claude 编程接口","ja":"Claude の API","zh-hant":"Claude API（Claude 程式介面）","ko":"Claude API","ru":"Claude API","es":"API de Claude"},"desc":{"en":"Loads Claude API and Managed Agents reference for your project's language; activates automatically when code imports `anthropic`. Subcommands include `migrate`, `upgrade`, `cost-optimize`, `build-eval`, `prompt-audit`.","ja":"プロジェクトの言語に合った Claude API と Managed Agents の資料を読み込みます。コードが `anthropic` を import していると自動で有効。サブコマンドは `migrate`・`upgrade`・`cost-optimize`・`build-eval`・`prompt-audit` など。","zh":"加载与你项目语言对应的 Claude API 和 Managed Agents 资料；代码导入 `anthropic` 时会自动启用。子命令包括 `migrate`、`upgrade`、`cost-optimize`、`build-eval`、`prompt-audit` 等。","zh-hant":"載入適合你專案程式語言的 Claude API 和 Managed Agents 參考資料；程式碼匯入 `anthropic` 時會自動啟用。子指令包括 `migrate`、`upgrade`、`cost-optimize`、`build-eval`、`prompt-audit`。","ko":"프로젝트 언어에 맞는 Claude API와 Managed Agents 참고 자료를 불러옵니다. 코드가 `anthropic`을 import하면 자동으로 활성화됩니다. 하위 명령으로 `migrate`, `upgrade`, `cost-optimize`, `build-eval`, `prompt-audit` 등이 있습니다.","ru":"Загружает справку по Claude API и Managed Agents для языка вашего проекта; включается автоматически, когда код импортирует `anthropic`. Подкоманды: `migrate`, `upgrade`, `cost-optimize`, `build-eval`, `prompt-audit` и другие.","es":"Carga la referencia de la API de Claude y de Managed Agents para el lenguaje de tu proyecto; se activa sola cuando el código importa `anthropic`. Los subcomandos incluyen `migrate`, `upgrade`, `cost-optimize`, `build-eval`, `prompt-audit`."},"use":{"en":"Cut API spend in your app: `/claude-api cost-optimize`.","ja":"自作 AI アプリの API 費用を下げたい：`/claude-api cost-optimize`。","zh":"自己开发 AI 应用、想降低 API 费用：`/claude-api cost-optimize`。","zh-hant":"降低你的應用程式的 API 花費：`/claude-api cost-optimize`。","ko":"앱의 API 비용을 줄이고 싶을 때: `/claude-api cost-optimize`.","ru":"Снизить расходы на API в вашем приложении: `/claude-api cost-optimize`.","es":"Reduce el gasto de API de tu aplicación: `/claude-api cost-optimize`."}},{"cmd":"/claude-in-chrome","args":"[task]","cat":"extend","kind":"skill","pick":false,"aliases":[],"risk":["external"],"word":"Claude in Chrome","gloss":{"zh":"在 Chrome 浏览器中使用 Claude","ja":"Chrome で動く Claude","zh-hant":"Claude in Chrome（在 Chrome 瀏覽器中使用 Claude）","ko":"Chrome에서 동작하는 Claude","ru":"Claude в Chrome","es":"Claude en Chrome"},"desc":{"en":"Has Claude carry out a task in your browser through Claude in Chrome, such as testing a page or reading console logs. Requires Chrome integration (e.g. `claude --chrome`).","ja":"Claude in Chrome 拡張を通して、ページのテスト・フォーム入力・コンソールログの確認などをブラウザーで行います。Chrome 連携の有効化（例：`claude --chrome`）が必要です。","zh":"通过 Claude in Chrome 扩展让 Claude 在你的浏览器里执行任务，如测试页面、填写表单、读取控制台日志。需启用 Chrome 集成（如 `claude --chrome`）。","zh-hant":"透過 Claude in Chrome 讓 Claude 在你的瀏覽器中執行工作，例如測試網頁或讀取主控台紀錄。需要啟用 Chrome 整合（例如 `claude --chrome`）。","ko":"Claude in Chrome을 통해 브라우저에서 Claude가 작업을 수행하게 합니다. 예: 페이지 테스트, 콘솔 로그 읽기. Chrome 연동이 필요합니다(예: `claude --chrome`).","ru":"Claude выполняет задачу в вашем браузере через Claude in Chrome, например тестирует страницу или читает журнал консоли. Нужна интеграция с Chrome (например, `claude --chrome`).","es":"Hace que Claude realice una tarea en tu navegador mediante Claude in Chrome, como probar una página o leer los registros de la consola. Requiere la integración con Chrome (por ejemplo, `claude --chrome`)."},"use":{"en":"`/claude-in-chrome test the sign-up flow on my local site and report errors`.","ja":"`/claude-in-chrome ローカルのサイトで会員登録の流れを試してエラーを報告して`。","zh":"`/claude-in-chrome 打开本地网站，测试注册流程并报告错误`。","zh-hant":"`/claude-in-chrome 測試我本機網站的註冊流程並回報錯誤`。","ko":"`/claude-in-chrome 로컬 사이트에서 회원가입 흐름을 테스트하고 오류를 알려 줘`.","ru":"`/claude-in-chrome протестируй регистрацию на моём локальном сайте и сообщи об ошибках`.","es":"`/claude-in-chrome prueba el registro de usuarios en mi sitio local e informa de los errores`."}},{"cmd":"/ide","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"IDE (integrated development environment)","gloss":{"zh":"集成开发环境（代码编辑器）","ja":"統合開発環境（コードエディター）","zh-hant":"IDE（整合開發環境，程式碼編輯器）","ko":"IDE (통합 개발 환경, 코드 편집기)","ru":"IDE (интегрированная среда разработки)","es":"IDE (entorno de desarrollo integrado, editor de código)"},"desc":{"en":"Manages IDE integrations and shows status.","ja":"VS Code や JetBrains などのエディターとの連携を管理し、状態を表示します。","zh":"管理与 VS Code、JetBrains 等编辑器的集成并显示状态。","zh-hant":"管理 IDE 整合並顯示狀態。","ko":"IDE 연동을 관리하고 상태를 보여 줍니다.","ru":"Управляет интеграциями с IDE и показывает их состояние.","es":"Gestiona las integraciones con IDE y muestra su estado."},"use":{"en":"Check the connection when edits don't show in your editor.","ja":"エディターに Claude の変更が出ないとき、接続を確認。","zh":"编辑器里看不到 Claude 的改动时，检查是否连上。","zh-hant":"編輯器裡看不到修改時，檢查連線狀態。","ko":"편집기에 Claude의 수정 내용이 보이지 않을 때 연결을 확인합니다.","ru":"Проверьте подключение, если правки не появляются в редакторе.","es":"Comprueba la conexión cuando los cambios no aparecen en tu editor."}},{"cmd":"/install-github-app","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"risk":["external","perms"],"word":"install GitHub app","gloss":{"zh":"安装 GitHub 应用","ja":"GitHub アプリのインストール","zh-hant":"安裝 GitHub 應用程式","ko":"GitHub 앱 설치","ru":"установить приложение GitHub","es":"instalar la app de GitHub"},"desc":{"en":"Installs the Claude GitHub App for a repository, optionally setting up GitHub Actions workflows and secrets. github.com only.","ja":"リポジトリに Claude GitHub App を入れ、必要なら GitHub Actions のワークフローとシークレットも設定します。github.com のリポジトリのみ。","zh":"为仓库安装 Claude GitHub App，可选设置 GitHub Actions 工作流和密钥。仅适用于 github.com 仓库。","zh-hant":"為儲存庫安裝 Claude GitHub App，也可以順便設定 GitHub Actions 工作流程和密鑰。只適用於 github.com。","ko":"저장소에 Claude GitHub App을 설치하고, 원하면 GitHub Actions 워크플로와 시크릿도 설정합니다. github.com 전용입니다.","ru":"Устанавливает приложение Claude GitHub App для репозитория и по желанию настраивает рабочие процессы GitHub Actions и секреты. Только для github.com.","es":"Instala la Claude GitHub App en un repositorio y, si quieres, configura flujos de trabajo y secretos de GitHub Actions. Solo github.com."},"use":{"en":"To mention Claude in issues and PRs and have it work there.","ja":"GitHub の issue や PR で @claude と呼んで作業させたいとき。","zh":"希望在 GitHub 的 issue 或 PR 中 @claude 让它干活。","zh-hant":"想在 issue 和 PR 中提及 Claude，讓它在那裡工作。","ko":"이슈와 PR에서 Claude를 멘션해 그곳에서 작업하게 하고 싶을 때.","ru":"Чтобы упоминать Claude в issues и PR и чтобы он там работал.","es":"Para mencionar a Claude en issues y PR y que trabaje ahí."}},{"cmd":"/install-slack-app","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"install Slack app","gloss":{"zh":"安装 Slack 应用","ja":"Slack アプリのインストール","zh-hant":"安裝 Slack 應用程式","ko":"Slack 앱 설치","ru":"установить приложение Slack","es":"instalar la app de Slack"},"desc":{"en":"Installs the Claude Slack app via a browser OAuth flow.","ja":"Claude の Slack アプリを入れます。ブラウザーが開き OAuth 認可を行います。","zh":"安装 Claude Slack 应用，会打开浏览器完成 OAuth 授权。","zh-hant":"透過瀏覽器的 OAuth 流程安裝 Claude Slack 應用程式。","ko":"브라우저 OAuth 과정을 통해 Claude Slack 앱을 설치합니다.","ru":"Устанавливает приложение Claude для Slack через авторизацию OAuth в браузере.","es":"Instala la app de Claude para Slack mediante un flujo OAuth en el navegador."},"use":{"en":"Your team wants Claude in Slack.","ja":"チームが Slack から Claude を呼びたいとき。","zh":"团队想在 Slack 里直接叫 Claude。","zh-hant":"團隊想在 Slack 裡使用 Claude。","ko":"팀에서 Slack으로 Claude를 쓰고 싶을 때.","ru":"Ваша команда хочет Claude в Slack.","es":"Tu equipo quiere a Claude en Slack."}},{"cmd":"/plugin","args":"[subcommand]","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"plugin","gloss":{"zh":"插件","ja":"プラグイン","zh-hant":"外掛","ko":"플러그인","ru":"плагин","es":"complemento (plugin)"},"desc":{"en":"Manages plugins. No argument opens the menu; `list`, `install`, `enable`, `disable` act directly. Run `/reload-plugins` if the install summary says so.","ja":"プラグイン（コマンド・スキル・エージェント・ツールのセット）を管理します。引数なしでメニュー、`list`・`install`・`enable`・`disable` で直接操作。案内が出たら `/reload-plugins`。","zh":"管理插件（一包命令、技能、代理、工具）。不带参数打开菜单，或用 `list`、`install`、`enable`、`disable` 直接操作。安装后若提示，需要 `/reload-plugins`。","zh-hant":"管理外掛。不加參數會開啟選單；`list`、`install`、`enable`、`disable` 可直接操作。如果安裝摘要有提示，請執行 `/reload-plugins`。","ko":"플러그인을 관리합니다. 인수 없이 실행하면 메뉴가 열리고, `list`, `install`, `enable`, `disable`은 바로 실행합니다. 설치 요약에 안내가 나오면 `/reload-plugins`를 실행하세요.","ru":"Управляет плагинами. Без аргумента открывает меню; `list`, `install`, `enable`, `disable` действуют сразу. Запустите `/reload-plugins`, если итог установки этого просит.","es":"Gestiona complementos. Sin argumento abre el menú; `list`, `install`, `enable`, `disable` actúan directamente. Ejecuta `/reload-plugins` si el resumen de instalación lo indica."},"use":{"en":"Browse with `/plugin` and install one that fits your work.","ja":"`/plugin` でマーケットプレイスを見て、仕事に合うものを入れます。","zh":"`/plugin` 浏览插件市场，装一个适合你工作的插件。","zh-hant":"用 `/plugin` 瀏覽，安裝一個適合你工作的外掛。","ko":"`/plugin`으로 둘러보고 내 작업에 맞는 플러그인을 설치합니다.","ru":"Посмотрите плагины через `/plugin` и установите подходящий для вашей работы.","es":"Explora con `/plugin` e instala uno que encaje con tu trabajo."}},{"cmd":"/plugin-authoring","args":"","cat":"extend","kind":"skill","pick":false,"aliases":[],"since":"2.1.287","word":"plugin authoring","gloss":{"zh":"编写扩展","ja":"拡張の作成","zh-hant":"撰寫擴充（mod）","ko":"플러그인 작성","ru":"создание плагинов","es":"creación de extensiones"},"desc":{"en":"Loads the reference for writing a mod. A skill from a built-in plugin, which you can turn off in `/plugin`.","ja":"「mod」（Claude の画面や動作を変える小さな拡張）を書くための資料を読み込みます。組み込みプラグインのスキルで、`/plugin` でオフにできます。","zh":"加载编写「mod」（修改 Claude 界面或行为的小扩展）的参考资料。来自内置插件，可在 `/plugin` 中关闭。","zh-hant":"載入撰寫 mod 的參考資料。這是內建外掛提供的技能，可以在 `/plugin` 中關閉。","ko":"mod(확장) 작성용 참고 자료를 불러옵니다. 기본 제공 플러그인에 들어 있는 스킬이며, `/plugin`에서 끌 수 있습니다.","ru":"Загружает справку по написанию мода. Это навык из встроенного плагина, его можно выключить в `/plugin`.","es":"Carga la referencia para escribir un mod. Es una habilidad de un complemento integrado, que puedes desactivar en `/plugin`."},"use":{"en":"When you want a small side panel that stays beside the chat.","ja":"常に横に表示される小さなパネルを作りたいとき。","zh":"想做一个常驻侧边栏的小面板时。","zh-hant":"想做一個固定在對話旁邊的小側邊面板時。","ko":"채팅 옆에 항상 떠 있는 작은 패널을 만들고 싶을 때.","ru":"Когда нужна небольшая боковая панель, которая остаётся рядом с чатом.","es":"Cuando quieres un pequeño panel lateral que se quede junto al chat."}},{"cmd":"/reload-plugins","args":"[--force]","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"reload plugins","gloss":{"zh":"重新加载插件","ja":"プラグインの再読み込み","zh-hant":"重新載入外掛","ko":"플러그인 다시 불러오기","ru":"перезагрузить плагины","es":"recargar complementos"},"desc":{"en":"Reloads active plugins without restarting and reports load errors. If the reload would change loaded MCP tools and invalidate the prompt cache, it warns and skips unless you pass `--force`.","ja":"再起動せずにプラグインの変更を反映し、読み込み数とエラーを報告します。読み込む MCP ツールが変わる（プロンプトキャッシュが無効になる）場合は警告して中止、`--force` で強制。","zh":"不重启就应用插件改动，并报告加载数量和错误。如果会改变已加载的 MCP 工具（导致提示缓存失效），会警告并跳过，除非加 `--force`。","zh-hant":"不必重新啟動就重新載入啟用中的外掛，並回報載入錯誤。如果重新載入會改變已載入的 MCP 工具、讓提示快取失效，它會發出警告並略過，除非你加上 `--force`。","ko":"재시작 없이 활성 플러그인을 다시 불러오고, 불러오기 오류를 알려 줍니다. 다시 불러오면 로드된 MCP 도구가 바뀌어 프롬프트 캐시가 무효화되는 경우, `--force`를 주지 않는 한 경고하고 건너뜁니다.","ru":"Перезагружает активные плагины без перезапуска и сообщает об ошибках загрузки. Если перезагрузка изменит загруженные инструменты MCP и сбросит кэш запросов, команда предупреждает и пропускает её, если вы не передали `--force`.","es":"Recarga los complementos activos sin reiniciar e informa de los errores de carga. Si la recarga cambiaría las herramientas MCP cargadas e invalidaría la caché del prompt, avisa y no la hace salvo que pases `--force`."},"use":{"en":"Right after installing a plugin that asks for it.","ja":"プラグインを入れて再読み込みを促されたとき。","zh":"刚装完插件、提示需要重新加载时。","zh-hant":"剛裝好一個要求重新載入的外掛之後。","ko":"플러그인을 설치한 직후, 다시 불러오라는 안내가 나올 때.","ru":"Сразу после установки плагина, который этого просит.","es":"Justo después de instalar un complemento que lo pide."}},{"cmd":"/reload-skills","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"reload skills","gloss":{"zh":"重新加载技能","ja":"スキルの再読み込み","zh-hant":"重新載入技能","ko":"스킬 다시 불러오기","ru":"перезагрузить навыки","es":"recargar habilidades"},"desc":{"en":"Re-scans skill and command directories so skills added or changed during the session are available without restarting.","ja":"スキルとコマンドのフォルダーを再スキャンし、セッション中に追加・変更したスキルをすぐ使えるようにします。増減の数も表示。","zh":"重新扫描技能和命令文件夹，让会话中新增或修改的技能立即可用，并报告增减数量。","zh-hant":"重新掃描技能和指令資料夾，讓工作階段中新增或修改的技能不必重新啟動就能使用。","ko":"스킬과 명령 폴더를 다시 검색해서, 세션 중에 추가하거나 바꾼 스킬을 재시작 없이 쓸 수 있게 합니다.","ru":"Заново просматривает папки навыков и команд, чтобы навыки, добавленные или изменённые во время сессии, стали доступны без перезапуска.","es":"Vuelve a explorar las carpetas de habilidades y comandos para que las habilidades añadidas o cambiadas durante la sesión estén disponibles sin reiniciar."},"use":{"en":"You just wrote a custom skill and want it now.","ja":"自作スキルを書いたばかりで、再起動せずに使いたいとき。","zh":"刚写好一个自定义技能文件，不重启就想用。","zh-hant":"剛寫好一個自訂技能，想馬上使用。","ko":"직접 만든 스킬을 방금 작성했고 바로 쓰고 싶을 때.","ru":"Вы только что написали свой навык и хотите сразу им пользоваться.","es":"Acabas de escribir una habilidad propia y la quieres usar ya."}},{"cmd":"/skill-doctor","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"since":"2.1.252","word":"skill doctor","gloss":{"zh":"技能体检","ja":"スキルの健康診断","zh-hant":"技能健檢","ko":"스킬 진단","ru":"доктор навыков","es":"chequeo de habilidades"},"desc":{"en":"Shows each skill's context cost and usage so you can find skills to turn off.","ja":"各スキルのコンテキスト消費量と使用頻度を表示し、オフにしてよいスキルを見つけます。","zh":"显示每个技能占用多少上下文、使用频率如何，帮你找出可以关闭的技能。","zh-hant":"顯示每個技能佔用的上下文和使用情況，幫你找出可以關閉的技能。","ko":"각 스킬의 컨텍스트 비용과 사용량을 보여 주어, 꺼도 될 스킬을 찾게 해 줍니다.","ru":"Показывает, сколько контекста занимает каждый навык и как часто он используется, чтобы найти навыки, которые можно выключить.","es":"Muestra el costo de contexto y el uso de cada habilidad para que encuentres cuáles desactivar."},"use":{"en":"Run periodically to prune unused skills.","ja":"定期的に実行して、使っていないスキルを整理。","zh":"定期体检，清理长期不用的技能。","zh-hant":"定期執行，清理沒在用的技能。","ko":"주기적으로 실행해 안 쓰는 스킬을 정리합니다.","ru":"Запускайте время от времени, чтобы убирать неиспользуемые навыки.","es":"Ejecútalo de vez en cuando para quitar habilidades que no usas."}},{"cmd":"/skills","args":"","cat":"extend","kind":"builtin","pick":false,"aliases":[],"word":"skills","gloss":{"zh":"技能","ja":"スキル","zh-hant":"技能","ko":"스킬","ru":"навыки","es":"habilidades"},"desc":{"en":"Lists skills with filtering. `t` sorts by token count, `Space`/`Enter` cycles a skill's visibility to Claude and the `/` menu, `Esc` saves and closes.","ja":"使えるスキルを一覧表示し、名前・説明・提供元で絞り込めます。`t` でトークン数順、`Space`/`Enter` で Claude や `/` メニューへの表示を切り替え、`Esc` で保存して閉じます。","zh":"列出可用技能，可按名称、描述、来源筛选；按 `t` 按占用 token 排序；`Space`/`Enter` 切换技能对 Claude 和 `/` 菜单是否可见；`Esc` 保存关闭。","zh-hant":"列出技能並可篩選。`t` 依 token 數排序，`Space`/`Enter` 切換技能對 Claude 和 `/` 選單是否可見，`Esc` 儲存並關閉。","ko":"스킬 목록을 필터와 함께 보여 줍니다. `t`는 토큰 수로 정렬하고, `Space`/`Enter`는 스킬이 Claude와 `/` 메뉴에 보이는 방식을 순서대로 바꾸며, `Esc`는 저장하고 닫습니다.","ru":"Показывает навыки с фильтрацией. `t` сортирует по числу токенов, `Space`/`Enter` по кругу меняет видимость навыка для Claude и в меню `/`, `Esc` сохраняет и закрывает.","es":"Lista las habilidades con filtros. `t` ordena por número de tokens, `Space`/`Enter` cambia la visibilidad de una habilidad para Claude y para el menú `/`, `Esc` guarda y cierra."},"use":{"en":"Too many skills: `/skills`, press `t`, hide the heavy unused ones.","ja":"スキルが多すぎるとき：`/skills` で `t` を押して並べ替え、使わないものを非表示に。","zh":"技能太多占空间：`/skills` 按 `t` 排序，隐藏用不到的。","zh-hant":"技能太多：`/skills`，按 `t`，把佔空間又用不到的技能隱藏起來。","ko":"스킬이 너무 많을 때: `/skills`에서 `t`를 눌러 정렬하고, 무겁고 안 쓰는 스킬을 숨깁니다.","ru":"Слишком много навыков: `/skills`, нажмите `t` и скройте тяжёлые неиспользуемые.","es":"Demasiadas habilidades: `/skills`, pulsa `t` y oculta las pesadas que no usas."}},{"cmd":"/permissions","args":"","cat":"safety","kind":"builtin","pick":true,"aliases":["/allowed-tools"],"short":{"en":"Decide what Claude may do without asking","ja":"どの操作を確認なしで許可するか決める","zh":"设置哪些操作可以直接做","zh-hant":"決定 Claude 不必詢問就能做哪些事","ko":"Claude가 묻지 않고 할 수 있는 일 정하기","ru":"Решить, что Claude может делать без вопросов","es":"Decidir qué puede hacer Claude sin preguntar"},"risk":["perms"],"word":"permissions","gloss":{"zh":"权限","ja":"権限","zh-hant":"權限","ko":"권한","ru":"разрешения","es":"permisos"},"desc":{"en":"Manages allow, ask and deny rules for tools: view by scope, add or remove rules, manage working directories, review recent auto mode denials and classifier rules.","ja":"ツール権限の「許可・確認・拒否」ルールを管理します。範囲ごとの確認、ルールの追加・削除、作業ディレクトリの管理、自動モードの最近の拒否と分類ルールの確認ができます。","zh":"管理工具权限的「允许 / 询问 / 禁止」规则：按范围查看、增删规则、管理工作目录、查看自动模式最近的拦截记录和分类规则。","zh-hant":"管理工具的允許、詢問和拒絕規則：依範圍檢視、新增或移除規則、管理工作資料夾、查看自動模式最近的拒絕紀錄和分類器規則。","ko":"도구에 대한 허용, 확인, 거부 규칙을 관리합니다: 범위별로 보기, 규칙 추가·삭제, 작업 폴더 관리, 최근 자동 모드 거부 내역과 분류기 규칙 검토.","ru":"Управляет правилами allow, ask и deny для инструментов: просмотр по области действия, добавление и удаление правил, управление рабочими папками, просмотр недавних отказов автоматического режима и правил классификатора.","es":"Gestiona las reglas de permitir, preguntar y denegar para las herramientas: verlas por ámbito, añadir o quitar reglas, gestionar carpetas de trabajo y revisar los rechazos recientes del modo automático y las reglas del clasificador."},"use":{"en":"Tired of approving `npm test` every time: allow it here.","ja":"毎回「npm test を実行してよいか」と聞かれるのが面倒なら、ここで許可に。","zh":"每次都被问「能否运行 npm test」很烦：在这里把它设为允许。","zh-hant":"每次都要核准 `npm test` 很煩：在這裡把它設為允許。","ko":"매번 `npm test` 실행을 승인하기 귀찮다면 여기서 허용합니다.","ru":"Надоело каждый раз подтверждать `npm test`: разрешите его здесь.","es":"Te cansaste de aprobar `npm test` cada vez: permítelo aquí."}},{"cmd":"/auto-mode-setup","args":"","cat":"safety","kind":"builtin","pick":false,"aliases":[],"risk":["perms"],"word":"auto mode setup","gloss":{"zh":"自动模式设置","ja":"自動モードの設定","zh-hant":"自動模式設定","ko":"자동 모드 설정","ru":"настройка автоматического режима","es":"configuración del modo automático"},"desc":{"en":"Drafts `autoMode.environment` entries from your project and recent sessions for you to review and save. Has version and plan requirements.","ja":"プロジェクトと最近のセッションから `autoMode.environment` の項目を下書きし、確認後ユーザー設定に保存します。自動モードの判断精度が上がります。バージョンとプランの条件あり。","zh":"根据你的项目和近期会话起草 `autoMode.environment` 条目，审核后保存到用户设置，帮助自动模式更准确地判断。有版本和套餐要求。","zh-hant":"根據你的專案和最近的工作階段，草擬 `autoMode.environment` 項目，讓你檢查後儲存。有版本和方案的限制。","ko":"프로젝트와 최근 세션을 바탕으로 `autoMode.environment` 항목 초안을 만들어, 검토 후 저장할 수 있게 합니다. 버전과 플랜 요구 사항이 있습니다.","ru":"Составляет черновик записей `autoMode.environment` по вашему проекту и недавним сессиям; вы проверяете и сохраняете. Есть требования к версии и тарифу.","es":"Redacta entradas de `autoMode.environment` a partir de tu proyecto y tus sesiones recientes para que las revises y guardes. Tiene requisitos de versión y de plan."},"use":{"en":"When auto mode keeps blocking routine actions.","ja":"自動モードがいつもの操作を誤って止めるとき。","zh":"自动模式总是误拦你常用的操作时。","zh-hant":"自動模式一直擋下例行操作時。","ko":"자동 모드가 평소 하는 작업을 계속 막을 때.","ru":"Когда автоматический режим постоянно блокирует обычные действия.","es":"Cuando el modo automático bloquea una y otra vez acciones rutinarias."}},{"cmd":"/fewer-permission-prompts","args":"","cat":"safety","kind":"skill","pick":false,"aliases":[],"risk":["perms"],"word":"fewer permission prompts","gloss":{"zh":"减少权限弹窗","ja":"確認ダイアログを減らす","zh-hant":"減少權限提示","ko":"권한 확인 줄이기","ru":"меньше запросов разрешений","es":"menos solicitudes de permiso"},"desc":{"en":"Scans transcripts for common read-only Bash and MCP calls and adds a prioritized allowlist to project `.claude/settings.json`.","ja":"履歴からよく使う読み取り専用の Bash・MCP 呼び出しを探し、優先度順にプロジェクトの `.claude/settings.json` の許可リストへ追加します。","zh":"扫描历史记录中常用的只读 Bash 和 MCP 调用，把它们按优先级加入项目 `.claude/settings.json` 的允许清单。","zh-hant":"掃描對話紀錄中常見的唯讀 Bash 和 MCP 呼叫，依優先順序把允許清單加到專案的 `.claude/settings.json`。","ko":"대화 기록에서 자주 쓰는 읽기 전용 Bash 및 MCP 호출을 찾아, 우선순위가 매겨진 허용 목록을 프로젝트 `.claude/settings.json`에 추가합니다.","ru":"Просматривает записи разговоров, находит частые вызовы Bash и MCP только для чтения и добавляет упорядоченный по приоритету список разрешений в `.claude/settings.json` проекта.","es":"Revisa las transcripciones en busca de llamadas comunes de solo lectura a Bash y MCP, y añade una lista de permitidos priorizada al `.claude/settings.json` del proyecto."},"use":{"en":"Run once when approval prompts keep interrupting you.","ja":"確認ダイアログで何度も止められるときに一度実行。","zh":"被权限确认打断太多次时跑一次。","zh-hant":"核准提示一直打斷你時，執行一次。","ko":"승인 요청이 계속 작업을 끊을 때 한 번 실행합니다.","ru":"Запустите один раз, если запросы подтверждения постоянно вас прерывают.","es":"Ejecútalo una vez cuando las solicitudes de aprobación no dejan de interrumpirte."}},{"cmd":"/hooks","args":"","cat":"safety","kind":"builtin","pick":false,"aliases":[],"word":"hooks","gloss":{"zh":"钩子（特定时刻自动运行的脚本）","ja":"フック（決まったタイミングで自動実行されるスクリプト）","zh-hant":"hook（在特定時機自動執行的腳本）","ko":"훅 (정해진 시점에 자동 실행되는 스크립트)","ru":"хуки (скрипты, которые запускаются автоматически в определённые моменты)","es":"hooks (scripts que se ejecutan solos en momentos fijos)"},"desc":{"en":"Views hook configurations.","ja":"フックの設定を確認します。","zh":"查看 hook 配置。","zh-hant":"檢視 hook 設定。","ko":"훅 설정을 보여 줍니다.","ru":"Показывает настройки хуков.","es":"Muestra la configuración de los hooks."},"use":{"en":"Check what's configured when a hook seems to break every edit.","ja":"フックのせいで編集のたびにエラーが出ていそうなとき、設定内容を確認。","zh":"怀疑某个 hook 导致每次编辑都报错时，先看看配置了什么。","zh-hant":"某個 hook 似乎讓每次編輯都出錯時，看看設定了什麼。","ko":"훅 때문에 수정할 때마다 문제가 생기는 것 같을 때, 무엇이 설정되어 있는지 확인합니다.","ru":"Проверьте настройки, если кажется, что какой-то хук ломает каждую правку.","es":"Revisa qué hay configurado cuando un hook parece romper cada cambio."}},{"cmd":"/privacy-settings","args":"","cat":"safety","kind":"builtin","pick":false,"aliases":[],"word":"privacy settings","gloss":{"zh":"隐私设置","ja":"プライバシー設定","zh-hant":"隱私設定","ko":"개인정보 설정","ru":"настройки конфиденциальности","es":"configuración de privacidad"},"desc":{"en":"Views and updates privacy settings. Pro, Max and Ultra only.","ja":"プライバシー設定を確認・変更します。Pro・Max・Ultra のみ。","zh":"查看和修改隐私设置，仅限 Pro、Max、Ultra 订阅用户。","zh-hant":"檢視和更新隱私設定。只限 Pro、Max 和 Ultra。","ko":"개인정보 설정을 보고 변경합니다. Pro, Max, Ultra 전용입니다.","ru":"Показывает и изменяет настройки конфиденциальности. Только для Pro, Max и Ultra.","es":"Muestra y actualiza la configuración de privacidad. Solo Pro, Max y Ultra."},"use":{"en":"To check how your data is used.","ja":"データの扱いに関する設定を確認したいとき。","zh":"想确认自己的数据使用设置时。","zh-hant":"想確認你的資料如何被使用時。","ko":"내 데이터가 어떻게 쓰이는지 확인할 때.","ru":"Проверить, как используются ваши данные.","es":"Para comprobar cómo se usan tus datos."}},{"cmd":"/sandbox","args":"","cat":"safety","kind":"builtin","pick":false,"aliases":[],"risk":["perms"],"word":"sandbox","gloss":{"zh":"沙箱（隔离环境）","ja":"サンドボックス（隔離環境）","zh-hant":"沙箱（隔離環境）","ko":"샌드박스 (격리 환경)","ru":"песочница (изолированная среда)","es":"sandbox (entorno aislado)"},"desc":{"en":"Toggles sandbox mode, on supported platforms only.","ja":"サンドボックスモードを切り替えます。対応プラットフォームのみ。","zh":"开关沙箱模式，仅在支持的平台上可用。","zh-hant":"開關沙箱模式，只在支援的平台上可用。","ko":"샌드박스 모드를 켜고 끕니다. 지원되는 플랫폼에서만 쓸 수 있습니다.","ru":"Включает и выключает режим песочницы, только на поддерживаемых платформах.","es":"Activa o desactiva el modo sandbox, solo en plataformas compatibles."},"use":{"en":"Turn it on before running unfamiliar scripts.","ja":"よく知らないスクリプトを動かす前にオンに。","zh":"要运行来源不太熟悉的脚本时先开启。","zh-hant":"執行不熟悉的腳本之前先開啟。","ko":"잘 모르는 스크립트를 실행하기 전에 켭니다.","ru":"Включите перед запуском незнакомых скриптов.","es":"Actívalo antes de ejecutar scripts que no conoces."}},{"cmd":"/update-config","args":"[request]","cat":"safety","kind":"skill","pick":false,"aliases":[],"risk":["perms"],"word":"update config","gloss":{"zh":"更新配置","ja":"設定の更新","zh-hant":"更新設定","ko":"설정 업데이트","ru":"обновить настройки","es":"actualizar la configuración"},"desc":{"en":"Describe a settings change (allow a command, set an env var, add a hook) and Claude edits the matching `settings.json`. Use `/config` for theme and model.","ja":"設定の変更（コマンドの許可、環境変数、フックの追加）を言葉で伝えると、Claude が該当の `settings.json` を編集します。テーマやモデルは `/config`。","zh":"用自然语言描述设置改动（允许某命令、设置环境变量、添加 hook），Claude 修改对应的 `settings.json`。主题、模型等用 `/config`。","zh-hant":"描述你想要的設定變更（允許某個指令、設定環境變數、加入 hook），Claude 就會編輯對應的 `settings.json`。主題和模型請用 `/config`。","ko":"설정 변경 내용(명령 허용, 환경 변수 설정, 훅 추가)을 말로 설명하면, Claude가 해당 `settings.json`을 편집합니다. 테마와 모델은 `/config`를 사용하세요.","ru":"Опишите изменение настроек (разрешить команду, задать переменную окружения, добавить хук), и Claude отредактирует нужный `settings.json`. Для темы и модели используйте `/config`.","es":"Describe un cambio de configuración (permitir un comando, definir una variable de entorno, añadir un hook) y Claude edita el `settings.json` correspondiente. Usa `/config` para el tema y el modelo."},"use":{"en":"`/update-config run prettier after every file edit`.","ja":"`/update-config ファイル編集のたびに prettier を自動実行`。","zh":"`/update-config 每次编辑文件后自动运行 prettier`。","zh-hant":"`/update-config 每次編輯檔案後執行 prettier`。","ko":"`/update-config 파일을 수정할 때마다 prettier 실행`.","ru":"`/update-config запускай prettier после каждой правки файла`.","es":"`/update-config ejecuta prettier después de cada edición de archivo`."}},{"cmd":"/color","args":"[color|default]","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"color","gloss":{"zh":"颜色","ja":"色","zh-hant":"顏色","ko":"색","ru":"цвет","es":"color"},"desc":{"en":"Sets the prompt bar color for this session: `red`, `blue`, `green`, `yellow`, `purple`, `orange`, `pink` or `cyan`; `default` resets, no argument picks a random color.","ja":"このセッションの入力欄の色を設定します：`red`・`blue`・`green`・`yellow`・`purple`・`orange`・`pink`・`cyan`。`default` で戻し、引数なしでランダム。","zh":"设置当前会话输入栏的颜色：`red`、`blue`、`green`、`yellow`、`purple`、`orange`、`pink`、`cyan`；`default` 恢复；不带参数随机。","zh-hant":"設定這次工作階段輸入列的顏色：`red`、`blue`、`green`、`yellow`、`purple`、`orange`、`pink` 或 `cyan`；`default` 恢復預設，不加參數則隨機選一個顏色。","ko":"이 세션의 프롬프트 바 색을 정합니다: `red`, `blue`, `green`, `yellow`, `purple`, `orange`, `pink`, `cyan` 중 하나. `default`는 초기화하고, 인수 없이 실행하면 무작위 색을 고릅니다.","ru":"Задаёт цвет строки ввода для этой сессии: `red`, `blue`, `green`, `yellow`, `purple`, `orange`, `pink` или `cyan`; `default` сбрасывает, без аргумента выбирается случайный цвет.","es":"Define el color de la barra del prompt para esta sesión: `red`, `blue`, `green`, `yellow`, `purple`, `orange`, `pink` o `cyan`; `default` lo restablece y sin argumento elige un color al azar."},"use":{"en":"Mark a production session with `/color red`.","ja":"本番環境を扱うセッションは `/color red` にして注意を促す。","zh":"操作生产环境的会话设成 `/color red`，时刻提醒自己小心。","zh-hant":"用 `/color red` 標示正式環境的工作階段。","ko":"운영 환경을 다루는 세션은 `/color red`로 표시해 둡니다.","ru":"Отметьте сессию на рабочем сервере: `/color red`.","es":"Marca una sesión de producción con `/color red`."}},{"cmd":"/config","args":"[key=value ...]","cat":"ui","kind":"builtin","pick":false,"aliases":["/settings"],"word":"config","gloss":{"zh":"配置、设置","ja":"設定","zh-hant":"設定","ko":"설정","ru":"настройки","es":"configuración"},"desc":{"en":"Opens Settings for theme, model, output style and more, or sets `key=value` pairs directly, e.g. `/config theme=dark`. `/config --help` lists keys.","ja":"設定画面（テーマ、モデル、出力スタイルなど）を開きます。`key=value` で直接変更も可能（例：`/config theme=dark`）。`/config --help` で使えるキーを表示。","zh":"打开设置界面（主题、模型、输出风格等）。也可直接写 `key=value` 修改，例如 `/config theme=dark`。`/config --help` 列出可用的键。","zh-hant":"開啟設定畫面，調整主題、模型、輸出風格等，或直接設定 `key=value`，例如 `/config theme=dark`。`/config --help` 會列出可用的鍵。","ko":"테마, 모델, 출력 스타일 등을 바꾸는 설정 화면을 열거나, `key=value` 형식으로 바로 설정합니다. 예: `/config theme=dark`. `/config --help`는 키 목록을 보여 줍니다.","ru":"Открывает настройки темы, модели, стиля вывода и другого или сразу задаёт пары `key=value`, например `/config theme=dark`. `/config --help` показывает список ключей.","es":"Abre la configuración para el tema, el modelo, el estilo de salida y más, o define pares `key=value` directamente, por ejemplo `/config theme=dark`. `/config --help` lista las claves."},"use":{"en":"`/config theme=dark`.","ja":"`/config theme=dark` で一発でダークテーマに。","zh":"`/config theme=dark`，一步切换深色主题。","zh-hant":"`/config theme=dark`。","ko":"`/config theme=dark`.","ru":"`/config theme=dark`.","es":"`/config theme=dark`."}},{"cmd":"/focus","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"focus","gloss":{"zh":"专注视图","ja":"フォーカス表示","zh-hant":"專注","ko":"집중 보기","ru":"фокус","es":"vista de enfoque"},"desc":{"en":"Toggles a view showing only your last prompt, a one-line tool summary and the final response. Fullscreen rendering only.","ja":"フォーカス表示を切り替えます。最後の指示、ツール呼び出しの 1 行要約、最終回答だけを表示。フルスクリーン表示でのみ使えます。","zh":"切换专注视图：只显示你的最后一条提问、一行工具调用摘要和最终回答。仅全屏渲染模式可用。","zh-hant":"切換一種只顯示你最後一則提示、一行工具摘要和最終回答的畫面。只限全螢幕渲染模式。","ko":"마지막 프롬프트, 한 줄짜리 도구 요약, 최종 응답만 보여 주는 화면을 켜고 끕니다. 전체 화면 렌더링에서만 쓸 수 있습니다.","ru":"Включает и выключает вид, где видны только ваш последний запрос, однострочная сводка по инструментам и итоговый ответ. Только в полноэкранном режиме отображения.","es":"Activa o desactiva una vista que muestra solo tu último prompt, un resumen de una línea de las herramientas y la respuesta final. Solo con el renderizado a pantalla completa."},"use":{"en":"Hide intermediate steps and see only the result.","ja":"途中経過は見ず、結果だけ見たいとき。","zh":"不想看大量中间过程，只看结论。","zh-hant":"隱藏中間步驟，只看結果。","ko":"중간 과정은 숨기고 결과만 보고 싶을 때.","ru":"Скрыть промежуточные шаги и видеть только результат.","es":"Oculta los pasos intermedios y ve solo el resultado."}},{"cmd":"/keybindings","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"keybindings","gloss":{"zh":"快捷键","ja":"キー割り当て","zh-hant":"快速鍵","ko":"키 바인딩 (단축키 설정)","ru":"сочетания клавиш","es":"atajos de teclado"},"desc":{"en":"Opens your keyboard shortcuts file.","ja":"キーボードショートカットの設定ファイルを開きます。","zh":"打开快捷键配置文件。","zh-hant":"開啟你的快速鍵設定檔。","ko":"키보드 단축키 파일을 엽니다.","ru":"Открывает файл ваших сочетаний клавиш.","es":"Abre tu archivo de atajos de teclado."},"use":{"en":"Rebind actions to keys you're used to.","ja":"よく使う操作を慣れたキーに変更。","zh":"把常用操作改成你习惯的按键。","zh-hant":"把操作改成你習慣的按鍵。","ko":"익숙한 키로 동작을 다시 지정합니다.","ru":"Назначьте действиям привычные вам клавиши.","es":"Asigna las acciones a las teclas que ya conoces."}},{"cmd":"/scroll-speed","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"scroll speed","gloss":{"zh":"滚动速度","ja":"スクロール速度","zh-hant":"捲動速度","ko":"스크롤 속도","ru":"скорость прокрутки","es":"velocidad de desplazamiento"},"desc":{"en":"Adjusts mouse wheel scroll speed. Fullscreen rendering only; not in the JetBrains terminal.","ja":"マウスホイールの速度を調整します。フルスクリーン表示のみ、JetBrains のターミナルでは不可。","zh":"交互式调整鼠标滚轮速度。仅全屏渲染模式可用，JetBrains 终端中不可用。","zh-hant":"調整滑鼠滾輪的捲動速度。只限全螢幕渲染模式；JetBrains 終端機中無法使用。","ko":"마우스 휠 스크롤 속도를 조절합니다. 전체 화면 렌더링에서만 쓸 수 있으며, JetBrains 터미널에서는 안 됩니다.","ru":"Настраивает скорость прокрутки колёсиком мыши. Только в полноэкранном режиме отображения; не работает в терминале JetBrains.","es":"Ajusta la velocidad de desplazamiento de la rueda del mouse. Solo con el renderizado a pantalla completa; no en la terminal de JetBrains."},"use":{"en":"Slow it down when one notch jumps too far.","ja":"一回で飛びすぎるときに遅く。","zh":"滚一下跳太多行时调慢。","zh-hant":"滾一格就跳太遠時，把速度調慢。","ko":"휠을 한 칸 굴렸는데 너무 많이 넘어갈 때 느리게 합니다.","ru":"Уменьшите, если один щелчок колёсика прокручивает слишком далеко.","es":"Redúcela cuando un solo paso de la rueda salta demasiado."}},{"cmd":"/statusline","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"status line","gloss":{"zh":"状态栏","ja":"ステータスライン","zh-hant":"狀態列","ko":"상태 표시줄","ru":"строка состояния","es":"línea de estado"},"desc":{"en":"Configures the status line; describe what you want, or run without arguments to derive it from your shell prompt.","ja":"下部のステータスラインを設定します。表示したい内容を言葉で伝えるか、引数なしでシェルのプロンプトから自動設定。","zh":"配置底部状态栏。用文字描述想显示的内容，或不带参数从你的 shell 提示符自动配置。","zh-hant":"設定狀態列；描述你想顯示的內容，或不加參數，從你的 shell 提示字元自動產生。","ko":"상태 표시줄을 설정합니다. 원하는 내용을 설명하거나, 인수 없이 실행하면 셸 프롬프트를 바탕으로 만들어 줍니다.","ru":"Настраивает строку состояния: опишите, что хотите видеть, или запустите без аргументов, чтобы взять её из приглашения вашей оболочки.","es":"Configura la línea de estado; describe lo que quieres o ejecútalo sin argumentos para basarla en el prompt de tu shell."},"use":{"en":"`/statusline show the model and git branch`.","ja":"`/statusline 現在のモデルと git ブランチを表示`。","zh":"`/statusline 显示当前模型和 git 分支`。","zh-hant":"`/statusline 顯示模型和 git 分支`。","ko":"`/statusline 모델과 git 브랜치 표시`.","ru":"`/statusline показывай модель и ветку git`.","es":"`/statusline muestra el modelo y la rama de git`."}},{"cmd":"/terminal-setup","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"terminal setup","gloss":{"zh":"终端设置","ja":"ターミナルの設定","zh-hant":"終端機設定","ko":"터미널 설정","ru":"настройка терминала","es":"configuración de la terminal"},"desc":{"en":"Installs Shift+Enter for newlines in VS Code, Cursor, Devin Desktop, Alacritty or Zed; in Apple Terminal enables Option+Enter and disables the bell; in iTerm2 enables clipboard access for `/copy`.","ja":"VS Code・Cursor・Devin Desktop・Alacritty・Zed で Shift+Enter の改行を設定します。Apple のターミナルでは Option+Enter の改行とビープ音のオフ、iTerm2 では `/copy` 用のクリップボード許可を設定。","zh":"在 VS Code、Cursor、Devin Desktop、Alacritty、Zed 中安装 Shift+Enter 换行；Apple 终端改为 Option+Enter 并关闭提示音；iTerm2 中开启剪贴板权限让 `/copy` 可用。","zh-hant":"在 VS Code、Cursor、Devin Desktop、Alacritty 或 Zed 中設定 Shift+Enter 換行；在 Apple 終端機中啟用 Option+Enter 並關閉提示音；在 iTerm2 中開啟剪貼簿存取，讓 `/copy` 可以使用。","ko":"VS Code, Cursor, Devin Desktop, Alacritty, Zed에서 줄바꿈용 Shift+Enter를 설정합니다. Apple Terminal에서는 Option+Enter를 켜고 경고음을 끄며, iTerm2에서는 `/copy`를 위한 클립보드 접근을 허용합니다.","ru":"Включает Shift+Enter для новой строки в VS Code, Cursor, Devin Desktop, Alacritty или Zed; в Apple Terminal включает Option+Enter и отключает звуковой сигнал; в iTerm2 разрешает доступ к буферу обмена для `/copy`.","es":"Instala Shift+Enter para saltos de línea en VS Code, Cursor, Devin Desktop, Alacritty o Zed; en Apple Terminal activa Option+Enter y desactiva la campana; en iTerm2 activa el acceso al portapapeles para `/copy`."},"use":{"en":"Enter keeps sending half-written prompts: run this once.","ja":"Enter で書きかけの指示が送られてしまうなら一度実行。","zh":"一按回车就把没写完的需求发出去了？跑一次它。","zh-hant":"按 Enter 老是把寫到一半的提示送出去：執行一次這個指令。","ko":"Enter를 누르면 쓰다 만 프롬프트가 자꾸 전송될 때: 한 번 실행합니다.","ru":"Enter всё время отправляет недописанный запрос: выполните это один раз.","es":"Enter envía prompts a medio escribir: ejecútalo una vez."}},{"cmd":"/theme","args":"","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"theme","gloss":{"zh":"主题配色","ja":"テーマ","zh-hant":"主題配色","ko":"테마","ru":"тема","es":"tema"},"desc":{"en":"Changes the color theme: `auto`, light and dark, colorblind-accessible, ANSI and custom themes.","ja":"配色テーマを変えます：`auto`（ターミナルに合わせる）、ライト／ダーク、色覚多様性に配慮したテーマ、ANSI テーマ、カスタムテーマ。","zh":"更换配色主题：`auto` 跟随终端、浅色/深色、色觉友好主题、ANSI 主题和自定义主题。","zh-hant":"更換配色主題：`auto`、淺色和深色、色盲友善、ANSI 和自訂主題。","ko":"색 테마를 바꿉니다: `auto`, 밝은 테마와 어두운 테마, 색맹 친화 테마, ANSI 테마, 사용자 지정 테마.","ru":"Меняет цветовую тему: `auto`, светлые и тёмные, удобные при дальтонизме, ANSI и собственные темы.","es":"Cambia el tema de colores: `auto`, claro y oscuro, aptos para daltonismo, ANSI y temas personalizados."},"use":{"en":"Switch to a dark theme at night.","ja":"夜に目が疲れたらダークテーマに。","zh":"晚上看屏幕累，换深色主题。","zh-hant":"晚上切換成深色主題。","ko":"밤에는 어두운 테마로 바꿉니다.","ru":"Ночью переключитесь на тёмную тему.","es":"Cambia a un tema oscuro por la noche."}},{"cmd":"/tui","args":"[default|fullscreen]","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"TUI (text user interface)","gloss":{"zh":"终端文字界面","ja":"テキスト UI","zh-hant":"TUI（文字使用者介面）","ko":"TUI (텍스트 사용자 인터페이스)","ru":"TUI (текстовый интерфейс)","es":"TUI (interfaz de usuario de texto)"},"desc":{"en":"Sets the terminal renderer and relaunches with the conversation intact. `fullscreen` is the flicker-free renderer.","ja":"ターミナル UI の描画方式を設定し、会話を保ったまま再起動します。`fullscreen` はちらつかない全画面表示。引数なしで現在の方式を表示。","zh":"设置终端界面渲染方式并保留对话重新启动。`fullscreen` 为不闪烁的全屏模式；不带参数显示当前方式。","zh-hant":"設定終端機的渲染方式，並在保留對話的情況下重新啟動。`fullscreen` 是不會閃爍的渲染方式。","ko":"터미널 렌더러를 정하고, 대화를 유지한 채 다시 실행합니다. `fullscreen`은 화면 깜박임이 없는 렌더러입니다.","ru":"Выбирает способ отрисовки в терминале и перезапускается, сохраняя разговор. `fullscreen` — отрисовка без мерцания.","es":"Define el renderizador de la terminal y reinicia con la conversación intacta. `fullscreen` es el renderizador sin parpadeo."},"use":{"en":"Screen flickers: `/tui fullscreen`.","ja":"画面がちらつくなら：`/tui fullscreen`。","zh":"终端画面闪烁时：`/tui fullscreen`。","zh-hant":"畫面閃爍時：`/tui fullscreen`。","ko":"화면이 깜박일 때: `/tui fullscreen`.","ru":"Экран мерцает: `/tui fullscreen`.","es":"La pantalla parpadea: `/tui fullscreen`."}},{"cmd":"/voice","args":"[hold|tap|off]","cat":"ui","kind":"builtin","pick":false,"aliases":[],"word":"voice","gloss":{"zh":"语音","ja":"音声","zh-hant":"語音","ko":"음성","ru":"голос","es":"voz"},"desc":{"en":"Toggles voice dictation or sets a mode (`hold`, `tap`). Requires a Claude.ai account.","ja":"音声入力を切り替えます。`hold`（押している間）・`tap`（タップで開始）を指定可能。Claude.ai アカウントが必要。","zh":"开关语音输入，或指定模式：`hold` 按住说话、`tap` 点按开始。需要 Claude.ai 账号。","zh-hant":"開關語音輸入，或設定模式（`hold`、`tap`）。需要 Claude.ai 帳號。","ko":"음성 받아쓰기를 켜고 끄거나 모드(`hold`, `tap`)를 정합니다. Claude.ai 계정이 필요합니다.","ru":"Включает и выключает голосовой ввод или задаёт режим (`hold`, `tap`). Нужен аккаунт Claude.ai.","es":"Activa o desactiva el dictado por voz o elige un modo (`hold`, `tap`). Requiere una cuenta de Claude.ai."},"use":{"en":"Dictate instructions instead of typing.","ja":"入力が遅いときは日本語で話して指示。","zh":"打字慢、英文键盘不熟时，直接说中文下指令。","zh-hant":"用說的下指示，不必打字。","ko":"타이핑 대신 말로 지시합니다.","ru":"Диктуйте указания вместо того, чтобы печатать.","es":"Dicta instrucciones en lugar de escribirlas."}},{"cmd":"/usage","args":"","cat":"account","kind":"builtin","pick":true,"aliases":["/cost","/stats"],"short":{"en":"Check cost and plan limits","ja":"料金と使用量の上限を確認する","zh":"查看费用和额度","zh-hant":"查看費用和方案上限","ko":"비용과 플랜 한도 확인","ru":"Проверить стоимость и лимиты тарифа","es":"Ver el costo y los límites del plan"},"word":"usage","gloss":{"zh":"用量","ja":"使用量","zh-hant":"用量","ko":"사용량","ru":"использование, расход","es":"uso"},"desc":{"en":"Shows session cost, plan usage limits and activity stats, including what counts against plan limits on subscriptions. `/stats` opens the Stats tab.","ja":"このセッションの費用、プランの使用量上限、利用統計を表示します。サブスクリプションでは上限に数えられる内訳も表示。`/stats` は統計タブで開きます。","zh":"显示本次会话费用、套餐用量上限和活动统计。订阅套餐会显示哪些消耗计入额度。`/stats` 打开统计标签页。","zh-hant":"顯示這次工作階段的費用、方案用量上限和活動統計，包括訂閱方案中哪些項目會計入上限。`/stats` 會開啟統計分頁。","ko":"세션 비용, 플랜 사용 한도, 활동 통계를 보여 줍니다. 구독 플랜에서 무엇이 한도에 포함되는지도 표시합니다. `/stats`는 Stats 탭을 엽니다.","ru":"Показывает стоимость сессии, лимиты тарифа и статистику активности, в том числе что учитывается в лимитах подписки. `/stats` открывает вкладку Stats.","es":"Muestra el costo de la sesión, los límites de uso del plan y estadísticas de actividad, incluido lo que cuenta para los límites del plan en las suscripciones. `/stats` abre la pestaña Stats."},"use":{"en":"Check `/usage` before deciding whether to switch to a cheaper model.","ja":"上限が心配なら `/usage` で確認し、安いモデルに替えるか判断。","zh":"担心额度不够时 `/usage` 看一眼，再决定是否换较省的模型。","zh-hant":"決定要不要換成比較便宜的模型之前，先看一下 `/usage`。","ko":"더 저렴한 모델로 바꿀지 정하기 전에 `/usage`를 확인합니다.","ru":"Проверьте `/usage`, прежде чем решать, переходить ли на более дешёвую модель.","es":"Revisa `/usage` antes de decidir si cambias a un modelo más barato."}},{"cmd":"/login","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"log in","gloss":{"zh":"登录","ja":"ログイン","zh-hant":"登入","ko":"로그인","ru":"войти","es":"iniciar sesión"},"desc":{"en":"Signs in to your Anthropic account.","ja":"Anthropic アカウントにログインします。","zh":"登录 Anthropic 账号。","zh-hant":"登入你的 Anthropic 帳號。","ko":"Anthropic 계정에 로그인합니다.","ru":"Входит в ваш аккаунт Anthropic.","es":"Inicia sesión en tu cuenta de Anthropic."},"use":{"en":"New machine or expired session.","ja":"パソコンを替えたとき、ログインが切れたとき。","zh":"换电脑或登录过期时。","zh-hant":"換新電腦或登入過期時。","ko":"새 컴퓨터를 쓸 때나 세션이 만료되었을 때.","ru":"Новый компьютер или истёкшая сессия.","es":"En un equipo nuevo o cuando la sesión caducó."}},{"cmd":"/logout","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"log out","gloss":{"zh":"退出登录","ja":"ログアウト","zh-hant":"登出","ko":"로그아웃","ru":"выйти","es":"cerrar sesión"},"desc":{"en":"Signs out of your Anthropic account.","ja":"Anthropic アカウントからログアウトします。","zh":"退出 Anthropic 账号。","zh-hant":"登出你的 Anthropic 帳號。","ko":"Anthropic 계정에서 로그아웃합니다.","ru":"Выходит из вашего аккаунта Anthropic.","es":"Cierra la sesión de tu cuenta de Anthropic."},"use":{"en":"After using a shared computer.","ja":"共用パソコンで使い終わったとき。","zh":"在共用电脑上用完后。","zh-hant":"用完共用電腦之後。","ko":"공용 컴퓨터를 쓴 뒤에.","ru":"После работы на общем компьютере.","es":"Después de usar un equipo compartido."}},{"cmd":"/passes","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"passes","gloss":{"zh":"体验券","ja":"招待パス","zh-hant":"體驗券","ko":"초대 패스","ru":"пропуски, приглашения","es":"pases de invitación"},"desc":{"en":"Shares a free week of Claude Code with friends; only shown to eligible accounts.","ja":"Claude Code の 1 週間無料体験を友人に共有します。対象アカウントのみ表示。","zh":"把一周免费 Claude Code 分享给朋友。仅在账号符合条件时显示。","zh-hant":"和朋友分享一週免費的 Claude Code；只有符合資格的帳號才會顯示。","ko":"친구에게 Claude Code 무료 1주일 이용권을 공유합니다. 자격이 있는 계정에만 표시됩니다.","ru":"Позволяет подарить друзьям бесплатную неделю Claude Code; показывается только подходящим аккаунтам.","es":"Comparte una semana gratis de Claude Code con amigos; solo aparece en cuentas que cumplen los requisitos."},"use":{"en":"Invite a friend to try it.","ja":"友人に試してもらう。","zh":"推荐朋友试用。","zh-hant":"邀請朋友試用。","ko":"친구가 써 볼 수 있게 초대합니다.","ru":"Пригласите друга попробовать.","es":"Invita a un amigo a probarlo."}},{"cmd":"/rate-limit-options","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"rate limit options","gloss":{"zh":"用量上限的应对选项","ja":"使用量上限への対処","zh-hant":"用量上限的應對選項","ko":"사용 한도 대처 방법","ru":"варианты при лимите","es":"opciones ante el límite de uso"},"desc":{"en":"Shows ways to keep working when a claude.ai limit blocks you: wait and auto-continue, add usage credits, or upgrade. Requires a claude.ai subscription.","ja":"claude.ai の使用量上限で止まったときの選択肢を表示します：リセット後に自動で続ける、クレジットを追加、プランを上げる。claude.ai のサブスクリプションが必要。","zh":"claude.ai 用量上限阻止请求时显示选项：等待重置后自动继续、添加用量额度或升级套餐。需要 claude.ai 订阅。","zh-hant":"當 claude.ai 的用量上限擋住你時，顯示可以繼續工作的方法：等待並自動繼續、加購用量額度，或升級。需要 claude.ai 訂閱。","ko":"claude.ai 한도에 걸려 작업이 막혔을 때 계속하는 방법을 보여 줍니다: 기다렸다가 자동으로 이어서 하기, 사용량 크레딧 추가, 업그레이드. claude.ai 구독이 필요합니다.","ru":"Показывает, как продолжить работу, когда вас остановил лимит claude.ai: подождать и продолжить автоматически, добавить кредиты использования или повысить тариф. Нужна подписка claude.ai.","es":"Muestra formas de seguir trabajando cuando un límite de claude.ai te bloquea: esperar y continuar automáticamente, añadir créditos de uso o mejorar el plan. Requiere una suscripción a claude.ai."},"use":{"en":"Blocked overnight: choose auto-continue after reset.","ja":"夜間の作業が上限で止まったら「リセット後に自動で続ける」を選ぶ。","zh":"深夜跑任务被限额卡住：选择「重置后自动继续」，第二天醒来已完成。","zh-hant":"半夜被上限擋住：選擇在重設後自動繼續。","ko":"밤새 작업이 막혔다면: 한도가 초기화된 뒤 자동으로 이어서 하기를 선택합니다.","ru":"Работа остановилась на ночь: выберите автоматическое продолжение после сброса лимита.","es":"Te bloqueó de noche: elige continuar automáticamente cuando se restablezca."}},{"cmd":"/status","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"status","gloss":{"zh":"状态","ja":"ステータス","zh-hant":"狀態","ko":"상태","ru":"состояние","es":"estado"},"desc":{"en":"Opens Settings on the Status tab: version, model, account, connectivity. Works while Claude is responding.","ja":"設定の「ステータス」タブを開き、バージョン・モデル・アカウント・接続状況を表示します。応答中でも使えます。","zh":"打开设置的「状态」页：版本、模型、账号、连接情况。Claude 回复中也能运行。","zh-hant":"開啟設定的「狀態」分頁：版本、模型、帳號、連線狀況。Claude 正在回答時也能使用。","ko":"설정 화면의 Status 탭을 엽니다: 버전, 모델, 계정, 연결 상태. Claude가 응답하는 중에도 동작합니다.","ru":"Открывает настройки на вкладке Status: версия, модель, аккаунт, подключение. Работает, пока Claude отвечает.","es":"Abre la configuración en la pestaña Status: versión, modelo, cuenta y conectividad. Funciona mientras Claude responde."},"use":{"en":"Screenshot `/status` before asking for help.","ja":"人に相談する前に `/status` の画面を撮っておく。","zh":"向别人求助前先截一张 `/status` 的图。","zh-hant":"向別人求助之前，先截一張 `/status` 的畫面。","ko":"도움을 요청하기 전에 `/status` 화면을 캡처해 둡니다.","ru":"Сделайте снимок экрана `/status`, прежде чем просить помощи.","es":"Haz una captura de `/status` antes de pedir ayuda."}},{"cmd":"/upgrade","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"word":"upgrade","gloss":{"zh":"升级","ja":"アップグレード","zh-hant":"升級","ko":"업그레이드","ru":"повысить тариф","es":"mejorar el plan"},"desc":{"en":"Opens the upgrade page in your browser.","ja":"上位プランへのアップグレードページをブラウザーで開きます。","zh":"在浏览器打开升级套餐的页面。","zh-hant":"在瀏覽器中開啟升級頁面。","ko":"브라우저에서 업그레이드 페이지를 엽니다.","ru":"Открывает в браузере страницу повышения тарифа.","es":"Abre la página para mejorar el plan en tu navegador."},"use":{"en":"When you keep hitting limits.","ja":"いつも使用量が足りないとき。","zh":"额度经常不够用时。","zh-hant":"老是碰到用量上限時。","ko":"한도에 자주 걸릴 때.","ru":"Когда вы постоянно упираетесь в лимиты.","es":"Cuando llegas a los límites una y otra vez."}},{"cmd":"/usage-credits","args":"","cat":"account","kind":"builtin","pick":false,"aliases":[],"risk":["cost"],"word":"usage credits","gloss":{"zh":"用量额度","ja":"使用量クレジット","zh-hant":"用量額度","ko":"사용량 크레딧","ru":"кредиты использования","es":"créditos de uso"},"desc":{"en":"Configures or requests usage credits; Team and Enterprise members without billing access send a request to their admin. Previously `/extra-usage`.","ja":"上限に達したときにクレジットを設定・申請します。請求設定ページを開くか、Team／Enterprise で請求権限がない場合は管理者に申請を送ります。旧名 `/extra-usage`。","zh":"达到上限时配置或申请用量额度：打开账单设置页；Team/Enterprise 无账单权限的成员则向管理员发送申请。旧名 `/extra-usage`。","zh-hant":"設定或申請用量額度；沒有帳單權限的 Team 和 Enterprise 成員會向管理員送出申請。以前叫 `/extra-usage`。","ko":"사용량 크레딧을 설정하거나 요청합니다. 결제 권한이 없는 Team 및 Enterprise 구성원은 관리자에게 요청을 보냅니다. 이전 이름은 `/extra-usage`입니다.","ru":"Настраивает кредиты использования или запрашивает их; участники Team и Enterprise без доступа к оплате отправляют запрос администратору. Раньше называлась `/extra-usage`.","es":"Configura o solicita créditos de uso; los miembros de Team y Enterprise sin acceso a la facturación envían una solicitud a su administrador. Antes era `/extra-usage`."},"use":{"en":"Request credits from your admin when the team runs out.","ja":"チームの上限に達したら管理者に申請。","zh":"团队账号用完额度，向管理员申请。","zh-hant":"團隊額度用完時，向管理員申請額度。","ko":"팀의 사용량이 바닥나면 관리자에게 크레딧을 요청합니다.","ru":"Попросите кредиты у администратора, когда у команды они закончились.","es":"Pide créditos a tu administrador cuando el equipo se queda sin ellos."}},{"cmd":"/desktop","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":["/app"],"word":"desktop","gloss":{"zh":"桌面应用","ja":"デスクトップアプリ","zh-hant":"桌面應用程式","ko":"데스크톱 앱","ru":"настольное приложение","es":"aplicación de escritorio"},"desc":{"en":"Continues the session in the Claude Code Desktop app. Requires macOS or x64 Windows and a Claude subscription.","ja":"今のセッションを Claude Code のデスクトップアプリで続けます。macOS か x64 Windows と Claude のサブスクリプションが必要。","zh":"在 Claude Code 桌面 App 中继续当前会话。需要 macOS 或 x64 Windows 及 Claude 订阅。","zh-hant":"在 Claude Code 桌面版 App 中繼續這次工作階段。需要 macOS 或 x64 Windows，以及 Claude 訂閱。","ko":"Claude Code Desktop 앱에서 세션을 이어갑니다. macOS 또는 x64 Windows와 Claude 구독이 필요합니다.","ru":"Продолжает сессию в приложении Claude Code Desktop. Нужны macOS или Windows x64 и подписка Claude.","es":"Continúa la sesión en la aplicación Claude Code Desktop. Requiere macOS o Windows x64 y una suscripción a Claude."},"use":{"en":"Move from the terminal to the desktop app.","ja":"ターミナルからグラフィカルなアプリに移りたいとき。","zh":"终端里聊着想换成有图形界面的 App。","zh-hant":"從終端機換到桌面版 App。","ko":"터미널에서 데스크톱 앱으로 옮겨 갈 때.","ru":"Перейти из терминала в настольное приложение.","es":"Pasa de la terminal a la aplicación de escritorio."}},{"cmd":"/mobile","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":["/ios","/android"],"word":"mobile","gloss":{"zh":"手机","ja":"スマートフォン","zh-hant":"手機","ko":"모바일 (스마트폰)","ru":"мобильное приложение","es":"móvil"},"desc":{"en":"Shows a QR code to download the Claude mobile app.","ja":"Claude モバイルアプリのダウンロード用 QR コードを表示します。","zh":"显示下载 Claude 手机 App 的二维码。","zh-hant":"顯示下載 Claude 手機 App 的 QR code。","ko":"Claude 모바일 앱을 내려받을 수 있는 QR 코드를 보여 줍니다.","ru":"Показывает QR-код для загрузки мобильного приложения Claude.","es":"Muestra un código QR para descargar la aplicación móvil de Claude."},"use":{"en":"To follow along from your phone.","ja":"スマホで進み具合を見たり操作したりしたいとき。","zh":"想在手机上查看进度或远程操作。","zh-hant":"想用手機跟上進度時。","ko":"휴대폰으로 진행 상황을 따라가고 싶을 때.","ru":"Чтобы следить за работой с телефона.","es":"Para seguir el trabajo desde tu teléfono."}},{"cmd":"/remote-control","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":["/rc"],"risk":["external"],"word":"remote control","gloss":{"zh":"远程控制","ja":"リモート操作","zh-hant":"遠端控制","ko":"원격 조작","ru":"удалённое управление","es":"control remoto"},"desc":{"en":"Makes this session available for Remote Control from claude.ai. Requires a claude.ai subscription.","ja":"このセッションを claude.ai（Web やスマホ）から操作できるようにします。claude.ai のサブスクリプションが必要。","zh":"让本会话可以从 claude.ai（网页或手机）远程操作。需要 claude.ai 订阅。","zh-hant":"讓這次工作階段可以從 claude.ai 進行遠端控制（Remote Control）。需要 claude.ai 訂閱。","ko":"이 세션을 claude.ai에서 Remote Control로 조작할 수 있게 합니다. claude.ai 구독이 필요합니다.","ru":"Делает эту сессию доступной для Remote Control с claude.ai. Нужна подписка claude.ai.","es":"Hace que esta sesión esté disponible para Remote Control desde claude.ai. Requiere una suscripción a claude.ai."},"use":{"en":"Leave the task running and steer it from your phone: `/rc`.","ja":"パソコンで作業を動かしたまま外出し、スマホから指示：`/rc`。","zh":"电脑上开着任务出门，用手机继续指挥：`/rc`。","zh-hant":"讓工作繼續執行，用手機下指示：`/rc`。","ko":"작업을 실행해 둔 채 휴대폰으로 지시하고 싶을 때: `/rc`.","ru":"Оставьте задачу работать и управляйте ею с телефона: `/rc`.","es":"Deja la tarea en marcha y dirígela desde tu teléfono: `/rc`."}},{"cmd":"/remote-env","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":[],"word":"remote environment","gloss":{"zh":"云端环境","ja":"リモート環境","zh-hant":"遠端環境（雲端環境）","ko":"원격 환경","ru":"удалённое окружение","es":"entorno remoto"},"desc":{"en":"Chooses the default cloud environment for cloud sessions started from the CLI.","ja":"CLI からクラウドセッションを始めるときの既定の環境を選びます。","zh":"选择从命令行启动云端会话时默认使用的云端环境。","zh-hant":"選擇從 CLI 啟動雲端工作階段時預設使用的雲端環境。","ko":"CLI에서 시작하는 클라우드 세션의 기본 클라우드 환경을 고릅니다.","ru":"Выбирает облачное окружение по умолчанию для облачных сессий, запущенных из CLI.","es":"Elige el entorno en la nube predeterminado para las sesiones en la nube iniciadas desde la CLI."},"use":{"en":"Pick a default when you have several environments.","ja":"複数のクラウド環境があるとき既定を決める。","zh":"有多个云端环境时设一个默认值。","zh-hant":"有好幾個環境時，選一個當預設值。","ko":"환경이 여러 개일 때 기본값을 정합니다.","ru":"Выберите окружение по умолчанию, если их у вас несколько.","es":"Elige uno predeterminado cuando tienes varios entornos."}},{"cmd":"/setup-bedrock","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":[],"word":"set up Bedrock","gloss":{"zh":"配置 Amazon Bedrock","ja":"Amazon Bedrock の設定","zh-hant":"設定 Amazon Bedrock","ko":"Bedrock 설정","ru":"настроить Bedrock","es":"configurar Bedrock"},"desc":{"en":"Configures Amazon Bedrock auth, region and model pins via a wizard. Hidden from the menu until `CLAUDE_CODE_USE_BEDROCK=1` is set; type it in full.","ja":"ウィザードで Amazon Bedrock の認証・リージョン・モデルを設定します。`CLAUDE_CODE_USE_BEDROCK=1` を設定するまでメニューに出ないので、全部入力します。","zh":"通过向导配置 Amazon Bedrock 的认证、区域和模型。设置 `CLAUDE_CODE_USE_BEDROCK=1` 之前不会出现在菜单中，需要完整输入。","zh-hant":"透過精靈設定 Amazon Bedrock 的驗證、區域和固定使用的模型。設定 `CLAUDE_CODE_USE_BEDROCK=1` 之前不會出現在選單中；需要完整輸入。","ko":"마법사를 통해 Amazon Bedrock 인증, 리전, 모델 고정을 설정합니다. `CLAUDE_CODE_USE_BEDROCK=1`을 설정하기 전에는 메뉴에 보이지 않으니 전체 이름을 직접 입력하세요.","ru":"С помощью мастера настраивает авторизацию Amazon Bedrock, регион и закреплённые модели. Скрыта в меню, пока не задано `CLAUDE_CODE_USE_BEDROCK=1`; вводите её полностью.","es":"Configura con un asistente la autenticación, la región y los modelos fijos de Amazon Bedrock. Está oculto en el menú hasta que se define `CLAUDE_CODE_USE_BEDROCK=1`; escríbelo completo."},"use":{"en":"Your company uses Claude through AWS.","ja":"会社で AWS 経由で Claude を使うとき。","zh":"公司通过 AWS 使用 Claude 时。","zh-hant":"你的公司透過 AWS 使用 Claude 時。","ko":"회사에서 AWS를 통해 Claude를 쓸 때.","ru":"Ваша компания использует Claude через AWS.","es":"Tu empresa usa Claude a través de AWS."}},{"cmd":"/setup-vertex","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":[],"word":"set up Vertex","gloss":{"zh":"配置 Google Cloud","ja":"Google Cloud の設定","zh-hant":"設定 Google Cloud","ko":"Vertex 설정","ru":"настроить Vertex","es":"configurar Vertex"},"desc":{"en":"Configures Google Cloud's Agent Platform via a wizard. Hidden until `CLAUDE_CODE_USE_VERTEX=1` is set; type it in full.","ja":"ウィザードで Google Cloud Agent Platform の認証・プロジェクト・リージョン・モデルを設定します。`CLAUDE_CODE_USE_VERTEX=1` を設定するまでメニューに出ないので、全部入力します。","zh":"通过向导配置 Google Cloud Agent Platform 的认证、项目、区域和模型。设置 `CLAUDE_CODE_USE_VERTEX=1` 之前不会出现在菜单中，需要完整输入。","zh-hant":"透過精靈設定 Google Cloud 的 Agent Platform。設定 `CLAUDE_CODE_USE_VERTEX=1` 之前不會出現在選單中；需要完整輸入。","ko":"마법사를 통해 Google Cloud의 Agent Platform을 설정합니다. `CLAUDE_CODE_USE_VERTEX=1`을 설정하기 전에는 보이지 않으니 전체 이름을 직접 입력하세요.","ru":"С помощью мастера настраивает Agent Platform в Google Cloud. Скрыта, пока не задано `CLAUDE_CODE_USE_VERTEX=1`; вводите её полностью.","es":"Configura con un asistente Agent Platform de Google Cloud. Está oculto hasta que se define `CLAUDE_CODE_USE_VERTEX=1`; escríbelo completo."},"use":{"en":"Your company uses Claude through Google Cloud.","ja":"会社で Google Cloud 経由で Claude を使うとき。","zh":"公司通过 Google Cloud 使用 Claude 时。","zh-hant":"你的公司透過 Google Cloud 使用 Claude 時。","ko":"회사에서 Google Cloud를 통해 Claude를 쓸 때.","ru":"Ваша компания использует Claude через Google Cloud.","es":"Tu empresa usa Claude a través de Google Cloud."}},{"cmd":"/teleport","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":["/tp"],"word":"teleport","gloss":{"zh":"瞬间移动","ja":"テレポート","zh-hant":"瞬間移動","ko":"텔레포트 (순간 이동)","ru":"телепорт","es":"teletransportar"},"desc":{"en":"Pulls a cloud session into this terminal, fetching its branch and conversation. Requires a claude.ai subscription.","ja":"クラウドのセッションをこのターミナルに取り込みます（ブランチと会話を取得）。claude.ai のサブスクリプションが必要。","zh":"把云端会话拉到本地终端：选择后获取分支和对话。需要 claude.ai 订阅。","zh-hant":"把雲端工作階段拉到這個終端機，同時取得它的分支和對話。需要 claude.ai 訂閱。","ko":"클라우드 세션을 이 터미널로 가져오고, 그 브랜치와 대화를 받아옵니다. claude.ai 구독이 필요합니다.","ru":"Переносит облачную сессию в этот терминал, загружая её ветку и разговор. Нужна подписка claude.ai.","es":"Trae una sesión en la nube a esta terminal, con su rama y su conversación. Requiere una suscripción a claude.ai."},"use":{"en":"Continue a web-started task locally.","ja":"Web 版で始めた作業をローカルで続ける。","zh":"在网页版开始的任务，拉回本地继续。","zh-hant":"在本機繼續從網頁版開始的工作。","ko":"웹에서 시작한 작업을 로컬에서 이어서 합니다.","ru":"Продолжить локально задачу, начатую в веб-версии.","es":"Continúa en local una tarea que empezaste en la web."}},{"cmd":"/web-setup","args":"","cat":"remote","kind":"builtin","pick":false,"aliases":[],"word":"web setup","gloss":{"zh":"网页版设置","ja":"Web 版の設定","zh-hant":"網頁版設定","ko":"웹 설정","ru":"настройка веб-версии","es":"configuración de la versión web"},"desc":{"en":"Connects GitHub for cloud sessions using your local `gh` credentials.","ja":"ローカルの `gh` CLI の認証情報を使って、クラウドセッション用に GitHub アカウントを接続します。","zh":"用本地 `gh` 命令行的登录信息，为云端会话连接 GitHub 账号。","zh-hant":"用你本機的 `gh` 登入資訊，為雲端工作階段連接 GitHub。","ko":"로컬 `gh` 인증 정보를 사용해 클라우드 세션용 GitHub를 연결합니다.","ru":"Подключает GitHub для облачных сессий с помощью ваших локальных учётных данных `gh`.","es":"Conecta GitHub para las sesiones en la nube usando tus credenciales locales de `gh`."},"use":{"en":"Before your first cloud session.","ja":"クラウドセッションを初めて使う前に。","zh":"第一次使用云端会话前。","zh-hant":"第一次使用雲端工作階段之前。","ko":"처음 클라우드 세션을 쓰기 전에.","ru":"Перед первой облачной сессией.","es":"Antes de tu primera sesión en la nube."}},{"cmd":"/doctor","args":"[prompt-audit [path]]","cat":"support","kind":"skill","pick":true,"aliases":["/checkup"],"short":{"en":"Run a checkup when something is wrong","ja":"困ったらまず健康診断","zh":"出问题时先体检","zh-hant":"出問題時做一次健檢","ko":"문제가 생겼을 때 점검 실행","ru":"Запустить проверку, если что-то не так","es":"Hacer un chequeo cuando algo falla"},"word":"doctor","gloss":{"zh":"医生（体检）","ja":"ドクター（健康診断）","zh-hant":"醫生（健檢）","ko":"닥터 (건강 진단)","ru":"доктор (диагностика)","es":"médico (chequeo)"},"desc":{"en":"Runs a setup checkup for installation, settings, extensions and `CLAUDE.md`, proposing fixes Claude applies after you confirm. `prompt-audit` audits your instructions instead.","ja":"インストール・設定・拡張・`CLAUDE.md` の問題を診断し、修正案を出します。確認後に Claude が修正。`prompt-audit` で指示ファイルの監査に切り替え。","zh":"体检：诊断安装、设置、扩展和 `CLAUDE.md` 的问题并提出修复方案，你确认后 Claude 才会修改。`prompt-audit` 改为审查你的说明文件。","zh-hant":"為安裝、設定、擴充功能和 `CLAUDE.md` 做健檢，並提出修正方案，經你確認後由 Claude 套用。`prompt-audit` 則改為審查你的說明內容。","ko":"설치, 설정, 확장 기능, `CLAUDE.md`를 점검하고 수정안을 제안하며, 확인하면 Claude가 적용합니다. `prompt-audit`를 붙이면 대신 내 지침을 점검합니다.","ru":"Проверяет установку, настройки, расширения и `CLAUDE.md` и предлагает исправления, которые Claude применит после вашего подтверждения. `prompt-audit` вместо этого проверяет ваши инструкции.","es":"Hace un chequeo de la instalación, la configuración, las extensiones y `CLAUDE.md`, y propone correcciones que Claude aplica después de que confirmes. `prompt-audit` revisa en cambio tus instrucciones."},"use":{"en":"Something feels broken: start with `/doctor`.","ja":"原因不明の不具合が起きたら、まず `/doctor`。","zh":"Claude Code 出现莫名其妙的问题时，第一步 `/doctor`。","zh-hant":"感覺哪裡怪怪的：先執行 `/doctor`。","ko":"뭔가 고장 난 것 같을 때: 먼저 `/doctor`부터.","ru":"Кажется, что-то сломалось: начните с `/doctor`.","es":"Algo parece roto: empieza con `/doctor`."}},{"cmd":"/help","args":"","cat":"support","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Show help and all commands","ja":"ヘルプとコマンド一覧を見る","zh":"查看帮助和全部命令","zh-hant":"顯示說明和所有指令","ko":"도움말과 전체 명령 보기","ru":"Показать справку и все команды","es":"Ver la ayuda y todos los comandos"},"word":"help","gloss":{"zh":"帮助","ja":"ヘルプ","zh-hant":"說明","ko":"도움말","ru":"помощь","es":"ayuda"},"desc":{"en":"Shows help and available commands.","ja":"ヘルプと使えるコマンドを表示します。","zh":"显示帮助和可用命令。","zh-hant":"顯示說明和可用的指令。","ko":"도움말과 사용할 수 있는 명령을 보여 줍니다.","ru":"Показывает справку и доступные команды.","es":"Muestra la ayuda y los comandos disponibles."},"use":{"en":"Forgot a command: `/help`, or type `/` plus a few letters.","ja":"コマンド名を忘れたら `/help`、または `/` と数文字で絞り込み。","zh":"忘了命令名时先打 `/help`，或打 `/` 加几个字母筛选。","zh-hant":"忘了某個指令：`/help`，或輸入 `/` 加幾個字母。","ko":"명령 이름이 기억나지 않을 때: `/help`, 또는 `/`와 몇 글자를 입력합니다.","ru":"Забыли команду: `/help` или введите `/` и несколько букв.","es":"Olvidaste un comando: `/help`, o escribe `/` y unas letras."}},{"cmd":"/powerup","args":"","cat":"support","kind":"builtin","pick":true,"aliases":[],"short":{"en":"Learn features through interactive lessons","ja":"対話型レッスンで機能を学ぶ","zh":"互动课程，系统学习功能","zh-hant":"用互動課程學習功能","ko":"대화형 레슨으로 기능 배우기","ru":"Изучить возможности в интерактивных уроках","es":"Aprender funciones con lecciones interactivas"},"word":"power up","gloss":{"zh":"能力提升","ja":"パワーアップ","zh-hant":"能力提升","ko":"파워업","ru":"прокачка","es":"potenciar"},"desc":{"en":"Interactive lessons with animated demos that teach Claude Code features.","ja":"アニメーション付きの短い対話型レッスンで Claude Code の機能を学べます。","zh":"通过带动画演示的互动小课程学习 Claude Code 的功能。","zh-hant":"附有動畫示範的互動式課程，教你 Claude Code 的各種功能。","ko":"애니메이션 데모로 Claude Code 기능을 가르쳐 주는 대화형 레슨입니다.","ru":"Интерактивные уроки с анимированными примерами, которые знакомят с возможностями Claude Code.","es":"Lecciones interactivas con demostraciones animadas que enseñan las funciones de Claude Code."},"use":{"en":"The best structured starting point for newcomers.","ja":"初心者がまとめて学ぶのに最適。","zh":"新手系统学习的最佳入口。","zh-hant":"新手有系統地入門的最佳起點。","ko":"처음 시작하는 사람에게 가장 체계적인 출발점입니다.","ru":"Лучшая пошаговая отправная точка для новичков.","es":"El mejor punto de partida estructurado para quien empieza."}},{"cmd":"/bug","args":"[report]","cat":"support","kind":"builtin","pick":false,"aliases":["/share"],"risk":["external","secrets"],"word":"bug","gloss":{"zh":"程序缺陷","ja":"不具合・バグ","zh-hant":"程式錯誤（bug）","ko":"버그","ru":"ошибка, баг","es":"error, fallo"},"desc":{"en":"Reports a bug or shares your conversation; you c
