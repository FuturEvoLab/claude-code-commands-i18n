name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate data and regenerate outputs
        run: python3 scripts/build.py
      - name: Run tests
        run: python3 scripts/test_build.py
      - name: Fail if generated files are out of date
        run: git diff --exit-code -- README.md README.zh-CN.md README.ja.md docs/index.html
